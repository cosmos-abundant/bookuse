<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 7-4 | ch07-fig04  (★ 7장 한정 예외 도판 — style.md §6-1)
  삽입 위치: 7장 "같은 척도로 비교한 건가" 절 후반(그림 크기 함정). 기준 문장 "...정작
    정보는 넓이에 담겨 있어서 차이가 제곱으로 과장된다."(47행) 다음에 본문이 [그림 7-4]
    자리를 표시(49행). (왼쪽) 폭을 2배로 키운 원: 넓이가 4배로 부풀어 보임 vs (오른쪽)
    넓이를 2배로 맞춘 원: 값에 정확히 비례.
  캡션: 그림 7-4. 값 2배를 그리는 두 방법 — 왼쪽은 원의 폭(지름)을 2배로 키웠다. 그러면
    눈에는 2배가 아니라 4배로 들어온다. 폭이 두 배면 넓이는 네 배가 되기 때문이다. 오른쪽은
    넓이를 정확히 2배로 맞췄다 — 그래서 폭은 약 1.4배지만 차지하는 넓이는 값 그대로 2배다.
    값은 둘 다 똑같이 "2배"인데, 폭으로 키운 왼쪽은 그 차이를 제곱으로 부풀린다. 그림 크기로
    값을 보여 주는 차트(원·아이콘)를 받으면, 폭이 아니라 넓이가 값에 비례하는지를 본다.
    그래서 되묻는다: "같은 척도로 비교한 건가요?" — 같은 잣대(넓이)로 잰 게 맞는가.
    (왼쪽이 함정, 오른쪽이 정직.)
  대체 텍스트(접근성): "값이 2배"라는 똑같은 정보를 원 두 개로 보여 주는 두 가지 방법을
    나란히 대비한 그림. 양쪽 모두 작은 기준 원(값 1)이 하나 있고, 그 옆에 "값 2배"를 나타
    내는 큰 원이 있다. 왼쪽은 함정 버전이다 — 큰 원의 폭(지름)을 작은 원의 2배로 키웠다.
    그러나 폭을 2배로 하면 원이 차지하는 넓이는 2배가 아니라 4배가 된다. 그래서 눈에는 값이
    2배가 아니라 4배로 부풀어 들어온다. 왼쪽에는 경고 라벨이 붙는다 — "함정: 폭은 2배지만
    넓이는 4배". 오른쪽은 정직한 버전이다 — 큰 원의 넓이를 작은 원의 정확히 2배로 맞췄다.
    그래서 폭(지름)은 약 1.4배밖에 안 되지만, 차지하는 넓이는 값과 똑같이 2배다. 핵심은
    이것이다 — 사람 눈은 원의 크기를 넓이보다 폭으로 먼저 지각하는데, 정보는 넓이에 담겨
    있어서, 폭을 값에 맞춰 키우면 차이가 제곱으로 과장된다(값 2배가 넓이 4배, 값 3배가 넓이
    9배). 그래서 그림 크기로 값을 보여 주는 차트는 폭이 아니라 넓이가 값에 비례하는지를
    봐야 한다.
  ★ 7장 예외(style.md §6-1) 준수: ① 나쁜 예(왼쪽)에 경고 라벨 "함정: 폭은 2배지만 넓이는
    4배"를 명시. ② 정직 버전(넓이를 2배로 맞춘 원, 오른쪽)을 짝으로 함께 제시. ③ 함정
    시연용 — 강조색은 왜곡 쪽이 아니라 되묻기 한 줄에만. 수치 무결성: 본문 47행 "값이 두
    배일 때 원을 폭만 두 배로 키우면 넓이는 네 배" + 자료카드 03("값 2배=면적 4배, 지름이
    아니라 면적으로 스케일")과 일치. 원 반지름은 값에서 기하적으로 산출(기준 r=40; 폭 2배 →
    r=80 → 넓이 4배; 넓이 2배 → r=40×√2≈57 → 넓이 정확히 2배). 임의 수치 0개 — 본문에 없는
    NYT 53%/783%·14.8 등 정밀 수치는 도판에 노출하지 않는다(본문도 "열네 배 넘게"로 근사).
  강조색(#2B6CB0): 되묻기 한 줄("같은 척도로 비교한 건가요?")에 1회. 두 원·경고 라벨에는
    강조색 0(강조색은 검문·정직 쪽에만, §6-1).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d">
  <title id="t">값 2배를 폭으로 그리면 넓이가 4배로 부풀고, 넓이로 그려야 값에 정확히 비례한다</title>
  <desc id="d">왼쪽은 원의 폭을 2배로 키워 넓이가 4배로 부푼 함정, 오른쪽은 넓이를 정확히 2배로 맞춰 값에 비례한 정직한 버전이다. 값은 둘 다 똑같이 2배. 왼쪽이 함정.</desc>

  <rect x="0" y="0" width="720" height="470" fill="#FFFFFF"/>

  <!-- 상단 한 줄 메시지 -->
  <text x="360" y="32" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">값 2배를 그리는 두 방법 — 폭으로 키우면 넓이는 네 배로 부푼다</text>
  <text x="360" y="52" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">양쪽 다 값은 똑같이 "1 → 2배". 눈에 들어오는 크기만 다르다</text>

  <!-- ===== 왼쪽: 함정 버전 (폭 2배 → 넓이 4배) ===== -->
  <text x="190" y="88" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">함정 — 폭(지름)을 2배로</text>
  <!-- 기준 원 (값 1): 중심 (120, 260), r=40 -->
  <circle cx="120" cy="260" r="40" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="120" y="264" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" fill="#243B53">값 1</text>
  <text x="120" y="320" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">기준</text>
  <!-- 큰 원 (값 2를 폭 2배로): 중심 (285, 220), r=80 → 넓이 4배 -->
  <circle cx="285" cy="220" r="80" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="285" y="216" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" fill="#243B53">값 2</text>
  <text x="285" y="234" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">(폭 2배)</text>
  <!-- 폭 표시 보조선 -->
  <text x="285" y="320" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">눈에는 4배로 들어온다</text>

  <!-- 경고 라벨 (회색 점선) -->
  <rect x="74" y="348" width="232" height="26" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="190" y="365" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">함정: 폭은 2배지만 넓이는 4배</text>

  <!-- 세로 구분선 -->
  <line x1="360" y1="80" x2="360" y2="378" stroke="#829AB1" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== 오른쪽: 정직 버전 (넓이 2배) ===== -->
  <text x="530" y="88" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">정직 — 넓이를 2배로</text>
  <!-- 기준 원 (값 1): 중심 (455, 260), r=40 -->
  <circle cx="455" cy="260" r="40" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="455" y="264" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" fill="#243B53">값 1</text>
  <text x="455" y="320" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">기준</text>
  <!-- 큰 원 (값 2를 넓이 2배로): 중심 (600, 245), r≈57 → 넓이 정확히 2배 -->
  <circle cx="600" cy="245" r="57" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="600" y="241" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" fill="#243B53">값 2</text>
  <text x="600" y="259" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">(넓이 2배)</text>
  <text x="530" y="320" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">넓이가 값에 정확히 비례</text>
  <!-- 정직 안내 라벨 (잉크/회색, 강조색 아님) -->
  <rect x="414" y="348" width="232" height="26" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5"/>
  <text x="530" y="365" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">폭은 약 1.4배지만 넓이는 값 그대로 2배</text>

  <!-- 되묻기 한 줄 (강조 1회) — 하단 중앙 -->
  <rect x="206" y="430" width="308" height="26" rx="4" fill="#EBF4FB" stroke="#2B6CB0" stroke-width="2"/>
  <text x="360" y="447" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">되묻기 — "같은 척도로 비교한 건가요?"</text>
</svg>
