  <rect x="298" y="310" width="422" height="86" rx="4" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5"/>
  <text x="314" y="344" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">&#8220;전체 몇 명 중이죠?</text>
  <text x="314" y="368" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53"> 그 사람들은 어떻게 뽑았죠?&#8221;</text>

  <!-- 3) 증감률 (y=402, +덧대는 한 줄로 높이 100) -->
  <rect x="40" y="402" width="250" height="100" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="56" y="440" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">증감률</text>
  <text x="56" y="462" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">무엇이 몇 % 늘었다 / 줄었다</text>
  <rect x="298" y="402" width="422" height="100" rx="4" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5"/>
  <text x="314" y="432" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">&#8220;원래 몇이었죠? 왜 그 기간인가요?&#8221;</text>
  <line x1="314" y1="448" x2="704" y2="448" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="314" y="468" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">단위가 원래 퍼센트인 숫자(점유율·금리·지지율)의 변화면 한 줄 덧댄다</text>
  <text x="314" y="488" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">&#8220;이거 퍼센트예요, 퍼센트포인트예요?&#8221;</text>

  <!-- 4) A 때문에 B (y=508) -->
  <rect x="40" y="508" width="250" height="86" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="56" y="546" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">&#8220;A 때문에 B&#8221;</text>
  <text x="56" y="568" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">A 덕분에 B가 됐다는 주장</text>
  <rect x="298" y="508" width="422" height="86" rx="4" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5"/>
  <text x="314" y="542" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">&#8220;다른 게 동시에 변하진 않았나요?</text>
  <text x="314" y="566" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53"> 둘 다 끌어올린 무언가는 없나요?&#8221; (짧게 &#8220;안 했어도 그렇게 됐을까요?&#8221;)</text>

  <!-- 5) 차트 (y=600) -->
  <rect x="40" y="600" width="250" height="86" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="56" y="638" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">차트</text>
  <text x="56" y="660" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">막대·선이 절벽처럼 벌어진 그래프</text>
  <rect x="298" y="600" width="422" height="86" rx="4" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5"/>
  <text x="314" y="634" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">&#8220;이거 세로 눈금이 0부터인가요?</text>
  <text x="314" y="658" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53"> 같은 척도로 비교한 건가요?&#8221;</text>

  <!-- 6) 순위·점수·KPI (y=692, 두 갈래로 높이 100) -->
  <rect x="40" y="692" width="250" height="100" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="56" y="730" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">순위 · 점수 · KPI</text>
  <text x="56" y="752" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">종합 1위, 종합점수,</text>
  <text x="56" y="768" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">KPI 달성 보고</text>
  <rect x="298" y="692" width="422" height="100" rx="4" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5"/>
  <text x="314" y="724" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">받은 게 점수·순위면</text>
  <text x="314" y="744" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">&#8220;이건 뭘 어떻게 합친 거죠?&#8221;</text>
  <text x="314" y="766" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">받은 게 KPI 달성 보고면 &#8220;<tspan font-size="13" fill="#243B53">이 달성은 진짜 현실인가요?</tspan>&#8221;</text>

  <!-- 7) 보이지 않는 것 (y=798) -->
  <rect x="40" y="798" width="250" height="86" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="56" y="836" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">보이지 않는 것</text>
  <text x="56" y="858" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">종류와 상관없이 자료 전체에</text>
  <rect x="298" y="798" width="422" height="86" rx="4" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5"/>
  <text x="314" y="832" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">&#8220;여기 안 잡힌 사람은 누구죠?</text>
  <text x="314" y="856" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53"> 전체 중에 원래 그런 경우가 몇 건인데요?&#8221;</text>

  <!-- ===== 카드 사용법 (주석·점선) ===== -->
  <rect x="40" y="900" width="680" height="72" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="56" y="922" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">쓰는 법 — 위에서 아래로. 먼저 맨 위 뿌리 세 칸을 긋고(많은 칸이 &#8220;모른다&#8221;로 채워지는 게 정상), 그다음 숫자의</text>
  <text x="56" y="940" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">종류에 맞는 줄로 내려가 짚는다. 마지막엔 종류와 상관없이 &#8220;여기 안 잡힌 사람은 누구죠&#8221;를 자료 전체에 한 번 던진다.</text>
  <text x="56" y="958" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">짚어 나온 빈칸을 다 따지는 게 아니라(트집꾼이 된다), 멈출 것만 골라 다음 회의에 한 줄로 꺼낸다 — 카드는 외우는 게 아니라 곁에 두는 것.</text>
</svg>
