  <text x="56" y="172" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">아래 일곱 줄은 모두 이 세 칸 어딘가에 숨은 선택이다 — 다 안 떠올라도 이 한 줄이면 절반은 잡힌다</text>
