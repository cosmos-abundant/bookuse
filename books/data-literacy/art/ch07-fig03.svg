<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 7-3 | ch07-fig03  (★ 7장 한정 예외 도판 — style.md §6-1)
  삽입 위치: 7장 "같은 척도로 비교한 건가: 두 개의 눈금, 그리고 면적" 절. 기준 문장
    "...아예 그 기능을 넣지 않았다."(41행 끝, 해들리 위컴) 다음에 본문이 [그림 7-3]
    자리를 표시(43행). (위) 양쪽 눈금을 따로 맞춰 두 선이 한 몸처럼 포개진 그래프 vs
    (아래) 같은 두 지표를 각자 따로 그려 사실은 무관함을 드러낸 그래프로 대비.
  ⚠️ 6장 분업 엄수(자료카드 05): 이 도판은 "차트가 만든 가짜 동행(상관 인상)"까지만
    보인다 — "그래서 하나가 다른 하나의 원인"이라는 인과 해석은 6장 소관이며 도판에 없다.
  캡션: 그림 7-3. 같은 두 지표, 눈금만 다르게 — 위는 한 그래프에 세로 눈금을 둘 달고
    양쪽 범위를 따로 맞춰, 사실은 무관한 두 선을 한 몸처럼 포개 "똑같이 움직인다"는 가짜
    동행을 만든다. 아래는 똑같은 두 지표를 각자 따로 그렸다 — 그러자 한쪽은 꾸준히 오르고
    다른 쪽은 들쭉날쭉, 둘은 사실 함께 움직이지 않는다. 두 선이 소름 끼치게 포개진 그래프를
    받으면, 인과를 따지기 전에 두 선이 같은 눈금을 쓰는지부터 본다. 양쪽 눈금이 따로 놀고
    있다면 그 동행은 데이터가 아니라 눈금이 그린 것일 수 있다. 그래서 되묻는다: "같은
    척도로 비교한 건가요?" (위가 함정, 아래가 정직. 이 닮음이 진짜였을 때 그걸 인과로 읽어도
    되느냐는 6장에서 다뤘다 — 여기선 그 닮음 자체가 가짜일 수 있다는 데까지.)
  대체 텍스트(접근성): 사실은 서로 무관한 두 지표를, 세로 눈금을 어떻게 다느냐에 따라
    "한 몸처럼 움직인다"로도 "전혀 따로 논다"로도 보일 수 있음을 위아래로 대비한 그림.
    위쪽은 함정 버전이다 — 한 그래프 안에 세로 눈금을 왼쪽과 오른쪽 두 개 달고, 두 눈금의
    시작과 끝을 따로 조절했다. 그렇게 범위를 맞추니, 한 선(지표 가)과 다른 선(지표 나)이
    거의 완전히 포개져 둘이 소름 끼치게 똑같이 오르내리는 것처럼 보인다. 위쪽에는 경고
    라벨이 붙는다 — "함정: 세로 눈금이 두 개, 양쪽 범위를 임의로 맞춤". 아래쪽은 정직한
    버전이다 — 똑같은 두 지표를 한 화면에 겹치지 않고 위아래 따로 떨어진 두 칸에 각자
    그렸다. 그러자 지표 가는 왼쪽에서 오른쪽으로 꾸준히 올라가고, 지표 나는 올랐다 내렸다
    들쭉날쭉해, 두 선의 모양이 전혀 닮지 않았음이 드러난다. 핵심은 이것이다 — 세로 눈금을
    둘 달고 각 범위를 따로 맞추면, 아무 관계 없는 두 숫자도 한 몸처럼 포개 "동행"을 연출할
    수 있다. 그래서 두 선이 똑같이 움직인다는 그래프를 받으면, 그 닮음을 믿기 전에 두 선이
    같은 눈금을 쓰는지부터 봐야 한다. (이 닮음이 진짜였을 때 그것을 원인-결과로 읽어도
    되느냐는 6장에서 다룬 별개의 문제이고, 이 그림은 그 닮음 자체가 눈금으로 만들어진
    가짜일 수 있다는 데까지만 보인다.)
  ★ 7장 예외(style.md §6-1) 준수: ① 나쁜 예(위)에 경고 라벨 "함정: 세로 눈금이 두 개,
    양쪽 범위를 임의로 맞춤"을 명시. ② 정직 버전(따로 그리기, 아래)을 짝으로 함께 제시.
    ③ 함정 시연용 — 강조색은 왜곡 쪽이 아니라 되묻기 한 줄에만. 수치 무결성: 자료카드 05는
    "두 축 범위를 따로 맞추면 어떤 두 지표든 포갤 수 있다"는 메커니즘만 제공(특정 수치
    없음) → 선은 모양(꾸준한 상승 vs 들쭉날쭉)만 보이고 절대 수치 라벨·눈금 숫자를 붙이지
    않는다. 임의 수치 0개. 6장 경계: 인과 단어("원인/때문에") 도판에 0건.
  강조색(#2B6CB0): 되묻기 한 줄("같은 척도로 비교한 건가요?")에 1회. 두 선·두 눈금·경고
    라벨에는 강조색 0(강조색은 검문·정직 쪽에만, §6-1).
  용어: "세로 눈금 두 개"(글로서리 ch07 환원, 학술어 '이중 축/dual axis' 미노출).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d">
  <title id="t">사실은 무관한 두 지표도, 세로 눈금을 둘 달고 범위를 맞추면 한 몸처럼 포개진다</title>
  <desc id="d">위는 세로 눈금을 두 개 달아 두 선을 포갠 가짜 동행, 아래는 같은 두 지표를 따로 그려 한쪽은 꾸준히 오르고 한쪽은 들쭉날쭉해 사실 무관함을 드러낸다. 위가 함정. 인과 해석은 6장 소관이라 이 그림에 없다.</desc>

  <rect x="0" y="0" width="720" height="560" fill="#FFFFFF"/>

  <!-- 상단 한 줄 메시지 -->
  <text x="360" y="32" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">같은 두 지표, 눈금만 다르게 — 동행은 눈금이 그린 것일 수 있다</text>
  <text x="360" y="52" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">두 선의 '모양'만 보인다 (절대 수치·눈금 숫자 없음). 인과는 여기서 따지지 않는다 — 6장의 몫</text>

  <!-- ===== 위: 함정 버전 (세로 눈금 두 개로 포갬) ===== -->
  <text x="100" y="86" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">함정 — 한 그래프에 세로 눈금 두 개, 범위를 맞춰 포갬</text>
  <!-- 왼쪽 눈금(지표 가) 축 -->
  <line x1="110" y1="110" x2="110" y2="240" stroke="#829AB1" stroke-width="1.5"/>
  <text x="104" y="178" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1" transform="rotate(-90 104 178)">지표 가</text>
  <!-- 오른쪽 눈금(지표 나) 축 -->
  <line x1="610" y1="110" x2="610" y2="240" stroke="#829AB1" stroke-width="1.5"/>
  <text x="624" y="178" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1" transform="rotate(90 624 178)">지표 나</text>
  <!-- 가로 기준선 -->
  <line x1="110" y1="240" x2="610" y2="240" stroke="#829AB1" stroke-width="1.5"/>
  <!-- 두 선이 거의 포개짐 (범위를 맞춰 동행처럼) — 살짝 어긋나게 그려 '두 선'임을 보임 -->
  <polyline points="130,210 230,200 330,165 430,150 530,128 590,118" fill="none" stroke="#243B53" stroke-width="2"/>
  <polyline points="130,216 230,206 330,172 430,156 530,134 590,124" fill="none" stroke="#243B53" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="360" y="262" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">두 선이 한 몸처럼 포개진다 — "똑같이 움직인다"는 가짜 동행</text>
  <!-- 범례 -->
  <line x1="430" y1="98" x2="452" y2="98" stroke="#243B53" stroke-width="2"/>
  <text x="456" y="102" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">가</text>
  <line x1="480" y1="98" x2="502" y2="98" stroke="#243B53" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="506" y="102" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">나</text>

  <!-- 경고 라벨 (회색 점선) -->
  <rect x="110" y="276" width="500" height="24" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="293" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">함정: 세로 눈금이 두 개 — 양쪽 범위를 따로 맞추면 무관한 두 숫자도 포갤 수 있다</text>

  <!-- 구분선 -->
  <line x1="60" y1="324" x2="660" y2="324" stroke="#829AB1" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== 아래: 정직 버전 (각자 따로 그림) ===== -->
  <text x="100" y="356" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">정직 — 같은 두 지표를 각자 따로 그림</text>
  <!-- 왼쪽 칸: 지표 가 (꾸준히 오름) -->
  <line x1="100" y1="386" x2="100" y2="470" stroke="#829AB1" stroke-width="1.5"/>
  <line x1="100" y1="470" x2="350" y2="470" stroke="#829AB1" stroke-width="1.5"/>
  <polyline points="115,455 165,440 215,420 265,405 320,390" fill="none" stroke="#243B53" stroke-width="2"/>
  <text x="225" y="488" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">지표 가 — 꾸준히 오른다</text>
  <!-- 오른쪽 칸: 지표 나 (들쭉날쭉) -->
  <line x1="390" y1="386" x2="390" y2="470" stroke="#829AB1" stroke-width="1.5"/>
  <line x1="390" y1="470" x2="640" y2="470" stroke="#829AB1" stroke-width="1.5"/>
  <polyline points="405,420 455,395 505,440 555,400 610,448" fill="none" stroke="#243B53" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="515" y="488" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">지표 나 — 들쭉날쭉, 닮지 않았다</text>

  <!-- 되묻기 한 줄 (강조 1회) — 하단 중앙 -->
  <rect x="206" y="516" width="308" height="26" rx="4" fill="#EBF4FB" stroke="#2B6CB0" stroke-width="2"/>
  <text x="360" y="533" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">되묻기 — "같은 척도로 비교한 건가요?"</text>
</svg>
