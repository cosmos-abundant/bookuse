<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 10-1 | ch10-fig01
  삽입 위치: 10장 "판단선의 둘째 축: 얼마가 걸렸나" 절 끝, 본문 41행의 [그림 10-1] 자리.
    기준 문장: "그 배치는 아래 그림으로 한눈에 잡힌다."(39행) 직후, 41행의 [그림 10-1]
    안내문이 가리키는 자리. 39행이 글로 세운 "두 축을 겹쳐 본다 — 가로축 되돌릴 수 있나,
    세로축 얼마가 걸렸나. 한쪽 끝(되돌릴 수 없고 큰 게 걸림)=무조건 멈춤(HP 인수가 정확히
    여기), 반대쪽 끝(되돌릴 수 있고 작음)=그냥 통과(점심 평점), 그 사이=그때그때 판단"을
    한 장으로 묶는다.
  캡션: 그림 10-1. 멈춤/통과 판단선의 네 칸 — 가로축 "되돌릴 수 있나"(왼쪽: 없다 /
    오른쪽: 있다), 세로축 "얼마가 걸렸나"(위: 크다 / 아래: 작다). 왼쪽 위 칸(되돌릴 수 없고
    큰 게 걸림)은 반드시 멈춰 검문할 자리다 — 110억 달러짜리 인수, 1년 독점 계약이 여기 있다.
    오른쪽 아래 칸(되돌릴 수 있고 작은 게 걸림)은 그 자리에서 통과시킬 자리다 — 점심 메뉴
    평점, 카드 한 장 더 올리기가 여기 있다. 나머지 두 칸(되돌릴 수 없지만 작거나, 되돌릴 수
    있지만 큰 경우)은 두 축의 무게를 견줘 그때그때 판단한다. "문"은 직관을 돕는 그림일 뿐
    대부분의 결정은 그 사이 어딘가에 있고, "크기"는 한 건이 아니라 최악·누적까지 함께
    가늠한다. 검문에 쓸 신뢰는 한정돼 있으니, 그 강도를 왼쪽 위 칸에 아껴 쓴다.
  대체 텍스트(접근성): 두 축이 가운데서 교차해 네 칸을 만드는 개념 격자. 가로축은 "되돌릴
    수 있나"로, 왼쪽으로 갈수록 "되돌릴 수 없는 문"(한 번 들어가면 못 나온다), 오른쪽으로
    갈수록 "되돌릴 수 있는 문"(들어가 보고 별로면 다시 나온다)이다. 세로축은 "얼마가
    걸렸나"로, 위로 갈수록 "큰 게 걸렸다"(큰돈·사람·평판), 아래로 갈수록 "작은 게
    걸렸다"(틀려도 점심 한 끼)이다. 네 칸은 이렇게 채워진다. 왼쪽 위 칸은 되돌릴 수 없고 큰
    게 걸린 자리 — 여기는 반드시 멈춰 검문하는 칸이다. 그 안에 110억 달러짜리 회사 인수와
    1년 독점 계약이 예로 놓인다. 오른쪽 아래 칸은 되돌릴 수 있고 작은 게 걸린 자리 — 여기는
    그 자리에서 통과시키는 칸이다. 그 안에 점심 메뉴 평점이 4.2인지 4.0인지, 이 소재로 카드
    한 장 더 올릴지가 예로 놓인다. 나머지 두 칸은 사이의 자리다. 왼쪽 아래(되돌릴 수 없지만
    걸린 게 작다)와 오른쪽 위(되돌릴 수 있지만 걸린 게 크다)는 둘 다 "그때그때 판단"하는
    칸으로, 두 축의 무게를 견줘 정한다. 격자 아래에는 두 가지 단서가 적혀 있다 — 첫째, "문"은
    직관을 돕는 그림일 뿐 세상의 결정은 둘로 딱 갈리지 않고 대부분 그 사이에 있다(정확한
    물음은 "되돌리는 데 얼마가 드나"다). 둘째, "크기"는 한 건의 절대수만 보지 말고 최악의
    경우와 누적까지 함께 가늠한다(작아도 한 건이 무거우면 위로 올라간다). 네 칸 중 강조색이
    칠해진 칸은 왼쪽 위 "멈춤(검문)" 하나뿐이다 — 통과 칸에는 강조를 주지 않았다. 막대그래프·
    눈금·데이터 점·퍼센트 비율 라벨·통계 기호·수식은 한 곳도 없다. 이것은 데이터 차트가
    아니라 두 물음으로 자리를 가르는 개념 격자다.
  강조색(#2B6CB0): "멈춤(검문)" 칸(왼쪽 위) 한 곳에만 1회. 이 책 강조색은 '검문·되묻기
    행위'를 가리키며(style.md §1), 이 도판에서 검문이 일어나는 자리가 바로 그 칸이다. ⚠️
    "통과" 칸(오른쪽 아래)은 좋은 판단이지만 강조를 주지 않았다 — 강조색은 이 책에서 '검문
    행위'에만 쓰고 통과/결과에는 쓰지 않는다(그림 1-2·9-1·11-1의 "통과에 강조 안 줌" 규칙
    계승). 강조색 = 검문이라는 의미를 흐리지 않기 위해, 통과 칸·두 판단 칸·두 축·예시
    라벨은 모두 잉크와 보조 회색만으로 그렸다. 도판당 1회 원칙 준수.
  ★ 7장 §6-1 예외 미전이 확인: 이 도판은 §6-1(7장 한정 왜곡 차트 허용) 예외를 적용하지
    않는다. 막대·세로 눈금·가로 눈금·데이터 점·면적 비교·잘린 축이 0개이며, 두 축은
    데이터 척도가 아니라 "되돌릴 수 있나 / 얼마가 걸렸나"라는 개념 방향선이다(눈금·숫자
    없음). 본문 39행이 비판하지 않는 '개념 격자'이지 데이터 차트가 아니므로, 7장 예외를
    빌릴 필요 자체가 없다. 7장 예외는 7장에만 적용되고 10장으로 전이되지 않는다는 §6-1
    명문을 그대로 지킨다.
  무결성/특칙(style.md §1·§3·§4·§6) 점검:
    - 통계 기호·수식 0개. "가역성/기대손실/비대칭 위험" 같은 학술어를 도판에 노출하지 않고
      본문 환원 표현으로만 적었다: 가로축 "되돌릴 수 있나(되돌릴 수 없는 문 / 되돌릴 수 있는
      문)", 세로축 "얼마가 걸렸나(크다 / 작다)". (본문 39·41행 표현과 동일.) 용어집 통계
      용어 최소화 대전제 부합.
    - 본문 예시와 일치: 멈춤 칸의 "110억 달러 인수"·"1년 독점 계약", 통과 칸의 "점심 메뉴
      평점"·"카드 한 장 더 올리기"는 모두 본문에 있는 것만(3·27·35행, [그림 10-1] 안내문
      41행). 임의 사례·임의 수치 생성 0개. "110억 달러"는 본문 3행의 HP 인수액(근사)을
      그대로 옮긴 것이며 도판이 새로 만든 수치가 아니다. 본문 수치와 도판 수치 불일치 없음.
    - 위치(상하좌우)는 '되돌릴 수 있나 / 얼마가 걸렸나'의 개념 방향일 뿐 눈금이 아니다(축
      라벨·눈금·격자선 없음). 어떤 절대 수치도 주장하지 않는다.
    - 점선(note) 용법: 격자 아래 두 단서("문은 직관 그림일 뿐"·"크기는 최악·누적까지")는
      본문 29·37행의 단서성 주석이라 §2 "주석" 용법으로 회색 점선 테두리. 강조색 미부여.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d">
  <title id="t">멈춤/통과 판단선의 네 칸 — 되돌릴 수 있나 × 얼마가 걸렸나</title>
  <desc id="d">두 물음(되돌릴 수 있나 / 얼마가 걸렸나)이 교차해 네 칸을 만든다. 되돌릴 수 없고 큰 게 걸린 칸은 반드시 멈춰 검문하고(110억 달러 인수, 1년 독점 계약), 되돌릴 수 있고 작은 게 걸린 칸은 그 자리에서 통과시킨다(점심 메뉴 평점, 카드 한 장 더 올리기). 나머지 두 칸은 그때그때 판단한다. 막대·눈금·데이터 점·통계 기호 없는 개념 격자.</desc>

  <rect x="0" y="0" width="720" height="560" fill="#FFFFFF"/>

  <!-- 상단 제목 -->
  <text x="360" y="34" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">멈춤/통과 판단선의 네 칸</text>
  <text x="360" y="54" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">상하좌우는 두 물음의 방향일 뿐, 눈금이 아니다 (축·숫자 없음)</text>

  <!-- ===== 격자 영역 ===== -->
  <!-- 격자 본체: 좌상(120,110) ~ 우하(600,430), 한 칸 240x160 -->

  <!-- 왼쪽 위 칸: 되돌릴 수 없음 + 큼 = 멈춤(검문) — 강조 1회 -->
  <rect x="120" y="110" width="240" height="160" fill="#EBF4FB" stroke="#2B6CB0" stroke-width="2"/>
  <text x="240" y="140" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">반드시 멈춤 (검문)</text>
  <text x="240" y="160" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">되돌릴 수 없는데 + 큰 게 걸림</text>
  <line x1="156" y1="176" x2="324" y2="176" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="240" y="200" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">· 110억 달러짜리 회사 인수</text>
  <text x="240" y="222" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">· 1년 독점 계약</text>
  <text x="240" y="250" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#2B6CB0" font-weight="bold">→ 멈춰 출처·정의·빠진 사람을 따진다</text>

  <!-- 오른쪽 위 칸: 되돌릴 수 있음 + 큼 = 그때그때 판단 -->
  <rect x="360" y="110" width="240" height="160" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="480" y="140" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">그때그때 판단</text>
  <text x="480" y="160" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">되돌릴 수 있지만 + 큰 게 걸림</text>
  <line x1="396" y1="176" x2="564" y2="176" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="208" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">두 축의 무게를 견줘</text>
  <text x="480" y="230" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">그때그때 정한다</text>

  <!-- 왼쪽 아래 칸: 되돌릴 수 없음 + 작음 = 그때그때 판단 -->
  <rect x="120" y="270" width="240" height="160" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="240" y="300" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">그때그때 판단</text>
  <text x="240" y="320" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">되돌릴 수 없지만 + 작은 게 걸림</text>
  <line x1="156" y1="336" x2="324" y2="336" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="240" y="368" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">두 축의 무게를 견줘</text>
  <text x="240" y="390" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">그때그때 정한다</text>

  <!-- 오른쪽 아래 칸: 되돌릴 수 있음 + 작음 = 통과 (강조 없음) -->
  <rect x="360" y="270" width="240" height="160" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="480" y="300" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">그냥 통과</text>
  <text x="480" y="320" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">되돌릴 수 있고 + 작은 게 걸림</text>
  <line x1="396" y1="336" x2="564" y2="336" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="360" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">· 점심 메뉴 평점 4.2인지 4.0인지</text>
  <text x="480" y="382" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#243B53">· 카드 한 장 더 올리기</text>
  <text x="480" y="410" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">→ 토 달지 말고 그 자리에서 넘긴다</text>

  <!-- ===== 축 방향선 (눈금 아님) ===== -->
  <defs>
    <marker id="arrInk" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#243B53"/>
    </marker>
  </defs>

  <!-- 가로축: 되돌릴 수 있나 (왼쪽 없다 → 오른쪽 있다) -->
  <line x1="100" y1="452" x2="620" y2="452" stroke="#243B53" stroke-width="1.5" marker-end="url(#arrInk)"/>
  <text x="120" y="474" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">되돌릴 수 없는 문</text>
  <text x="120" y="490" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">한 번 들어가면 못 나온다</text>
  <text x="600" y="474" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">되돌릴 수 있는 문</text>
  <text x="600" y="490" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">별로면 다시 나오면 된다</text>
  <text x="360" y="490" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#829AB1">← 가로축: 되돌릴 수 있나 →</text>

  <!-- 세로축: 얼마가 걸렸나 (아래 작다 → 위 크다) -->
  <line x1="80" y1="430" x2="80" y2="98" stroke="#243B53" stroke-width="1.5" marker-end="url(#arrInk)"/>
  <text x="72" y="118" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53" transform="rotate(-90 72 118)">크다</text>
  <text x="72" y="420" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53" transform="rotate(-90 72 420)">작다</text>
  <text x="60" y="270" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#829AB1" transform="rotate(-90 60 270)">↑ 세로축: 얼마가 걸렸나 ↑</text>

  <!-- ===== 하단 두 단서 (주석·점선) ===== -->
  <rect x="60" y="506" width="280" height="46" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="74" y="524" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">단서 ① "문"은 직관을 돕는 그림일 뿐 —</text>
  <text x="74" y="540" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">대부분은 그 사이다. "되돌리는 데 얼마가 드나"</text>

  <rect x="380" y="506" width="280" height="46" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="394" y="524" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">단서 ② "크기"는 한 건만 보지 않는다 —</text>
  <text x="394" y="540" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">최악의 경우와 누적까지 함께 가늠한다</text>
</svg>
