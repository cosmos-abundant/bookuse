<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 8-2 | ch08-fig02
  삽입 위치: 8장 "등수는 차이의 크기를 지우고 우열만 남긴다" 절. 원고 57행의 [그림 8-2]
    자리 — 51~55행이 글로 세운 "4.51점과 4.49점은 거의 같은데, 순위로 바꾸면 1등·2등의
    또렷한 우열이 된다 / 잴 때마다 흔들리는 폭이 겹치면 우열이 사실상 없다"를 한 컷으로.
    기준 문장 "0.02점이라는 거의 없는 차이가, 줄을 세우는 순간 또렷한 승패처럼 보인다."(51행)
  캡션: 그림 8-2. 0.02점 차이가, 줄을 세우는 순간 승패가 된다 — 점수 그대로 보면 4.51점과
    4.49점은 거의 같은 높이인데(위), 순위로 바꾸면 "1등 vs 2등"이라는 또렷한 우열로 보인다
    (아래). 게다가 두 점수에는 잴 때마다 조금씩 흔들리는 폭이 있어, 그 폭이 서로 겹치면 둘
    사이에 우열이 있다고 말하기 어렵다. 작은 점수 변화로 등수가 출렁이는 순위라면, 그 등수
    차이는 실력이 아니라 측정의 흔들림일 수 있다. (4.51·4.49·0.02점은 본문에 나온 예시 수치다.
    위아래·좌우 위치는 '거의 같음'의 인상일 뿐 눈금이 아니다 — 축·막대 없음.)
  대체 텍스트(접근성): 미세한 점수 차이를 등수로 바꾸면 차이가 과장됨을, 축·막대 없이 두
    부분으로 보인 개념 그림. 위쪽 '점수 그대로 보면' 칸에는 두 점수 4.51점과 4.49점이 거의
    같은 높이의 두 점으로 나란히 찍혀 있다. 두 점은 각각 가는 띠를 두르고 있는데, 이 띠는
    그 점수를 잴 때마다 조금씩 흔들리는 폭을 뜻한다. 두 띠는 서로 겹친다 — 겹친다는 것은,
    두 점수가 그 흔들림 안에서 사실상 구별되지 않는다는 뜻이다(0.02점 차이). 아래쪽 '순위로
    바꾸면' 칸에는 같은 두 곳이 "1등"과 "2등"이라는 또렷한 딱지로 갈려, 마치 분명한 승패가
    있는 것처럼 보인다. 핵심은 위와 아래의 대비다: 거의 같은 두 점수가, 줄을 세우는 순간
    또렷한 우열로 둔갑한다. 그림 아래 단서는 이렇게 닫는다 — 작은 점수 변화로 등수가 자주
    출렁이는 순위라면, 그 등수 차이는 실력이 아니라 측정의 흔들림일 수 있다. 4.51·4.49·
    0.02점은 본문에 나온 예시 수치이며, 위아래·좌우 위치는 '거의 같음'의 인상일 뿐 눈금이
    아니다. 세로축·가로축·눈금·막대 그래프·통계 기호는 하나도 없다.
  무결성/특칙(★ style.md §1·§4·§6, 8장 일반 규칙) 점검:
    - 7장 §6-1 예외 미전이 확인: 이 도판은 7장 한정 왜곡 차트 허용 예외를 적용하지
      않는다. 세로축·가로축·눈금·막대그래프·면적 비교가 0개이며, '잴 때마다 흔들리는 폭'은
      막대가 아니라 두 점을 두른 가는 띠(점선)로만 그렸다. 두 점의 높이 차(4.51 vs 4.49)는
      '거의 같음'의 인상일 뿐 눈금으로 읽히지 않도록 라벨·격자를 두지 않았다. 본문이
      비판하는 축 절단·면적 과장을 흉내조차 내지 않는다.
    - 통계 기호·수식 0개. ⚠️ "신뢰구간/오차범위/불확실성 구간" 등 통계 용어 미노출 —
      '잴 때마다 조금씩 흔들리는 폭'으로 환원(용어집 통계 용어 최소화 대전제, 자료카드 08
      반대근거 "구간·신뢰구간 개념을 들이밀지 말 것" 준수, 본문 53행 표현과 동일).
    - 임의 통계 생성 없음: 4.51·4.49·0.02점은 모두 본문(원고 51·57행)에 노출된 예시
      수치만 사용. 자료카드에 없는 수치를 도판에 만들지 않았고, 흔들림 폭의 크기는 절대값을
      주장하지 않는 개념 표시다(겹친다는 사실만 보임). 본문 수치와 도판 수치 불일치 없음.
    - 강조색(#2B6CB0): 사용하지 않음(0회). 강조색은 이 책에서 '검문·되묻기 행위'에만 쓰며,
      이 그림에는 검문 행위 노드가 없다(되묻기 첫째 줄은 그림 8-1의 ASK가 이미 1회 담았다).
      같은 장에서 강조색이 두 번 흩어지지 않도록 이 그림은 잉크와 보조 회색만으로 그려
      강조색 의미를 흐리지 않는다(style.md §1 "도판당 1회"=최대 1회, 의무 아님 — 그림 3-2
      선례). 강조색을 "1등 딱지"에 주지 않은 것이 핵심: 1등은 검문 대상이지 검문 행위가
      아니므로 강조색이 가서는 안 된다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
  <title id="t">0.02점 차이가, 줄을 세우는 순간 승패가 된다 — 거의 같은 두 점수가 1등·2등으로 갈린다</title>
  <desc id="d">위 '점수 그대로 보면' 칸에서 4.51점과 4.49점은 거의 같은 높이의 두 점이고, 각 점을 두른 흔들림 폭이 서로 겹쳐 사실상 구별되지 않는다. 아래 '순위로 바꾸면' 칸에서 같은 두 곳이 1등·2등의 또렷한 딱지로 갈린다. 거의 같은 점수가 줄을 세우는 순간 우열로 둔갑함을 보인다. 축·눈금·막대·통계 기호 없음.</desc>

  <rect x="0" y="0" width="720" height="440" fill="#FFFFFF"/>

  <!-- 상단 한 줄 메시지 -->
  <text x="360" y="34" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">0.02점 차이가, 줄을 세우는 순간 승패가 된다</text>
  <text x="360" y="54" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">위아래·좌우 위치는 '거의 같음'의 인상일 뿐, 눈금이 아니다 (축·막대 없음)</text>

  <!-- ===== 위: 점수 그대로 보면 ===== -->
  <text x="80" y="96" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">점수 그대로 보면 — 거의 같다</text>

  <!-- 흔들림 폭(겹치는 두 가는 띠). 막대 아님 — 점을 두른 '흔들리는 폭' 점선 띠 -->
  <!-- 왼쪽 점(4.51)의 흔들림 띠 -->
  <rect x="206" y="120" width="180" height="44" rx="22" fill="#F0F4F8" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- 오른쪽 점(4.49)의 흔들림 띠 (왼쪽 띠와 겹치도록 배치) -->
  <rect x="330" y="120" width="180" height="44" rx="22" fill="#F0F4F8" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 겹친 구간 표시 텍스트 -->
  <text x="358" y="146" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">흔들리는 폭이 겹친다</text>

  <!-- 두 점수 점 (거의 같은 높이) -->
  <circle cx="278" cy="142" r="9" fill="#243B53"/>
  <circle cx="438" cy="142" r="9" fill="#243B53"/>
  <text x="278" y="106" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">4.51점</text>
  <text x="438" y="106" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">4.49점</text>

  <!-- 0.02점 차이 안내 -->
  <text x="358" y="196" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">두 점수 차이는 0.02점 — 잴 때마다 흔들리는 폭 안에 묻힌다</text>

  <!-- 칸 구분선 -->
  <line x1="60" y1="226" x2="660" y2="226" stroke="#829AB1" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- 아래로 향하는 변환 화살표 -->
  <text x="360" y="256" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" fill="#829AB1">↓ 같은 두 곳을 순위로 바꾸면</text>

  <!-- ===== 아래: 순위로 바꾸면 ===== -->
  <text x="80" y="296" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">순위로 바꾸면 — 또렷한 승패가 된다</text>

  <!-- 1등 딱지 (강조색 아님 — 검문 대상이지 검문 행위가 아니므로 잉크로만) -->
  <rect x="210" y="316" width="136" height="56" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="278" y="342" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="bold" fill="#243B53">1등</text>
  <text x="278" y="362" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">4.51점</text>

  <!-- 2등 딱지 -->
  <rect x="370" y="316" width="136" height="56" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="438" y="342" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="bold" fill="#243B53">2등</text>
  <text x="438" y="362" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">4.49점</text>

  <!-- "vs" 가름 -->
  <text x="358" y="350" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#829AB1">vs</text>

  <!-- 하단 단서 -->
  <rect x="60" y="396" width="600" height="28" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="414" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">작은 점수 변화로 등수가 출렁이는 순위라면, 그 등수 차이는 실력이 아니라 측정의 흔들림일 수 있다</text>
</svg>
