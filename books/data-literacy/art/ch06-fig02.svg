<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 6-2 | ch06-fig02
  삽입 위치: 6장 "되물을 한 줄, 그리고 그 한 줄이 왜 통하는가" 절. 기준 문장 "그러니
    광고가 진짜 올린 몫을 알려면, &quot;광고를 안 했어도 그 달엔 어차피 올랐을 매출&quot;을
    떠올려, 실제 매출에서 그만큼을 빼 봐야 한다. 빼고도 남는 게 있어야 그게 광고가 올린
    몫이다."(37행) 다음. 37·41행(인과 = 실제 결과에서 '안 했어도 됐을 반대 장면'을 빼고
    남는 것)의 직관을 한 컷으로. 도입에서 "빼고 나니 남는 게 거의 없었다"(37행)도 함께.
  캡션: 그림 6-2. "A 때문에 B가 됐다"의 진짜 뜻은 빼기 하나다 — 실제로 일어난 결과에서
    "A를 안 했어도 어차피 됐을 반대 장면"을 빼고, 남는 것이 A가 한 몫이다. 광고를 한 달의
    실제 매출에서, 광고를 안 했어도 성수기라 어차피 올랐을 매출(반대 장면)을 덜어 내면,
    남는 게 광고가 진짜 올린 몫이다. 도입의 회의에서는 빼고 나니 남는 게 거의 없었다 —
    성수기라 어차피 올랐을 매출이 거의 전부였기 때문이다. 반대 장면은 머릿속 공상이 아니라
    추정할 수 있는 대상이다: 같은 조건인데 광고를 안 한 다른 지역, 광고 전 몇 달의 추세,
    가장 깨끗하게는 미리 나눠 둔 비교로 그려 본다. 그래서 되묻는다: "안 했어도 그땐
    올랐을까요?" (위아래 길이는 많고 적음의 인상일 뿐, 눈금이 아니다 — 축·숫자 없음.)
  대체 텍스트(접근성): "A 때문에 B가 됐다"가 사실은 빼기 하나임을 축·눈금·숫자 없이 세
    덩어리로 보인 개념 그림. 왼쪽에 '실제로 일어난 결과'라는 큰 세로 덩어리가 하나 있다 —
    광고를 한 그 달에 실제로 난 매출이다. 그 큰 덩어리는 두 부분으로 나뉜다. 아래쪽
    대부분을 차지하는 회색 부분은 '반대 장면 — 광고를 안 했어도 성수기라 어차피 올랐을
    매출'이고, 그 위에 얹힌 작은 부분이 '광고가 진짜 올린 몫'이다. 가운데에는 빼기 기호와
    함께, 그 회색 '반대 장면' 덩어리만 따로 떼어 놓은 두 번째 덩어리가 있다. 오른쪽에는
    등호와 함께, 둘을 빼고 남은 작은 세 번째 덩어리 '= A가 한 진짜 몫'이 있다. 핵심은
    이것이다: 실제 결과에서 반대 장면을 빼고 남는 그 작은 부분만이 A(광고)가 한 일이며,
    도입의 회의에서는 반대 장면이 거의 전부라 빼고 나면 남는 게 거의 없었다. 그림 아래에는
    가장 중요한 단서가 붙는다 — 반대 장면은 일어나지 않은 일이라 상상일 뿐인 게 아니라,
    같은 조건의 다른 지역·이전 추세·미리 나눠 둔 비교로 추정할 수 있는 대상이다. 그래서
    회의에서 "A 때문에 B"가 올라오면 한 줄 되묻는다: "안 했어도 그땐 올랐을까요?" 위아래
    길이는 많고 적음의 인상일 뿐 눈금이 아니며, 축·숫자·통계 기호·막대 그래프는 없다.
  무결성/특칙(★ style.md §1·§4·§6 + C 조항) 점검: 이 그림은 데이터 차트가 아니라
    '인과 = 실제 결과 − 반대 장면'이라는 개념의 빼기 도식이다. 세로축·가로축·눈금·수치·
    격자를 일절 넣지 않아 style.md의 "통계 기호·수식·축 절단 그래프 배제, 본문이 비판하는
    왜곡 차트를 흉내조차 내지 않는다" 특칙을 충족한다. 덩어리(블록)는 막대그래프가 아니라
    '실제 결과를 반대 장면과 진짜 몫으로 가른다'는 영역 비유이며(ch03-fig02 분포 개념·
    ch05-fig02 출발점 개념의 검증된 선례 계승), 어떤 절대 수치도 주장하지 않는다. 상단·하단에
    "위아래 길이는 인상일 뿐 눈금이 아니다"를 명시했다. 본문 수치 0개 노출(도입은 "거의
    없었다"는 정성 표현만) → 임의 수치 0개, 본문 수치 불일치 없음.
    - C5(반대 장면은 상상 아닌 추정 대상): 하단 단서 노드에 "같은 조건의 다른 지역·이전
      추세·미리 나눠 둔 비교로 추정한다"를 명시해, 반대 장면을 "공상"으로 폄하하지 않는다.
    - C1·C2: '진짜 몫'이 작은 건 도입 사례의 결과일 뿐 일반 법칙이 아님을 캡션에서 "도입의
      회의에서는"으로 한정. 빼고 남으면 그게 인과의 몫이라는 정의만 보일 뿐, 빼면 늘
      0이라는 단정은 하지 않는다.
    - 통계 용어 미노출: 반사실(counterfactual)→"반대 장면 / 안 했어도 됐을 일", 인과효과→
      "A가 한 진짜 몫"으로 환원(용어집·C 조항·특칙 준수).
  강조색(#2B6CB0): 되묻기 한 줄("안 했어도 그땐 올랐을까요?")에 1회. 이 책 강조색은
    '검문·되묻기 행위'에만 쓰며, 이 그림도 본문 끝("그래서 되묻는다")을 따라 되묻기 한 줄로
    닫으므로 그 한 줄에만 강조를 준다. 세 덩어리·빼기/등호·반대 장면 등 개념 요소는 잉크와
    보조 회색만으로 그려 강조색 의미를 흐리지 않는다(도판당 1회 원칙). 같은 장의 그림 6-1도
    검문 한 줄(ASK)에 1회 줬으므로, 두 도판이 일관되게 '되묻기'에만 강조를 둔다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
  <title id="t">"A 때문에 B"의 진짜 뜻은 빼기 하나다 — 실제 결과에서 반대 장면을 빼고 남는 게 A의 몫이다</title>
  <desc id="d">광고를 한 달의 실제 매출(큰 덩어리)에서, 광고를 안 했어도 성수기라 어차피 올랐을 반대 장면을 빼면, 남는 작은 부분이 광고가 한 진짜 몫이다. 도입 회의에서는 반대 장면이 거의 전부라 남는 게 거의 없었다. 반대 장면은 공상이 아니라 다른 지역·이전 추세·미리 나눠 둔 비교로 추정하는 대상이다. 축·눈금·수치·통계 기호·막대 그래프 없음.</desc>

  <rect x="0" y="0" width="720" height="480" fill="#FFFFFF"/>

  <!-- 상단 한 줄 메시지 -->
  <text x="360" y="34" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">"A 때문에 B"의 진짜 뜻은 빼기 하나다</text>
  <text x="360" y="54" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">위아래 길이는 많고 적음의 인상일 뿐, 눈금이 아니다 (축·숫자 없음)</text>

  <!-- ① 실제로 일어난 결과 (큰 덩어리: 아래 회색 '반대 장면' + 위 잉크 '진짜 몫') -->
  <!-- 진짜 몫 (작은 윗부분) -->
  <rect x="96" y="100" width="150" height="44" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="171" y="120" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" font-weight="bold" fill="#243B53">A가 한 진짜 몫</text>
  <text x="171" y="136" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">(작다)</text>
  <!-- 반대 장면 (큰 아랫부분, 회색) -->
  <rect x="96" y="144" width="150" height="196" rx="4" fill="#F0F4F8" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="171" y="232" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" font-weight="bold" fill="#829AB1">반대 장면</text>
  <text x="171" y="252" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">안 했어도 성수기라</text>
  <text x="171" y="268" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">어차피 올랐을 매출</text>
  <!-- ① 라벨 -->
  <text x="171" y="362" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">① 실제로 일어난 결과</text>
  <text x="171" y="380" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">광고를 한 그 달의 매출</text>

  <!-- 빼기 기호 (수식이 아니라 '덜어 낸다'는 동작 표시) -->
  <text x="290" y="230" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="bold" fill="#243B53">−</text>

  <!-- ② 반대 장면만 따로 (빼는 것) -->
  <rect x="334" y="144" width="150" height="196" rx="4" fill="#F0F4F8" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="409" y="228" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" font-weight="bold" fill="#829AB1">반대 장면을 뺀다</text>
  <text x="409" y="248" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">어차피 올랐을 만큼</text>
  <text x="409" y="362" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">② 안 했어도 됐을 일</text>
  <text x="409" y="380" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">추정해서 그려 본 장면</text>

  <!-- 등호 -->
  <text x="528" y="228" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="bold" fill="#243B53">=</text>

  <!-- ③ 남는 것 = 진짜 몫 (작은 덩어리, '진짜 몫'과 같은 크기) -->
  <rect x="572" y="100" width="120" height="44" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="632" y="120" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12" font-weight="bold" fill="#243B53">A가 한 진짜 몫</text>
  <text x="632" y="136" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">빼고 남는 것</text>
  <text x="632" y="362" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">③ 남는 것</text>
  <text x="632" y="380" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">도입에선 거의 없었다</text>
  <!-- 점선 연결: ① 윗부분 → ③ (같은 것임을 표시) -->
  <line x1="246" y1="122" x2="572" y2="122" stroke="#829AB1" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- 하단 단서: 반대 장면은 공상이 아니라 추정 대상 (C5) -->
  <rect x="60" y="400" width="600" height="26" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="418" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">반대 장면은 공상이 아니다 — 같은 조건의 다른 지역 · 광고 전 추세 · 미리 나눠 둔 비교로 추정해서 그린다</text>

  <!-- 되묻기 한 줄 (강조 1회) -->
  <g>
    <rect x="200" y="440" width="320" height="28" rx="4" fill="#EBF4FB" stroke="#2B6CB0" stroke-width="2"/>
    <text x="360" y="459" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">되묻기 — "안 했어도 그땐 올랐을까요?"</text>
  </g>
</svg>
