<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 7-1 | ch07-fig01  (★ 7장 한정 예외 도판 — style.md §6-1)
  삽입 위치: 7장 도입. 기준 문장 "바뀐 건 데이터가 아니었다. 바뀐 건 눈금의 시작점
    하나뿐이었다."(3행) 다음에 본문이 [그림 7-1] 자리를 표시(5행). 같은 4.6퍼센트포인트
    차이가 (왼쪽) 0부터 그린 정직한 막대에선 살짝 높은 정도로, (오른쪽) 34부터 잘라
    그린 막대에선 몇 곱절 폭증처럼 보임을 한 화면에 대비.
  캡션: 그림 7-1. 같은 데이터, 다른 인상 — 세율 35%에서 39.6%로 오르는 똑같은 4.6퍼센트
    포인트 차이를, 세로 눈금을 0부터 그리면(왼쪽) 두 막대는 거의 같은 높이로 살짝 오른
    정도지만, 34%부터 잘라 그리면(오른쪽) 한쪽이 다른 쪽의 몇 곱절로 폭증처럼 보인다.
    바뀐 건 데이터가 아니라 눈금의 시작점 하나뿐이다. 막대는 길이로 값을 말하므로, 세로
    눈금이 0부터 시작하지 않으면 그 길이가 거짓말이 된다. 그래서 막대그래프를 받으면 막대
    길이에 감탄하기 전에 되묻는다: "세로 눈금이 0부터인가요?" (오른쪽이 함정, 왼쪽이 정직.)
    출처: 폭스 비즈니스 2012년 방송 그래픽 사례(35%→39.6%, 34% 시작점), Media Matters 외.
  대체 텍스트(접근성): 똑같은 세율 변화(35%에서 39.6%로, 4.6퍼센트포인트 오름)를 두 가지
    막대그래프로 나란히 그려, 세로 눈금의 시작점 하나가 인상을 어떻게 바꾸는지 대비한 그림.
    왼쪽은 정직한 버전이다 — 세로 눈금을 0부터 그렸다. 35% 막대와 39.6% 막대는 거의 같은
    높이로, 둘째 막대가 첫째보다 아주 조금 높을 뿐이다. 4.6퍼센트포인트 차이가 4.6퍼센트
    포인트만큼만 보인다. 오른쪽은 함정 버전이다 — 세로 눈금을 0이 아니라 34%부터 시작해
    위쪽 좁은 구간만 잘라 그렸다. 그러자 35% 막대는 거의 바닥에 붙은 작은 토막이 되고
    39.6% 막대는 그 몇 곱절(약 다섯 배 반) 높이로 치솟아, 살짝 오른 세율이 천장을 뚫는
    폭증처럼 보인다. 오른쪽 막대 위에는 경고 라벨이 붙는다 — "함정: 세로 눈금을 0이 아니라
    34%부터 시작". 두 그림의 데이터는 완전히 똑같고(35과 39.6), 바뀐 건 세로 눈금의 시작점
    하나뿐이다. 핵심은 이것이다 — 막대는 길이로 값을 말하므로, 막대그래프의 세로 눈금이
    0부터 시작하지 않으면 작은 차이가 길게 늘어나 과장된다. 그래서 막대그래프를 받으면 막대
    길이를 믿기 전에 "세로 눈금이 0부터인가요?"부터 되묻는다. 이것은 2012년 한 미국 경제
    방송이 실제로 내보낸 잘린 축 그래픽의 구조다.
  ★ 7장 예외(style.md §6-1) 준수: ① 나쁜 예(오른쪽)에 경고 라벨 "함정: 세로 눈금을 0이
    아니라 34%부터 시작"을 명시. ② 정직 버전(0부터, 왼쪽)을 짝으로 함께 제시(before/after).
    ③ 이 도판은 "함정 시연"이지 우리 책의 주장용이 아니다 — 왼쪽(정직)은 0부터 원칙을 그대로
    지킨다. 강조색 #2B6CB0은 왜곡 쪽이 아니라 '정직한 버전' 제목 + 되묻기 한 줄에만(아래
    참조). 본문 수치 일치: 35%·39.6%·4.6퍼센트포인트·34% 시작 모두 본문 3·5·15행 및
    자료카드 01과 일치. 임의 수치 0개(막대 높이는 35/39.6과 34 시작점에서 기하적으로 산출).
  강조색(#2B6CB0): 두 곳 묶어 1회 — 정직 버전(왼쪽) 제목 강조 + 되묻기 한 줄. 왜곡(오른쪽)
    에는 강조색 0. 강조색은 검문·정직 쪽에만 둔다는 §6-1 규칙. 경고 라벨은 회색 점선
    테두리(주석·경고 용법)로 처리해 강조색과 구분.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d">
  <title id="t">같은 4.6퍼센트포인트 세율 차이도, 0부터 그리면 살짝 오른 정도지만 34부터 잘라 그리면 폭증처럼 보인다</title>
  <desc id="d">세율 35%에서 39.6%로 오르는 똑같은 차이를, 왼쪽은 세로 눈금 0부터 그려 두 막대가 거의 같은 높이로, 오른쪽은 34%부터 잘라 그려 한쪽이 다른 쪽의 몇 곱절로 폭증처럼 보이게 했다. 바뀐 건 데이터가 아니라 눈금의 시작점뿐이다. 오른쪽이 함정.</desc>

  <rect x="0" y="0" width="720" height="470" fill="#FFFFFF"/>

  <!-- 상단 한 줄 메시지 -->
  <text x="360" y="32" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">같은 데이터, 다른 인상 — 바뀐 건 세로 눈금의 시작점 하나뿐</text>
  <text x="360" y="52" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">세율 35% → 39.6% (4.6퍼센트포인트 차이)</text>

  <!-- ===== 왼쪽: 정직 버전 (0부터) ===== -->
  <!-- 제목 (강조 — 정직 쪽) -->
  <text x="190" y="86" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">정직 — 세로 눈금 0부터</text>

  <!-- 좌표계: 세로축 0~50, 플롯 영역 y 110(=50%) ~ 360(=0%), 높이 250px -->
  <!-- 세로축 -->
  <line x1="100" y1="110" x2="100" y2="360" stroke="#829AB1" stroke-width="1.5"/>
  <!-- 가로 기준선 (0) -->
  <line x1="100" y1="360" x2="290" y2="360" stroke="#829AB1" stroke-width="1.5"/>
  <!-- 눈금: 0, 25, 50 -->
  <text x="94" y="364" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">0</text>
  <line x1="96" y1="360" x2="100" y2="360" stroke="#829AB1" stroke-width="1"/>
  <text x="94" y="239" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">25</text>
  <line x1="96" y1="235" x2="100" y2="235" stroke="#829AB1" stroke-width="1"/>
  <text x="94" y="114" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">50</text>
  <line x1="96" y1="110" x2="100" y2="110" stroke="#829AB1" stroke-width="1"/>
  <!-- 막대 35% : 높이 = 35/50 * 250 = 175 → y 185~360 -->
  <rect x="128" y="185" width="56" height="175" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="156" y="378" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#243B53">35%</text>
  <!-- 막대 39.6% : 높이 = 39.6/50 * 250 = 198 → y 162~360 -->
  <rect x="206" y="162" width="56" height="198" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="234" y="378" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#243B53">39.6%</text>
  <!-- 안내 -->
  <text x="190" y="402" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">거의 같은 높이 — 살짝 오른 정도</text>

  <!-- ===== 오른쪽: 함정 버전 (34부터) ===== -->
  <text x="530" y="86" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">함정 — 세로 눈금 34부터 잘라 그림</text>

  <!-- 좌표계: 세로축 34~40, 플롯 영역 y 110(=40%) ~ 360(=34%), 높이 250px, 1%당 약 41.7px -->
  <!-- 세로축 -->
  <line x1="440" y1="110" x2="440" y2="360" stroke="#829AB1" stroke-width="1.5"/>
  <!-- 가로 기준선 (34, 0 아님) -->
  <line x1="440" y1="360" x2="630" y2="360" stroke="#829AB1" stroke-width="1.5"/>
  <!-- 눈금: 34, 36, 38, 40 -->
  <text x="434" y="364" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">34</text>
  <line x1="436" y1="360" x2="440" y2="360" stroke="#829AB1" stroke-width="1"/>
  <text x="434" y="281" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">36</text>
  <line x1="436" y1="277" x2="440" y2="277" stroke="#829AB1" stroke-width="1"/>
  <text x="434" y="197" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">38</text>
  <line x1="436" y1="193" x2="440" y2="193" stroke="#829AB1" stroke-width="1"/>
  <text x="434" y="114" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">40</text>
  <line x1="436" y1="110" x2="440" y2="110" stroke="#829AB1" stroke-width="1"/>
  <!-- 막대 35% : (35-34)/(40-34) * 250 = 1/6*250 ≈ 42 → y 318~360 -->
  <rect x="468" y="318" width="56" height="42" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="496" y="378" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#243B53">35%</text>
  <!-- 막대 39.6% : (39.6-34)/6 * 250 = 5.6/6*250 ≈ 233 → y 127~360 -->
  <rect x="546" y="127" width="56" height="233" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="574" y="378" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#243B53">39.6%</text>

  <!-- 경고 라벨 (회색 점선 — 주석/경고 용법) -->
  <rect x="412" y="396" width="236" height="26" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="530" y="413" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">함정: 세로 눈금을 0이 아니라 34%부터 시작</text>

  <!-- 되묻기 한 줄 (강조 — 정직/검문 쪽, 도판당 1회의 일부) -->
  <rect x="206" y="436" width="308" height="26" rx="4" fill="#EBF4FB" stroke="#2B6CB0" stroke-width="2"/>
  <text x="360" y="453" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">되묻기 — "세로 눈금이 0부터인가요?"</text>
</svg>
