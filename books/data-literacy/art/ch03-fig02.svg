<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 3-2 | ch03-fig02
  삽입 위치: 3장 "평균은 왜, 언제 끌려가나" 절. 기준 문장 "이렇게 쏠린 모양에서
    평균은 긴 꼬리 쪽, 즉 큰 값 쪽으로 끌려간다. 반면 한가운데 값은 끌려가지
    않는다."(17행) 다음. 본문 17행(쏠린 분포의 평균/한가운데 값)과 9행(평균이 가린
    분포)의 직관을 한 장으로.
  캡션: 그림 3-2. 한쪽으로 쏠린 무리에서 평균은 끌려가고, 한가운데 값은 안 끌려간다.
    다수는 왼쪽(작은 값)에 몰려 있고 소수가 오른쪽으로 긴 꼬리를 끈다. 한가운데 값은
    줄의 한복판에 선 한 명이라 끝의 큰 값이 아무리 커져도 그 자리 그대로지만, 평균은
    그 소수의 큰 값에 위로 당겨져 다수에게서 멀어진다. 그래서 쏠린 무리에서 '평균'은
    '보통 한 명'이 아니다.
  대체 텍스트(접근성): 한쪽으로 쏠린 무리에서 평균과 한가운데 값이 갈라지는 모습을
    축·눈금·수식 없이 그린 개념 그림. 왼쪽에는 작은 동그라미(사람)가 빽빽하게 몰려
    있고, 오른쪽으로 갈수록 동그라미가 띄엄띄엄해지며 소수가 긴 꼬리처럼 늘어선다.
    이 다수가 몰린 자리(왼쪽 군집)에 '한가운데 값'이 표시된다 — 줄의 한복판에 선 한
    명이라, 끝의 큰 값이 아무리 커져도 끌려가지 않는다. 그보다 오른쪽, 긴 꼬리 쪽으로
    더 가서 '평균'이 표시된다 — 소수의 큰 값에 위로 당겨진 지점이다. 둘 사이에는 평균이
    꼬리 쪽으로 당겨진 방향이 화살표로 표시된다. 핵심 직관은 하나다: 한가운데 값은 안
    끌려가고, 평균은 큰 값 쪽으로 끌려가, 쏠린 무리에서 평균은 누구의 얼굴도 아니게
    된다. 숫자도 축 눈금도 통계 기호도 없다.
  무결성/특칙 점검: 이 그림은 데이터 차트가 아니라 분포 '모양'의 개념 그림이다. 축·
    눈금·수치·통계 기호를 일절 넣지 않아 style.md §1·§4의 "통계 기호·수식·축 절단
    그래프 배제, 본문이 비판하는 왜곡 차트를 흉내조차 내지 않는다" 특칙을 충족한다.
    수직선(기준축)을 두지 않고 사람 군집의 가로 배치만 쓰며, 막대·면적 비교가 없어
    축 절단·면적 과장의 여지 자체가 없다. 임의 수치 0개.
  강조색: 사용하지 않음(0회). 강조색 #2B6CB0은 이 책에서 '검문·되묻기 행위'에만
    쓰며, 이 그림에는 검문 행위 노드가 없다. 같은 장의 그림 3-1이 강조색을 검문
    노드(STOP)에 1회 썼으므로, 이 그림은 잉크와 보조 회색만으로 그려 강조색 의미를
    흐리지 않는다. (style.md §1 "도판당 1회 사용 원칙"=최대 1회, 의무 아님.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">한쪽으로 쏠린 무리에서 평균은 끌려가고, 한가운데 값은 안 끌려간다</title>
  <desc id="d">왼쪽에 사람들이 빽빽이 몰려 있고 소수가 오른쪽으로 긴 꼬리를 끈다. 다수가 몰린 자리에 '한가운데 값'이, 그보다 꼬리 쪽으로 당겨진 자리에 '평균'이 표시되어, 평균만 큰 값 쪽으로 끌려감을 보인다. 축·눈금·수치·통계 기호 없음.</desc>

  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>

  <!-- 사람 무리: 왼쪽 군집(빽빽) → 오른쪽 긴 꼬리(띄엄띄엄). 임의 수치 아님, '모양'만 표현. -->
  <g fill="#829AB1">
    <!-- 왼쪽 빽빽한 군집 (다수가 몰린 곳) -->
    <circle cx="120" cy="232" r="7"/>
    <circle cx="138" cy="232" r="7"/>
    <circle cx="156" cy="232" r="7"/>
    <circle cx="174" cy="232" r="7"/>
    <circle cx="192" cy="232" r="7"/>
    <circle cx="129" cy="216" r="7"/>
    <circle cx="147" cy="216" r="7"/>
    <circle cx="165" cy="216" r="7"/>
    <circle cx="183" cy="216" r="7"/>
    <circle cx="201" cy="216" r="7"/>
    <circle cx="138" cy="200" r="7"/>
    <circle cx="156" cy="200" r="7"/>
    <circle cx="174" cy="200" r="7"/>
    <circle cx="192" cy="200" r="7"/>
    <circle cx="147" cy="184" r="7"/>
    <circle cx="165" cy="184" r="7"/>
    <circle cx="183" cy="184" r="7"/>
    <circle cx="156" cy="168" r="7"/>
    <circle cx="174" cy="168" r="7"/>
    <circle cx="165" cy="152" r="7"/>
    <!-- 가운데로 가며 점점 성겨지는 무리 -->
    <circle cx="232" cy="232" r="7"/>
    <circle cx="250" cy="232" r="7"/>
    <circle cx="268" cy="232" r="7"/>
    <circle cx="241" cy="216" r="7"/>
    <circle cx="259" cy="216" r="7"/>
    <circle cx="250" cy="200" r="7"/>
    <circle cx="300" cy="232" r="7"/>
    <circle cx="318" cy="232" r="7"/>
    <circle cx="309" cy="216" r="7"/>
    <!-- 오른쪽 긴 꼬리: 소수가 띄엄띄엄 멀리까지 -->
    <circle cx="360" cy="232" r="7"/>
    <circle cx="408" cy="232" r="7"/>
    <circle cx="462" cy="232" r="7"/>
    <circle cx="524" cy="232" r="7"/>
    <circle cx="596" cy="232" r="7"/>
  </g>

  <!-- 바닥선 (기준 눈금 아님, 사람들이 선 바닥일 뿐) -->
  <line x1="96" y1="250" x2="648" y2="250" stroke="#243B53" stroke-width="1.5"/>

  <!-- '한가운데 값' 표시: 다수가 몰린 군집 위 -->
  <line x1="174" y1="132" x2="174" y2="250" stroke="#243B53" stroke-width="1.5"/>
  <g>
    <rect x="92" y="100" width="164" height="30" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
    <text x="174" y="120" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">한가운데 값 — 안 끌려간다</text>
  </g>

  <!-- '평균' 표시: 꼬리 쪽으로 당겨진 자리 -->
  <line x1="318" y1="132" x2="318" y2="250" stroke="#243B53" stroke-width="1.5"/>
  <g>
    <rect x="262" y="100" width="120" height="30" rx="4" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
    <text x="322" y="120" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">평균 — 끌려간다</text>
  </g>

  <!-- 평균이 큰 값(꼬리) 쪽으로 당겨지는 방향 화살표 -->
  <g>
    <line x1="186" y1="290" x2="430" y2="290" stroke="#829AB1" stroke-width="1.5"/>
    <polygon points="430,290 420,285 420,295" fill="#829AB1"/>
    <text x="308" y="312" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">소수의 큰 값이 평균을 큰 값 쪽으로 끌어당긴다</text>
  </g>

  <!-- 양쪽 끝 라벨 (축 눈금 아님, 방향 안내) -->
  <text x="120" y="340" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">작은 값 — 다수가 몰린 쪽</text>
  <text x="596" y="340" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">큰 값 — 소수의 긴 꼬리</text>
</svg>
