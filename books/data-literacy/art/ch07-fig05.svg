<?xml version="1.0" encoding="UTF-8"?>
<!--
  그림 7-5 | ch07-fig05  (★ 7장 한정 예외 도판 — style.md §6-1, 단독 "통과" 도판)
  삽입 위치: 7장 "멈출 자리와 통과시킬 자리" 절. 기준 문장 "0이 아무 의미 없고 작은 변화가
    중요한 자리에서는, 그 변동 폭에 맞춰 축을 잡는 게 정직하다."(81행) 다음에 본문이
    [그림 7-5] 자리를 표시(83행). 주가 하루 변동(99,000~100,500원)을 (위) 0부터 그려
    변화가 평평한 직선으로 뭉개진 그래프 vs (아래) 변동 폭에 맞춰 잘린 축으로 그려 작은
    변화가 비로소 보이는 그래프. ★ before/after가 아니라 "0이 무의미해 잘린 축이 옳은 예"를
    보이는 단독 도판 — 멈춤 쪽 그림 7-1과 짝(그림 7-1은 잘린 축이 거짓, 이 그림은 정직).
  캡션: 그림 7-5. 잘린 축이 오히려 정직한 경우 — 주가가 하루 동안 99,000원에서 100,500원
    사이를 오간 변동을, 위는 0원부터 그렸다. 그러자 1,500원의 출렁임은 거의 평평한 직선이
    돼 아무것도 안 보인다. 아래는 그 변동 폭(99,000~100,500원)에 맞춰 축을 잡았다 — 그제야
    작은 출렁임이 비로소 드러난다. 여기서는 작은 변동이 핵심이고 0원은 아무 의미가 없으니,
    잘린 쪽이 옳다. "막대는 0부터"는 막대그래프의 규칙이지 모든 그래프의 규칙이 아니다 —
    선그래프나 변동이 핵심인 그래프라면 잘린 축 자체는 죄가 아니다. 그래서 통과의 핵심은
    "막대인가 선인가"를 먼저 가르는 것이다. (체온 36~38도도 같은 경우 — 0도부터 그리면
    위험한 변화가 평평하게 뭉개진다.) 단, 선그래프도 변동 폭에 비해 세로를 과하게 늘려
    잡진 않았는지는 따로 본다.
  대체 텍스트(접근성): 잘린 축이 거짓이 아니라 오히려 정직한 경우를, 같은 주가 하루 변동을
    두 가지 세로 눈금으로 그려 위아래로 보인 그림. 다룬 값은 주가가 하루 동안 99,000원에서
    100,500원 사이를 오르내린 변동이다(폭 1,500원). 위쪽은 세로 눈금을 0원부터 100,500원
    까지 그렸다. 그러자 99,000원에서 100,500원 사이의 1,500원짜리 출렁임은 0원에서 10만 원
    가까이 올라온 높이의 맨 꼭대기에서 점 하나만 한 차이라, 선이 거의 평평한 직선으로
    뭉개져 하루 동안 무슨 일이 있었는지 아무것도 안 보인다. 위쪽에는 라벨이 붙는다 — "0부터
    그리면 변화가 사라진다". 아래쪽은 세로 눈금을 변동 폭에 맞춰 99,000원 근처에서 시작해
    100,500원 근처까지만 그렸다(0원을 보이지 않게 잘랐다). 그러자 같은 1,500원의 출렁임이
    오르락내리락 또렷하게 드러나, 하루 동안의 움직임이 비로소 보인다. 아래쪽에는 라벨이
    붙는다 — "여기선 잘린 쪽이 정직". 핵심은 이것이다 — "막대는 0부터"는 막대그래프의
    규칙이지 모든 그래프의 규칙이 아니다. 주가나 체온처럼 0이 아무 의미 없고 작은 변화가
    핵심인 선그래프라면, 그 변동 폭에 맞춰 축을 자르는 게 오히려 정직하다. 왜곡이 늘 거짓말
    인 것은 아니다. 그래서 통과의 핵심은 "막대인가 선인가"를 먼저 가르는 것이다. 다만
    선그래프라고 잘린 축이 무조건 정직한 것은 아니어서, 변동 폭에 비해 세로를 과하게 늘려
    잡아 사소한 출렁임을 극적으로 부풀리진 않았는지는 따로 봐야 한다.
  ★ 7장 예외(style.md §6-1) 준수: 이 그림은 나쁜 예가 아니라 "잘린 축이 정당한 예"를 보이는
    단독 도판이므로(§6-1 ② 단서), before/after 대신 "왜 여기선 잘림이 옳은가"를 보인다 —
    위(0부터)는 정보를 죽이는 쪽, 아래(잘림)는 정직한 쪽. 그래서 강조색은 예외적으로 '아래
    (잘린, 정직)'와 통과 메시지에 둔다(왜곡이 아니라 정직이 잘린 쪽이므로 §1·§6-1 "강조색은
    검문·정직 쪽"과 일치 — 잘렸다고 강조를 뺏지 않는다). 수치 무결성: 본문 81행 주가
    99,000~100,500원·체온 36~38도와 일치, 자료카드 08과 일치. 선 좌표는 99,000~100,500원
    범위에서 기하적으로 산출(위: 0~100,500 눈금이라 변동이 1.5% 높이로 뭉개짐 / 아래:
    99,000~100,500 눈금이라 변동이 패널을 채움). 임의 수치 0개.
  강조색(#2B6CB0): 통과 메시지("여기선 잘린 쪽이 정직 — 막대는 0부터, 선은 변동 폭에
    맞춘다")에 1회. 위(0부터)·선·라벨에는 강조색 0. 이 도판엔 되묻기 한 줄 대신 '통과 판단
    한 줄'에 강조 — 본문 절이 멈춤/통과의 '통과' 자리이기 때문(그림 7-1의 멈춤과 짝).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
  <title id="t">잘린 축이 오히려 정직한 경우 — 0부터 그리면 작은 변화가 평평하게 뭉개진다</title>
  <desc id="d">주가가 하루 99,000원에서 100,500원을 오간 변동을, 위는 0원부터 그려 평평한 직선으로 뭉개고, 아래는 변동 폭에 맞춰 잘라 작은 출렁임을 드러낸다. 여기선 잘린 쪽이 정직하다. 막대는 0부터, 선은 변동 폭에 맞춘다.</desc>

  <rect x="0" y="0" width="720" height="540" fill="#FFFFFF"/>

  <!-- 상단 한 줄 메시지 -->
  <text x="360" y="32" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="bold" fill="#243B53">잘린 축이 오히려 정직한 경우 — 통과시킬 자리</text>
  <text x="360" y="52" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">주가 하루 변동 99,000원 ~ 100,500원 (체온 36~38도도 같은 경우)</text>

  <!-- ===== 위: 0부터 그림 → 변화가 뭉개짐 ===== -->
  <text x="100" y="86" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">0부터 그림 — 작은 변화가 평평하게 뭉개진다</text>
  <!-- 세로축 0 ~ 100,500, 플롯 y 100(=100,500) ~ 250(=0), 높이 150px -->
  <line x1="150" y1="100" x2="150" y2="250" stroke="#829AB1" stroke-width="1.5"/>
  <line x1="150" y1="250" x2="620" y2="250" stroke="#829AB1" stroke-width="1.5"/>
  <text x="144" y="254" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">0원</text>
  <text x="144" y="104" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">100,500원</text>
  <!-- 변동선: 99,000~100,500 이 0~100,500 축에서 차지하는 높이.
       y(99,000)=250-(99000/100500*150)=250-147.76=102.24 ; y(100,500)=100.
       즉 102.2 ~ 100 사이, 폭 약 2.2px — 거의 평평 -->
  <polyline points="170,102 240,101 310,102 380,100 450,102 520,101 600,101"
            fill="none" stroke="#243B53" stroke-width="2"/>
  <text x="385" y="130" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">1,500원의 출렁임이 점 하나만 한 차이로 사라진다</text>
  <!-- 라벨 (회색, 강조 아님) -->
  <rect x="150" y="266" width="320" height="24" rx="4" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5"/>
  <text x="310" y="283" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">0부터 그리면 변화가 사라진다 — 정보가 죽는다</text>

  <!-- 구분선 -->
  <line x1="60" y1="314" x2="660" y2="314" stroke="#829AB1" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== 아래: 변동 폭에 맞춰 잘린 축 → 변화가 보임 (정직) ===== -->
  <text x="100" y="346" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">변동 폭에 맞춰 잘림 — 작은 변화가 비로소 보인다 (정직)</text>
  <!-- 세로축 99,000 ~ 100,500, 플롯 y 360(=100,500) ~ 470(=99,000), 높이 110px -->
  <line x1="150" y1="360" x2="150" y2="470" stroke="#829AB1" stroke-width="1.5"/>
  <line x1="150" y1="470" x2="620" y2="470" stroke="#829AB1" stroke-width="1.5"/>
  <!-- 0이 잘렸음을 명시하는 물결 표시 -->
  <text x="144" y="474" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">99,000원</text>
  <text x="144" y="364" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">100,500원</text>
  <text x="150" y="486" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" fill="#829AB1">≈ (0원은 잘려 보이지 않음 — 여기선 0이 무의미)</text>
  <!-- 같은 변동을, 99,000~100,500 축에서 그림 → 패널을 채우는 출렁임 -->
  <polyline points="170,430 240,400 310,440 380,372 450,420 520,388 600,395"
            fill="none" stroke="#243B53" stroke-width="2"/>

  <!-- 통과 판단 한 줄 (강조 1회 — 정직/통과 쪽) -->
  <rect x="150" y="500" width="470" height="28" rx="4" fill="#EBF4FB" stroke="#2B6CB0" stroke-width="2"/>
  <text x="385" y="519" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#243B53">통과 — "막대는 0부터, 선은 변동 폭에 맞춘다" (왜곡이 늘 거짓은 아니다)</text>
</svg>
