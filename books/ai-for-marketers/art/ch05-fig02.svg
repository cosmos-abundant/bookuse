<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 5-2 | ch05-fig02
삽입 위치: 5장 "네이버 연결 2단계 — 부가기능에 키를 붙여넣는다" 절,
  본문에 박힌 호출 지점 [그림 5-2 | art/ch05-fig02.svg] 블록 자리(원고 line 69).
  (네이버 연결은 원고 line 45~67에 걸쳐 1단계 = 키 3종 발급(line 49~55), 2단계 = 부가기능
   설치 후 키 붙여넣기(line 57~65)로 두 절에 나뉘어 서술된다. 두 절의 글이 각 단계를
   풀고, 이 그림은 "독자가 만지는 단계는 2개뿐(발급·복붙)이고, 어려운 일은 도구가
   가져간다"는 분리를 한 장에 고정한다. 1단계가 이 장에서 가장 어려운 대목이라는 점을
   시각적으로 표시한다 — 역할 중복 없음.)
캡션: 그림 5-2. 네이버 연결의 두 단계 — 어려운 일은 도구가 가져간다.
  1단계는 네이버 광고시스템의 '도구 > API 사용 관리'에서 서비스 신청을 한 번 하면 한
  화면에 키 3종(고객 ID·액세스 라이선스·비밀키)이 나온다. 이 발급 단계가 이 장에서 가장
  손이 가는 대목이며, 책임자(마스터) 권한이 필요할 수 있다(2026년 6월 기준). 2단계는
  구글 시트에 부가기능을 설치하고 그 키 3종을 입력칸에 그대로 붙여넣는 것뿐이다. 독자가
  손으로 한 일은 설치 클릭과 키 붙여넣기 둘뿐 — 요청마다 만들어야 하는 서명, 네이버에
  요청을 보내고 받아 적는 일, 매일 아침 자동 갱신은 전부 부가기능이 처리한다.
대체 텍스트: 왼쪽에서 오른쪽으로 흐르는 두 단계. 위쪽 띠는 "당신이 만지는 것"이고
  아래쪽 띠는 "부가기능이 대신 처리하는 것"으로, 두 단계 모두 위쪽 띠 안에 들어 있다 —
  어려운 일은 모두 아래쪽 부가기능 영역에 있다. 1단계는 네이버 광고시스템에 로그인해
  상단 '도구' 메뉴 안 'API 사용 관리'로 들어가 "네이버 검색광고 API 서비스 신청"을 한
  번 완료하는 일이다. 그러면 같은 화면에 키 3종 — 고객 ID, 액세스 라이선스, 비밀키 —
  이 한 번에 나온다. 비밀키는 화면을 떠나면 다시 보기 어려울 수 있으니 나오는 자리에서
  안전한 곳에 복사해 둔다. 이 1단계는 광고 계정의 책임자(마스터) 권한이 필요할 수 있어
  (2026년 6월 기준) 권한이 낮으면 메뉴가 안 보이거나 막히며, 이 장에서 가장 어려운
  대목이다 — 막히면 책임자에게 발급을 요청해 세 값을 전달받으면 결과는 같다. 2단계는
  데이터를 모을 구글 시트를 새로 만들고, 확장 프로그램(부가기능) 마켓플레이스에서
  네이버 검색광고용 부가기능(아임리포트)을 설치한 뒤, 1단계에서 받은 키 3종을 그
  입력칸에 그대로 붙여넣는 것이다. 그다음 어떤 보고서를 어느 기간·며칠 간격으로
  가져올지만 고르면 된다. 도판 아래쪽 띠에는 부가기능이 대신 처리하는 일이 적혀 있다:
  요청마다 만들어야 하는 일회용 도장 같은 서명, 네이버에 요청을 보내고 데이터를 받아
  적는 일, 그리고 매일 아침의 자동 갱신. 결론은 한 줄이다 — 당신이 손으로 한 일은 설치
  클릭과 키 3종 붙여넣기 둘뿐이고, 어려운 부분은 도구가 가져간다. 이 분리가 "코드 한 줄
  없이"를 네이버에서도 지키는 열쇠다.
본문/자료카드 정합성: 1단계 경로('도구 > API 사용 관리'에서 서비스 신청 → 키 3종 한
  화면)·키 3종 이름(고객 ID·액세스 라이선스·비밀키)·책임자(마스터) 권한 필요(2026-06
  기준)는 원고 line 49~53 및 자료카드 카드 16과 일치. 2단계(시트 새로 만들기 → 부가기능
  설치 → 키 3종 붙여넣기 → 보고서·기간·간격 선택)는 원고 line 61 및 카드 17의 3단계
  흐름과 일치. 서명·요청·자동 갱신을 부가기능이 처리한다는 분리는 원고 line 41·63 및
  카드 16 메모·카드 17 메모와 일치. "당신이 손으로 한 일은 설치 클릭, 키 3종 붙여넣기
  둘뿐"은 원고 line 63 그대로. 이 그림에 가격·소요시간 수치는 표기하지 않았다(가격은
  본문 line 67이 시점과 함께 다룸) — 임의 수치 생성 없음.
페르소나 가드레일: 코드·함수 노출 없음. '서명(HMAC)'은 용어가 아니라 "요청마다 만들어야
  하는 일회용 도장"으로 풀어 도구 영역에만 표기 — 독자가 만지지 않음을 시각으로 못 박음.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 장이 만드는 핵심" 의미. 여기서는 가장 손이 가는 핵심 관문인
   '1단계 키 발급' 한 곳에만 1회 칠한다 — 1단계가 넘으면 나머지는 복붙뿐이라는 본문
   논지를 강조색으로 고정. 2단계와 부가기능 영역은 잉크색 중립, 권한·시점 단서와
   "부가기능이 처리" 라벨은 보조회색. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="t d">
  <title id="t">네이버 연결의 두 단계와, 어려운 일을 부가기능이 가져가는 구조</title>
  <desc id="d">당신이 만지는 것은 두 단계뿐이다 — 1단계는 광고시스템 '도구 > API 사용 관리'에서 키 3종(고객 ID·액세스 라이선스·비밀키)을 발급하는 가장 어려운 관문이고, 2단계는 구글 시트에 부가기능을 설치하고 그 키 3종을 붙여넣는 것이다. 요청마다 만드는 서명, 네이버 요청·수신, 매일 아침 자동 갱신은 전부 부가기능이 대신 처리한다. 손으로 한 일은 설치 클릭과 키 붙여넣기 둘뿐이다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
    .step { font-size: 13px; font-weight: 700; fill: #829AB1; }
  </style>
  <rect x="0" y="0" width="820" height="540" fill="#FFFFFF"/>

  <!-- ===== 상단 띠 라벨: 당신이 만지는 것 ===== -->
  <text x="40" y="34" class="nb">당신이 만지는 것 — 단 두 단계</text>

  <!-- ===== 1단계: 키 3종 발급 (강조 — 가장 어려운 관문, 도판당 1회) ===== -->
  <rect x="40" y="48" width="345" height="232" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="60" y="76" class="step acc">1단계</text>
  <text x="60" y="100" class="h acc">키 3종을 발급한다</text>
  <text x="60" y="124" class="b">네이버 광고시스템에 로그인</text>
  <text x="60" y="146" class="b">→ 상단 <tspan font-weight="700">'도구'</tspan> 메뉴 안 <tspan font-weight="700">'API 사용 관리'</tspan></text>
  <text x="60" y="168" class="b">→ "API 서비스 신청" 한 번 완료</text>
  <line x1="60" y1="182" x2="365" y2="182" stroke="#829AB1" stroke-width="1"/>
  <text x="60" y="202" class="n">한 화면에 세 값이 나온다</text>
  <text x="60" y="224" class="bb">① 고객 ID  ② 액세스 라이선스  ③ 비밀키</text>
  <text x="60" y="246" class="n">비밀키는 화면을 떠나면 다시 못 볼 수 있다</text>
  <text x="60" y="262" class="n">— 나오는 자리에서 안전한 곳에 복사해 둔다</text>
  <text x="60" y="278" class="acc" font-size="11" font-weight="700">★ 이 장에서 가장 어려운 대목 · 책임자(마스터) 권한 필요할 수 있음(2026-06)</text>

  <!-- 단계 사이 화살표: 키 3종이 넘어간다 -->
  <line x1="385" y1="164" x2="430" y2="164" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="436,164 426,160 426,168" fill="#243B53"/>
  <text x="411" y="152" class="n" text-anchor="middle">키 3종</text>

  <!-- ===== 2단계: 부가기능에 붙여넣기 ===== -->
  <rect x="437" y="48" width="343" height="232" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="457" y="76" class="step">2단계</text>
  <text x="457" y="100" class="h">부가기능에 키를 붙여넣는다</text>
  <text x="457" y="124" class="b">데이터 모을 구글 시트를 새로 만든다</text>
  <text x="457" y="146" class="b">→ 확장 프로그램 마켓플레이스에서</text>
  <text x="457" y="168" class="b">  부가기능(아임리포트) <tspan font-weight="700">설치 클릭</tspan></text>
  <line x1="457" y1="182" x2="762" y2="182" stroke="#829AB1" stroke-width="1"/>
  <text x="457" y="202" class="b">→ 키 3종을 입력칸에 <tspan font-weight="700">그대로 붙여넣기</tspan></text>
  <text x="457" y="224" class="b">→ 어떤 보고서를 · 어느 기간 ·</text>
  <text x="457" y="246" class="b">  며칠 간격으로 가져올지 고른다</text>
  <text x="457" y="270" class="nb">손으로 한 일 = 설치 클릭 + 키 붙여넣기, 둘뿐</text>

  <!-- 두 단계 → 아래 영역으로 내려가는 경계 화살표 -->
  <line x1="410" y1="280" x2="410" y2="312" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="410,318 406,308 414,308" fill="#243B53"/>

  <!-- ===== 하단 띠: 부가기능이 대신 처리하는 것 ===== -->
  <text x="40" y="346" class="nb">부가기능이 대신 처리하는 것 — 당신은 손대지 않는다</text>
  <rect x="40" y="358" width="740" height="100" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>

  <!-- 세 칸: 서명 / 요청·수신 / 자동 갱신 -->
  <text x="62" y="388" class="bb">요청마다 일회용 도장(서명)을 만든다</text>
  <text x="62" y="408" class="n">개발자도 자주 틀리는 그 어려운 단계</text>
  <line x1="290" y1="372" x2="290" y2="444" stroke="#829AB1" stroke-width="1"/>

  <text x="312" y="388" class="bb">네이버에 요청을 보내고</text>
  <text x="312" y="408" class="bb">데이터를 받아 적는다</text>
  <line x1="540" y1="372" x2="540" y2="444" stroke="#829AB1" stroke-width="1"/>

  <text x="562" y="388" class="bb">매일 아침 자동 갱신</text>
  <text x="562" y="408" class="n">한 번 설정하면 그다음부터</text>
  <text x="562" y="424" class="n">시트의 한 탭에 매일 채워진다</text>

  <!-- ===== 하단 한 줄 결론 ===== -->
  <line x1="40" y1="478" x2="780" y2="478" stroke="#829AB1" stroke-width="1"/>
  <text x="410" y="500" class="b" text-anchor="middle">어려운 부분은 도구가 가져간다 — 이 분리가 "코드 한 줄 없이"를 네이버에서도 지키는 열쇠다.</text>
  <text x="410" y="522" class="n" text-anchor="middle">(2026년 6월 기준 절차 · 광고시스템 메뉴명·배치는 개편될 수 있으나 하는 일은 그대로다)</text>
</svg>
