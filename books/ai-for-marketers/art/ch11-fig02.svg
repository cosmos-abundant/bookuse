<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 11-2 | ch11-fig02
삽입 위치: 11장 "비식별화 — 그 모두를 우회하는 단 하나의 수단" 절,
  기준 문장 "이 다섯 겹은 전부 '이미 외부로 나간 데이터를 어떻게 지키나'의 문제다. … 이
  모두를 한 번에 우회하는 수단이 하나 있다."(원고 line 95) 바로 다음.
  (이 장은 line 21·65·75·95에 걸쳐 "비식별화가 정점"이라는 구조를 반복해 예고하고, 마지막
  절에서 무게를 싣는다. 본문은 다섯 겹을 차례로 풀고[line 95], line 106에서 "비식별화 한 칸을
  데이터 모으는 단계와 AI 보내는 단계 사이에 끼운다"고 위치를 못 박는다. 이 그림은 ① 데이터
  흐름에서 비식별화 관문이 정확히 어디 끼는지 ② 그 한 칸이 왜 다섯 겹 전부를 우회하는지를
  한 장에 고정한다. 본문에 이미 있는 비식별화 체크리스트[line 99~102]와 약관 표[line 35~39]와는
  다루는 대상이 다르다 — 체크리스트는 '무엇을 어떻게 빼나'의 항목 목록, 이 그림은 '그 처리가
  흐름의 어디에 서서 무엇을 우회하나'의 구조. 중복 없음.)
캡션: 그림 11-2. 비식별화는 다섯 겹을 우회한다 — 데이터가 나가기 전에 서기 때문이다.
  업무용 계정·약관·거치는 회사 세기·국외 이전·책임의 손도장, 이 다섯 겹은 모두 "이미 외부로
  나간 데이터를 어떻게 지키나"의 문제다. 보존은 줄일 뿐 0이 안 되고, 해킹 확률도 0이 안 되고,
  법적 검토는 사안마다 다시 해야 한다. 비식별화는 데이터가 회사를 떠나기 전, 모으는 단계와 AI로
  보내는 단계 사이에 한 칸으로 서서 민감한 것을 떨어낸다. 넣지 않은 데이터는 보존고에도,
  해킹당한 서버에도, 국외 하위처리자에게도 없다 — 그래서 다섯 겹을 다 못 갖춰도 이 한 칸이
  가장 멀리까지 막는다. (원본 시트는 회사 안에 그대로 두고, AI로 나가는 건 청소를 거친 사본이다.)
대체 텍스트: 위에서 아래로 흐르는 데이터의 길. 맨 위는 "회사 안 — 원본 데이터(고객 이메일·전화·
  미발표 실적·가격 전략)"다. 그 아래 회사 경계선이 그어져 있고, 경계를 넘기 직전에 강조된 한
  칸 "비식별화 관문"이 놓인다. 이 관문은 식별자를 지우거나 가명으로 바꾸고, 개별값을 집계값으로
  바꾸고, 복원 열쇠(매칭표)는 회사 안에 남긴다. 관문을 통과한 "청소된 사본"만 회사 경계를
  넘어 외부로 나간다 — 원본 시트는 회사 안에 그대로 남는다. 경계 바깥에는 데이터가 나간 뒤에
  작동하는 다섯 겹의 통제가 차례로 있다. ① 업무용 계정으로 학습 사용 끊기 ② 약관에서 보존기간
  확인 ③ 데이터가 거치는 회사 세기 ④ 국외 이전을 법무에 묻기 ⑤ 책임의 손도장(검수 서명·로그)
  남기기. 그러나 이 다섯 겹은 전부 "이미 나간 데이터를 어떻게 지키나"의 문제라, 보존은 줄일 뿐
  0이 안 되고 해킹 확률도 0이 안 되며 법적 검토는 사안마다 다시 해야 한다. 그림 오른쪽의 굵은
  화살표는 비식별화 관문에서 출발해 다섯 겹을 모두 가로질러 맨 아래 결론까지 닿는다: 애초에
  안 넣은 민감 데이터는 보존고에도, 해킹당한 서버에도, 국외 하위처리자에게도 없다. 그래서
  앞의 다섯 겹을 다 못 갖춰도 이 한 칸이 가장 멀리까지 막는다 — 이것이 이 장의 정점이다.
본문/자료카드 정합성: 흐름 위치(모으는 단계와 AI 보내는 단계 사이)와 "원본은 회사 안, 나가는
  건 청소된 사본"은 원고 line 106과 일치. 비식별화 네 줄(식별자 삭제·대체 / 집계값 / 결합
  재식별 점검 / 매칭표는 회사 안)은 원고 line 99~102, 자료카드 카드 09 메모와 일치. 다섯 겹은
  원고 line 95("다섯 겹이다")의 다섯 통제(업무용 계정·약관 보존기간·거치는 회사·국외 이전·책임
  손도장)와 일치 — 각각 자료카드 카드 01~03, 10, 11/04, 05, ch02 재활용(책임 법리)에 대응.
  "보존은 줄일 뿐 0이 안 되고, 해킹 확률도 0이 안 된다"는 원고 line 95·106 그대로. 수치는 이
  그림에 직접 표기하지 않았다(보존기간 수치는 그림 11-1에 있음) — 임의 수치 생성 없음.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 책의 핵심" 의미. 이 장의 정점인 '비식별화 관문' 칸 + 그 한 칸이 다섯
   겹을 우회한다는 결론 띠 한 묶음에만 1회. 회사 경계선은 점선=경계, 다섯 겹은 잉크색 중립,
   "이미 나간 데이터를 지키는 문제"라는 공통 라벨과 날짜 단서는 보조회색. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-labelledby="t d">
  <title id="t">비식별화 관문이 데이터 흐름에 끼는 위치와, 그것이 다섯 겹을 우회하는 구조</title>
  <desc id="d">원본 데이터는 회사 안에 있고, 회사 경계를 넘기 직전 "비식별화 관문"이 식별자를 떨어내고 집계값으로 바꾼다. 청소된 사본만 외부로 나가고 원본은 회사 안에 남는다. 경계 바깥의 다섯 겹(업무용 계정·약관 보존기간·거치는 회사·국외 이전·책임 손도장)은 모두 이미 나간 데이터를 지키는 문제라 위험을 0으로 못 만든다. 비식별화는 데이터가 나가기 전에 서기 때문에 다섯 겹을 모두 우회한다 — 안 넣은 데이터는 보존고에도, 해킹당한 서버에도, 국외 하위처리자에게도 없다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
  </style>
  <rect x="0" y="0" width="820" height="620" fill="#FFFFFF"/>

  <!-- ===== 회사 안: 원본 데이터 ===== -->
  <text x="40" y="34" class="nb">회사 안</text>
  <rect x="40" y="44" width="360" height="74" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="70" class="bb">원본 데이터</text>
  <text x="56" y="90" class="n">고객 이메일·전화·주소 / 미발표 실적·</text>
  <text x="56" y="106" class="n">가격 전략 — 원본 시트는 회사 안에 그대로 남는다</text>

  <!-- 흐름 화살표: 원본 → 관문 -->
  <line x1="220" y1="118" x2="220" y2="150" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="220,150 216,140 224,140" fill="#243B53"/>

  <!-- ===== 비식별화 관문 (강조 — 이 장의 정점) ===== -->
  <rect x="40" y="150" width="360" height="118" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="56" y="174" class="h acc">비식별화 관문</text>
  <text x="56" y="190" class="n">데이터 모으는 단계와 AI 보내는 단계 사이 한 칸</text>
  <text x="56" y="212" class="b">· 식별자를 지우거나 가명(고객A·B)으로</text>
  <text x="56" y="230" class="b">· 개별값 대신 집계값(평균·증감률 +12%)</text>
  <text x="56" y="248" class="b">· 소량 데이터는 결합 재식별 점검</text>
  <text x="56" y="262" class="n">매칭표(복원 열쇠)는 회사 안에만 — AI에 절대 안 넣음</text>

  <!-- 관문 → 사본 -->
  <line x1="220" y1="268" x2="220" y2="300" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="220,300 216,290 224,290" fill="#243B53"/>

  <!-- ===== 회사 경계선 (점선) ===== -->
  <line x1="40" y1="312" x2="500" y2="312" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="406" y="308" class="n">회사 경계 — 여기를 넘는 건 청소된 사본뿐</text>

  <!-- ===== 청소된 사본 → 외부 AI ===== -->
  <rect x="40" y="324" width="360" height="58" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="350" class="bb">청소된 사본만 외부 AI로</text>
  <text x="56" y="370" class="n">민감한 것이 빠진 데이터 — 매주 자동으로 청소되어 나간다</text>

  <!-- ===== 경계 바깥: 다섯 겹 (데이터가 '나간 뒤' 작동) ===== -->
  <text x="540" y="34" class="nb">경계 바깥 — 다섯 겹의 통제</text>
  <text x="540" y="50" class="n">전부 "이미 나간 데이터를 어떻게 지키나"의 문제</text>

  <g>
    <rect x="540" y="62" width="240" height="44" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
    <text x="556" y="82" class="bb">① 업무용 계정으로 학습 끊기</text>
    <text x="556" y="98" class="n">학습 비사용 ≠ 안전 (그림 11-1)</text>

    <rect x="540" y="114" width="240" height="44" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
    <text x="556" y="134" class="bb">② 약관에서 보존기간 확인</text>
    <text x="556" y="150" class="n">보존은 줄일 뿐 0이 안 된다</text>

    <rect x="540" y="166" width="240" height="44" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
    <text x="556" y="186" class="bb">③ 데이터가 거치는 회사 세기</text>
    <text x="556" y="202" class="n">한 곳만 뚫려도 샌다</text>

    <rect x="540" y="218" width="240" height="44" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
    <text x="556" y="238" class="bb">④ 국외 이전을 법무에 묻기</text>
    <text x="556" y="254" class="n">검토는 사안마다 다시 해야 한다</text>

    <rect x="540" y="270" width="240" height="44" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
    <text x="556" y="290" class="bb">⑤ 책임의 손도장(서명·로그)</text>
    <text x="556" y="306" class="n">사고를 막지 않고 증명한다</text>
  </g>

  <!-- 청소된 사본 → 다섯 겹 (사본도 나가긴 나간다) -->
  <line x1="400" y1="353" x2="538" y2="353" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="538,353 528,349 528,357" fill="#243B53"/>
  <text x="412" y="345" class="n">사본도 나가긴 나가니, 다섯 겹도 함께 깐다</text>

  <!-- ===== 우회 화살표: 관문 → 다섯 겹을 가로질러 결론으로 ===== -->
  <!-- 관문 오른쪽에서 출발, 다섯 겹 오른쪽을 따라 내려가 결론으로 -->
  <path d="M 400 209 L 800 209 L 800 470" fill="none" stroke="#D9480F" stroke-width="2.5"/>
  <polygon points="800,470 795,458 805,458" fill="#D9480F"/>
  <text x="612" y="200" class="nb acc" text-anchor="middle">비식별화는 다섯 겹을 우회한다</text>

  <!-- ===== 하단 결론 띠 (강조 묶음 — 관문과 한 의미) ===== -->
  <rect x="40" y="480" width="740" height="96" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="410" y="512" class="h acc" text-anchor="middle">애초에 안 넣은 민감 데이터는 어디서도 안 샌다</text>
  <text x="410" y="538" class="b" text-anchor="middle">보존고에도 없고, 해킹당한 서버에도 없고, 국외 하위처리자에게도 넘어가지 않는다.</text>
  <text x="410" y="560" class="b" text-anchor="middle">앞의 다섯 겹을 다 못 갖춰도, 이 한 칸이 가장 멀리까지 막는다 — 이것이 이 장의 정점이다.</text>

  <text x="40" y="600" class="n">흐름 위치·다섯 겹·비식별화 네 줄은 본문(원고 line 95~106) 및 자료카드 ch11 카드 09·10·11·05와 일치. 보존기간 수치는 그림 11-1 참조.</text>
</svg>
