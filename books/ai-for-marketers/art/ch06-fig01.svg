<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 6-1 | ch06-fig01
삽입 위치: 6장 "통합 탭은 깨끗한 표이지 보고서가 아니다 — 세 개의 빈자리" 절,
  본문에 박힌 호출 지점(원고 line 17) 자리. 기준 문장은 line 15
  "계산은 시트가 하고, 해석은 AI가 하고, 형식 변환은 슬라이드 도구가 한다. 이 분업이
   이 장 전체의 골격이다." 바로 다음 단락에 그림이 걸려 있다.
  (본문 line 13~15가 세 빈자리 — 계산·해석·형식 — 를 풀고, 각각을 시트·AI·슬라이드
   도구가 나눠 맡고 그 위에 사람 검수가 얹힌다는 분업을 푼다. 글이 셋의 성격 차이를
   풀고, 이 그림은 "5장 산출물(통합 탭) 위에 남은 빈자리가 정확히 셋이고, 셋의 담당이
   따로이며, 그 모두 위에 사람 검수가 한 겹 더 얹힌다"는 장 전체 골격을 한 장에 고정한다.
   이 그림이 6장 도판의 목차 역할 — 6-2는 계산 빈자리, 6-3은 형식 빈자리, 6-4는 결과를
   각각 확대한다. 중복 없음.)
캡션: 그림 6-1. 통합 탭(5장 산출물) 위에 남은 세 빈자리 — 계산·해석·형식.
  각각을 시트·AI·슬라이드 도구가 나눠 맡고, 그 위에 사람의 검수가 얹힌다.
  5장은 흩어진 값을 한 모양으로 줄 세운 깨끗한 표(통합 탭)까지 만들고 멈췄다. 그 위에
  보고서가 되려면 세 가지가 더 필요하다 — 증감률 같은 계산, 그 숫자를 사람 말로 푸는
  해석, 발표 자료로 옮기는 형식. 한 덩어리로 "보고서 만들어 줘" 하지 않고 셋을 분리해,
  계산은 시트 수식이(AI에게 암산을 안 시킨다), 해석은 AI가, 형식 변환은 슬라이드
  도구가 맡는다. 그리고 셋 모두 위에 사람의 검수가 한 겹 더 얹힌다 — 만들기는 도구가,
  검수는 사람이.
대체 텍스트: 맨 아래에 5장이 만든 산출물 '통합 탭 — 흩어진 값을 한 모양으로 줄 세운
  깨끗한 표(캠페인명·채널·주차·ROAS·CPA·전환수)'가 토대로 깔려 있다. 본문은 이 깨끗한
  표가 아직 보고서가 아니라고 말한다 — 그 위에 채워야 할 빈자리가 정확히 셋이기
  때문이다. 가운데에 세 빈자리가 왼쪽부터 나란히 있다. 첫째 '계산이 비어 있다': 이번 주
  ROAS와 전주 ROAS는 칸으로 있지만 둘 사이 증감률, 목표 대비, 유독 튄 캠페인이 빈칸이다 —
  이 자리는 시트 수식이 맡는다(AI에게 암산을 시키지 않는다). 둘째 '해석이 비어 있다':
  증감률 숫자만으로는 보고서가 아니어서, 그 숫자가 무슨 뜻이고 무엇을 먼저 봐야 하는지를
  사람 말로 푼 코멘트가 있어야 한다 — 이 자리는 AI가 맡는다. 셋째 '형식이 비어 있다':
  코멘트가 다 쓰여도 그건 텍스트 초안이지 발표 자료가 아니어서, 슬라이드로 옮겨야
  한다 — 이 자리는 슬라이드 도구가 맡는다. 그리고 세 빈자리 모두 위에 한 겹이 더
  얹혀 있다 — 사람의 검수. 도구가 채운 계산·해석·형식을 사람이 보고 통과시킨다.
  도판의 한 줄 결론은 "만들기는 도구가 나눠 맡고, 검수는 사람이 한 겹으로 얹는다"이다.
  세 빈자리가 성격이 달라 잘하는 도구에 따로 맡긴다는 것, 그래서 한 덩어리로 "보고서
  만들어 줘"라고 맡기지 않는다는 것이 이 그림의 핵심이다.
본문/자료카드 정합성: 세 빈자리(계산·해석·형식)와 빈칸 예시(증감률·목표 대비·유독 튄
  캠페인 / 코멘트 / 발표 자료)는 원고 line 13과 일치. "계산은 시트가, 해석은 AI가,
  형식 변환은 슬라이드 도구가 한다"는 분업은 원고 line 15 그대로. 통합 탭 칸 이름
  (캠페인명·채널·주차·ROAS·CPA·전환수)은 5장 산출물(원고 line 3, ch05-fig04)과 일치.
  "사람의 검수가 그 위에 얹힌다"는 원고 line 5·17의 "사람의 일은 검수로 좁힌다"와 일치.
  이 그림에 수치 표기 없음 — 임의 수치 생성 없음.
페르소나 가드레일: 코드·함수 노출 금지. 계산 칸 담당은 "시트 수식"으로만 표기하고
  실제 수식·함수명은 넣지 않는다(증감률 수식 예시는 6-2에서 한 칸 보임). '슬라이드 도구'
  도 특정 제품명 없이 역할로만 표기(제품명 분기는 6-3에서 다룸).
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 책이 만드는 것 / 목표 상태" 의미. 이 장 전체의 결론인 맨 위
   '사람의 검수' 띠 한 곳에만 1회 칠한다 — 만들기에서 검수로 좁히는 것이 이 책의 약속
   이므로 그 한 겹을 강조색으로 고정. 세 빈자리와 통합 탭 토대는 잉크색 중립, 담당
   라벨·빈칸 예시는 보조회색. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="t d">
  <title id="t">통합 탭 위에 남은 세 빈자리(계산·해석·형식)와 그 위에 얹히는 사람의 검수</title>
  <desc id="d">5장이 만든 통합 탭(깨끗한 표)이 토대로 깔리고, 그 위에 채울 빈자리가 셋이다 — 계산(증감률·목표 대비·이상치, 시트 수식이 맡음), 해석(숫자를 사람 말로 푸는 코멘트, AI가 맡음), 형식(발표 슬라이드로 옮김, 슬라이드 도구가 맡음). 셋 모두 위에 사람의 검수가 한 겹 더 얹힌다. 만들기는 도구가 나눠 맡고, 검수는 사람이 한다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
    .col { font-size: 12px; font-weight: 700; }
  </style>
  <rect x="0" y="0" width="820" height="560" fill="#FFFFFF"/>

  <!-- ===== 맨 위: 사람의 검수 (강조, 도판당 1회) ===== -->
  <rect x="40" y="36" width="740" height="64" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="410" y="64" class="h" text-anchor="middle" fill="#D9480F">사람의 검수 — 세 빈자리 모두 위에 한 겹으로 얹힌다</text>
  <text x="410" y="86" class="b" text-anchor="middle">도구가 채운 계산·해석·형식을 사람이 보고 통과시킨다 (만들기는 도구가, 검수는 사람이)</text>

  <!-- 검수 → 세 빈자리로 내려가는 화살표 -->
  <line x1="200" y1="100" x2="200" y2="124" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="200,130 196,120 204,120" fill="#243B53"/>
  <line x1="410" y1="100" x2="410" y2="124" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="410,130 406,120 414,120" fill="#243B53"/>
  <line x1="620" y1="100" x2="620" y2="124" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="620,130 616,120 624,120" fill="#243B53"/>

  <!-- ===== 가운데: 세 빈자리 ===== -->
  <text x="40" y="150" class="nb">통합 탭 위에 남은 세 빈자리 — 성격이 달라, 잘하는 도구에 따로 맡긴다</text>

  <!-- 빈자리 1: 계산 -->
  <rect x="40" y="160" width="232" height="160" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="186" class="bb">① 계산이 비어 있다</text>
  <text x="56" y="210" class="n">증감률 · 목표 대비 ·</text>
  <text x="56" y="226" class="n">유독 튄 캠페인이 빈칸</text>
  <line x1="56" y1="240" x2="256" y2="240" stroke="#829AB1" stroke-width="1"/>
  <text x="56" y="262" class="b">담당:</text>
  <text x="96" y="262" class="bb">시트 수식</text>
  <text x="56" y="284" class="n">AI에게 암산을 시키지</text>
  <text x="56" y="300" class="n">않는다 (자세히는 그림 6-2)</text>

  <!-- 빈자리 2: 해석 -->
  <rect x="294" y="160" width="232" height="160" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="310" y="186" class="bb">② 해석이 비어 있다</text>
  <text x="310" y="210" class="n">"ROAS -32%"라는 숫자만</text>
  <text x="310" y="226" class="n">으론 보고서가 아니다</text>
  <line x1="310" y1="240" x2="510" y2="240" stroke="#829AB1" stroke-width="1"/>
  <text x="310" y="262" class="b">담당:</text>
  <text x="350" y="262" class="bb">AI</text>
  <text x="310" y="284" class="n">숫자가 무슨 뜻인지 ·</text>
  <text x="310" y="300" class="n">무엇을 먼저 볼지 사람 말로</text>

  <!-- 빈자리 3: 형식 -->
  <rect x="548" y="160" width="232" height="160" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="564" y="186" class="bb">③ 형식이 비어 있다</text>
  <text x="564" y="210" class="n">코멘트는 텍스트 초안이지</text>
  <text x="564" y="226" class="n">발표 자료가 아니다</text>
  <line x1="564" y1="240" x2="764" y2="240" stroke="#829AB1" stroke-width="1"/>
  <text x="564" y="262" class="b">담당:</text>
  <text x="604" y="262" class="bb">슬라이드 도구</text>
  <text x="564" y="284" class="n">텍스트 초안을 발표</text>
  <text x="564" y="300" class="n">슬라이드로 (분기는 그림 6-3)</text>

  <!-- 세 빈자리 → 통합 탭 토대로 내려가는 화살표(빈자리가 통합 탭 위에 올라탐) -->
  <line x1="156" y1="320" x2="156" y2="344" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="156,344 152,334 160,334" fill="#243B53" transform="rotate(180 156 339)"/>
  <line x1="410" y1="320" x2="410" y2="344" stroke="#243B53" stroke-width="1.5"/>
  <line x1="664" y1="320" x2="664" y2="344" stroke="#243B53" stroke-width="1.5"/>

  <!-- ===== 맨 아래: 통합 탭 토대 (5장 산출물) ===== -->
  <text x="40" y="372" class="nb">토대 — 5장 산출물: 통합 탭 (흩어진 값을 한 모양으로 줄 세운 깨끗한 표)</text>
  <rect x="40" y="382" width="740" height="120" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>

  <!-- 표 헤더 -->
  <rect x="40" y="382" width="740" height="30" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="56" y="402" class="col">캠페인명</text>
  <text x="216" y="402" class="col">채널</text>
  <text x="306" y="402" class="col">주차</text>
  <text x="416" y="402" class="col">ROAS</text>
  <text x="536" y="402" class="col">CPA</text>
  <text x="646" y="402" class="col">전환수</text>
  <!-- 세로 구분선 -->
  <line x1="206" y1="382" x2="206" y2="502" stroke="#829AB1" stroke-width="1"/>
  <line x1="296" y1="382" x2="296" y2="502" stroke="#829AB1" stroke-width="1"/>
  <line x1="406" y1="382" x2="406" y2="502" stroke="#829AB1" stroke-width="1"/>
  <line x1="526" y1="382" x2="526" y2="502" stroke="#829AB1" stroke-width="1"/>
  <line x1="636" y1="382" x2="636" y2="502" stroke="#829AB1" stroke-width="1"/>
  <!-- 가로 행선 -->
  <line x1="40" y1="442" x2="780" y2="442" stroke="#829AB1" stroke-width="1"/>
  <line x1="40" y1="472" x2="780" y2="472" stroke="#829AB1" stroke-width="1"/>
  <!-- 행 (수치는 적지 않음 — '…'은 값 위치 표시, 임의 수치 금지) -->
  <text x="56" y="432" class="b">여름세일</text><text x="216" y="432" class="b">메타</text>
  <text x="306" y="432" class="n">…</text><text x="416" y="432" class="n">…</text><text x="536" y="432" class="n">…</text><text x="646" y="432" class="n">…</text>
  <text x="56" y="462" class="b">가을신상</text><text x="216" y="462" class="b">구글</text>
  <text x="306" y="462" class="n">…</text><text x="416" y="462" class="n">…</text><text x="536" y="462" class="n">…</text><text x="646" y="462" class="n">…</text>
  <text x="56" y="492" class="b">브랜드검색</text><text x="216" y="492" class="b">네이버</text>
  <text x="306" y="492" class="n">…</text><text x="416" y="492" class="n">…</text><text x="536" y="492" class="n">…</text><text x="646" y="492" class="n">…</text>

  <!-- 하단 한 줄 -->
  <line x1="40" y1="520" x2="780" y2="520" stroke="#829AB1" stroke-width="1"/>
  <text x="410" y="542" class="n" text-anchor="middle">한 덩어리로 "보고서 만들어 줘"라고 맡기지 않는다 — 셋은 성격이 달라 잘하는 도구에 따로 맡긴다. (표의 '…'은 값 위치 표시 · 실제 수치 아님)</text>
</svg>
