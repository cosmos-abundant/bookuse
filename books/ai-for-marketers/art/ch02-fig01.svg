<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 2-1 | ch02-fig01
삽입 위치: 2장 "매트릭스 — 네 칸과 네 가지 처방" 절,
  기준 문장 "이것이 반복성×규칙성 매트릭스다." 가 속한 단락 바로 뒤
  (본문 주석 [그림 2-1 | art/ch02-fig01.svg]가 박힌 자리).
캡션: 그림 2-1. 반복성×규칙성 매트릭스 — 네 칸과 네 가지 처방. 가로축은 규칙 명확성,
  세로축은 반복 빈도다. 실패 비용은 칸이 아니라 일마다 붙이는 표식(★)으로 얹는다.
  ★ 붙은 일은 같은 칸 안에서 순위가 뒤로 가고, 4장의 검증 체계를 갖추기 전에는 승급이 없다.
  점선 주석은 김지유(가상 인물)의 업무 배치 예시다.
대체 텍스트: 가로축 규칙 명확성(왼쪽 애매 → 오른쪽 명확), 세로축 반복 빈도
  (아래 드묾 → 위 잦음)로 만든 2×2 매트릭스. 오른쪽 위(자주 돌아오고 규칙도 적힘)는
  "지금 자동화" — 김지유의 데이터 취합·증감 계산, 경쟁사 동향 수집·요약이 여기 놓인다.
  왼쪽 위(자주 돌아오지만 규칙이 애매함)는 "명세부터 정비" — 처방은 도구가 아니라 명세
  정비이며 이 칸의 일을 오른쪽으로 옮기는 작업이 3장이다. 김지유의 콘텐츠 채널 변환
  (어조 규칙이 머릿속에만 있다)과 보고서 코멘트가 여기 놓이고, 보고서 코멘트에는 회의로
  직행하는 출력이라 ★(실패 비용)가 붙는다. 오른쪽 아래(규칙은 명확하나 가끔 옴)는
  "보조로 충분" — 분기 1번 결산 코멘트처럼 그때그때 AI에게 시키면 되는 일이다.
  왼쪽 아래(드물고 애매함)는 "건드리지 마라" — 대부분 사람의 일이고 일부는 제외 목록에
  속한다. ★는 실패 비용이 큰 일에 붙는 취급 주의 표식으로, 칸이 아니라 일마다 얹는다.
수치 근거: 매트릭스 구조·사분면 명칭·김지유 배치는 본문 "매트릭스 — 네 칸과 네 가지 처방"
  절과 "3단계, 배치와 ★"(본문) 그대로. 외부 통계 없음(개념 다이어그램).
  자료카드 대응: 명세부터 정비=카드 03(Hammer), 규칙 명확성 축=카드 01·02·09·Anthropic 카드 09(ch01),
  실패 비용 ★=카드 05~08·15.
스타일: books/ai-for-marketers/art/style.md (강조색 #D9480F는 "자동화/목표 상태" 의미로
  '지금 자동화' 칸에만 1회. ★ 실패 비용 표식은 잉크색으로 — 강조색의 의미 충돌 방지.
  점선=가상/주석 = 김지유 배치 예시.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="t d">
  <title id="t">반복성×규칙성 매트릭스 — 규칙 명확성과 반복 빈도로 나눈 네 칸과 네 가지 처방</title>
  <desc id="d">가로축 규칙 명확성, 세로축 반복 빈도의 2×2 매트릭스. 오른쪽 위 "지금 자동화", 왼쪽 위 "명세부터 정비(3장)", 오른쪽 아래 "보조로 충분", 왼쪽 아래 "건드리지 마라". 실패 비용은 일마다 붙이는 ★ 표식으로 얹는다. 김지유의 업무 배치가 점선 주석으로 표시된다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .axis { font-size: 13px; font-weight: 700; fill: #243B53; }
    .axispole { font-size: 11px; fill: #829AB1; }
    .qtitle { font-size: 15px; font-weight: 700; }
    .qbody { font-size: 13px; }
    .star { font-size: 11px; fill: #829AB1; }
    .note { font-size: 11px; fill: #829AB1; }
    .notebold { font-size: 11px; font-weight: 700; fill: #829AB1; }
  </style>
  <rect x="0" y="0" width="760" height="620" fill="#FFFFFF"/>

  <!-- ===== 축 라벨 ===== -->
  <!-- 세로축: 반복 빈도 -->
  <text x="26" y="280" class="axis" transform="rotate(-90 26 280)" text-anchor="middle">반복 빈도</text>
  <text x="50" y="108" class="axispole" text-anchor="middle">자주</text>
  <text x="50" y="468" class="axispole" text-anchor="middle">드묾</text>
  <!-- 세로 화살표 축 -->
  <line x1="64" y1="470" x2="64" y2="92" stroke="#829AB1" stroke-width="1.5"/>
  <polygon points="64,86 60,96 68,96" fill="#829AB1"/>

  <!-- 가로축: 규칙 명확성 -->
  <text x="412" y="520" class="axis" text-anchor="middle">규칙 명확성</text>
  <text x="200" y="500" class="axispole" text-anchor="middle">애매</text>
  <text x="624" y="500" class="axispole" text-anchor="middle">명확</text>
  <!-- 가로 화살표 축 -->
  <line x1="90" y1="486" x2="734" y2="486" stroke="#829AB1" stroke-width="1.5"/>
  <polygon points="740,486 730,482 730,490" fill="#829AB1"/>

  <!-- ===== 네 칸 (그리드: x 90~730, y 80~470, 중앙선 x=410, y=275) ===== -->
  <!-- 왼쪽 위: 명세부터 정비 -->
  <rect x="90" y="80" width="320" height="195" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <!-- 오른쪽 위: 지금 자동화 (강조 — 자동화/목표 상태) -->
  <rect x="410" y="80" width="320" height="195" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <!-- 왼쪽 아래: 건드리지 마라 -->
  <rect x="90" y="275" width="320" height="195" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <!-- 오른쪽 아래: 보조로 충분 -->
  <rect x="410" y="275" width="320" height="195" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>

  <!-- ===== 왼쪽 위: 명세부터 정비 ===== -->
  <text x="106" y="108" class="qtitle">명세부터 정비</text>
  <text x="106" y="130" class="qbody">자주 오지만 규칙이 애매한 일.</text>
  <text x="106" y="148" class="qbody">처방은 도구가 아니라 명세 정비.</text>
  <text x="106" y="166" class="qbody">애매함을 그대로 자동화하면</text>
  <text x="106" y="184" class="qbody">애매함까지 시스템에 굳는다.</text>
  <text x="106" y="208" class="notebold">→ 이 칸을 오른쪽으로 옮기는 작업이 3장</text>
  <!-- 김지유 점선 주석 (왼쪽 위) -->
  <g>
    <rect x="106" y="222" width="288" height="42" fill="#FFFFFF" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
    <text x="116" y="239" class="note">김지유: 콘텐츠 채널 변환(어조 규칙이 머릿속에만)</text>
    <text x="116" y="256" class="note">보고서 코멘트 <tspan font-weight="700">★</tspan> — 회의로 직행하는 출력</text>
  </g>

  <!-- ===== 오른쪽 위: 지금 자동화 ===== -->
  <text x="426" y="108" class="qtitle" fill="#D9480F">지금 자동화</text>
  <text x="426" y="130" class="qbody">자주 돌아오고 규칙도 적히는 일.</text>
  <text x="426" y="148" class="qbody">매주 같은 모양에, 매핑 규칙까지</text>
  <text x="426" y="166" class="qbody">글로 적힌다. 1순위 후보가 여기서 나온다.</text>
  <!-- 김지유 점선 주석 (오른쪽 위) -->
  <g>
    <rect x="426" y="200" width="288" height="60" fill="#FFFFFF" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
    <text x="436" y="218" class="note">김지유: 데이터 취합 · 증감 계산</text>
    <text x="436" y="235" class="note">경쟁사 동향 수집 · 요약</text>
    <text x="436" y="252" class="note">(대응 결정은 매트릭스 밖 — 동사 단위로 쪼갠 결과)</text>
  </g>

  <!-- ===== 왼쪽 아래: 건드리지 마라 ===== -->
  <text x="106" y="303" class="qtitle">건드리지 마라</text>
  <text x="106" y="325" class="qbody">드물고 애매한 일.</text>
  <text x="106" y="343" class="qbody">대부분 그냥 사람의 일이고,</text>
  <text x="106" y="361" class="qbody">일부는 다음 절의 제외 목록에 속한다.</text>
  <!-- 김지유 점선 주석 (왼쪽 아래) -->
  <g>
    <rect x="106" y="382" width="288" height="42" fill="#FFFFFF" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
    <text x="116" y="399" class="note">줄 밖(매트릭스 제외): 수수료 협상,</text>
    <text x="116" y="416" class="note">광고비 결정 — 판단·관계·책임이 걸린 일</text>
  </g>

  <!-- ===== 오른쪽 아래: 보조로 충분 ===== -->
  <text x="426" y="303" class="qtitle">보조로 충분</text>
  <text x="426" y="325" class="qbody">규칙은 명확하지만 가끔 오는 일.</text>
  <text x="426" y="343" class="qbody">그때그때 AI에게 시키면 된다.</text>
  <text x="426" y="361" class="qbody">시스템을 만들 선불이 회수되지 않는다.</text>
  <!-- 김지유 점선 주석 (오른쪽 아래) -->
  <g>
    <rect x="426" y="382" width="288" height="42" fill="#FFFFFF" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
    <text x="436" y="399" class="note">예: 분기 1번 쓰는 결산 코멘트</text>
    <text x="436" y="416" class="note">— 닥쳤을 때 보조로 처리</text>
  </g>

  <!-- ===== ★ 실패 비용 범례 ===== -->
  <line x1="90" y1="548" x2="734" y2="548" stroke="#829AB1" stroke-width="1"/>
  <text x="90" y="572" class="qbody"><tspan font-weight="700">★ 실패 비용</tspan> — 칸이 아니라 일마다 붙이는 취급 주의 딱지. 틀린 채로 오래 돌거나, 검수 없이 외부로 직행하는 일에 단다.</text>
  <text x="90" y="592" class="note">★는 같은 칸 안에서 순위를 뒤로 보내고, 출력이 검수 없이 외부로 가는 연결을 막는다. 4장의 검증 체계를 갖추기 전에는 승급이 없다.</text>
  <text x="90" y="610" class="note">※ 김지유는 가상 인물이며 점선 주석은 본문 "3단계, 배치와 ★"의 배치 예시다(임의 생성 없음).</text>
</svg>
