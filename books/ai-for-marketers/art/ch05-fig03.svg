<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 5-3 | ch05-fig03
삽입 위치: 5장 "분기 박스 — 아임리포트가 안 맞거나 죽으면 (플랜 B)" 절,
  본문에 박힌 호출 지점 [그림 5-3 | art/ch05-fig03.svg] 블록 자리(원고 line 81).
  (이 절은 원고 line 71~79에 걸쳐 ① 플랜 A가 안 맞는 조건(키 발급 권한 없음·외부
   부가기능 차단·구독 불안) ② 그때의 플랜 B(네이버만 주 1회 수동 다운로드 → 시트
   붙여넣기) ③ 두 약속("코드 없이"·"검수 40분")이 양쪽 다 지켜지는지를 따진다. 글이
   조건과 계산을 풀고, 이 그림은 "어느 조건이면 어느 플랜인지"의 분기와 "두 플랜이 같은
   시트에 같은 모양으로 모인다"는 합류를 한 장에 고정한다. 그림 5-2와 다룸 대상이 다르다 —
   5-2는 플랜 A의 두 단계 내부, 5-3은 플랜 A냐 B냐의 선택. 중복 없음.)
캡션: 그림 5-3. 네이버 경로의 분기 — 플랜 A냐 플랜 B냐, 그리고 둘 다 약속을 지킨다.
  두 조건을 함께 묻는다: 키 발급 권한이 있는가, 외부 부가기능을 쓸 수 있는가. 둘 다
  되면 플랜 A — 부가기능이 매일 아침 자동 갱신한다. 둘 중 하나라도 막히면 플랜 B —
  네이버만 주 1회 약 5분 직접 다운로드해 시트의 '네이버 원본' 탭에 붙여넣는다. 플랜 B도
  약속을 깎지 않는다: 다운로드·붙여넣기에 코드는 없고, 자동 취합으로 사라진 1시간
  38분의 자리에 주 1회 약 5분이 남을 뿐이라 6장까지 합쳐도 검수 40분 안에 든다. 두
  플랜은 같은 시트에 같은 모양으로 데이터를 모으니, 6장 이후는 어느 쪽을 골랐든 똑같다.
대체 텍스트: 위에서 두 조건을 함께 묻는 분기도. 출발 질문은 "네이버를 어떻게 모을까 —
  두 조건을 함께 본다"이고, 그 아래 두 조건이 나란히 놓인다: ① 키 발급 권한이 있는가(키
  3종을 직접 발급받을 수 있는가) ② 외부 부가기능을 쓸 수 있는가(회사가 설치를 막지
  않는가, 작은 구독 서비스에 연결을 맡겨도 되는가). 두 조건이 모두 '예'이면 왼쪽
  플랜 A로 간다 — 부가기능(아임리포트)이 키 3종으로 매일 아침 데이터를 자동 갱신하며,
  손이 가는 건 최초 설정뿐이다. 두 조건 중 하나라도 '아니오'이면 오른쪽 플랜 B로 간다 —
  네이버만 주 1회 직접 다운로드한다. 광고시스템 보고서 메뉴에서 매주 쓸 맞춤 보고서를
  한 번 저장해 두고, 그다음부터는 기간만 지난주로 바꿔 약 5분 만에 내려받아 구글 시트의
  '네이버 원본' 탭에 붙여넣는다. 메타·구글은 양쪽 플랜에서 똑같이 자동으로 모인다.
  도판 아래에는 두 약속이 양쪽 다 지켜진다는 확인이 나란히 있다. 첫째 "코드 한 줄 없이"는
  양쪽 다 그대로다 — 플랜 B의 다운로드·붙여넣기에도 코드는 없다. 둘째 "검수 40분"도
  양쪽 다 지켜진다 — 플랜 B가 더하는 것은 주 1회 약 5분의 수동 단계 하나뿐이고, 자동
  취합으로 1시간 38분이 사라진 자리에 그 5분이 남는 것이라(1시간 38분이 5분이 된
  것이지 4시간이 그대로인 게 아니다), 6장의 분석·보고서까지 합쳐 검수 40분 안에 드는
  데 지장이 없다. 마지막으로 두 플랜은 같은 시트에 같은 모양으로 데이터를 모은다 —
  그래서 6장 이후는 어느 쪽을 골랐든 똑같이 이어진다. 키 발급 권한이 있고 외부
  부가기능을 쓸 수 있다면 플랜 A가 손이 덜 가고, 둘 중 하나라도 막히면 플랜 B다.
본문/자료카드 정합성: 분기 조건(키 발급 권한 + 외부 부가기능 사용 가능 → 플랜 A /
  둘 중 하나라도 막힘 → 플랜 B)은 원고 line 73·79와 일치. 플랜 B 절차(네이버만 주 1회
  직접 다운로드, 맞춤 보고서 저장 후 기간만 바꿔 받기, '네이버 원본' 탭에 붙여넣기,
  메타·구글은 자동)는 원고 line 75 및 자료카드 카드 10과 일치. "주 1회 약 5분"·"1시간
  38분이 5분이 됨"·"검수 40분 안"은 원고 line 77 그대로(자료카드 V-6 발행인 실측 경로의
  계상치 — 외부 통계 아님, 김지유는 가상 인물). "코드 없이" 양쪽 유지는 원고 line 77.
  "두 플랜이 같은 시트에 같은 모양으로 모임"은 원고 line 79. 임의 수치 생성 없음.
페르소나 가드레일: 코드·함수·서명 노출 없음. 플랜 B는 "다운로드 → 붙여넣기"의 손동작만,
  플랜 A는 "자동 갱신"만 표기. 양쪽 모두 코드 없음을 명시.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 책이 만드는 것/목표 상태" 의미 = 자동화. 두 플랜이 같은 시트로
   합류해 약속을 지킨다는 합류·결론 띠 한 곳에만 1회 칠한다 — 분기가 어느 쪽으로 가든
   "코드 없이·검수 40분"이라는 목표 상태가 유지된다는 게 이 그림의 핵심이기 때문.
   플랜 A·플랜 B 두 경로 박스는 잉크색 중립으로 대등하게(어느 쪽도 열등하지 않음),
   조건 분기와 5분·"네이버 원본" 단서는 보조회색. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" role="img" aria-labelledby="t d">
  <title id="t">네이버 경로의 분기 — 플랜 A와 플랜 B, 그리고 둘 다 같은 약속을 지킨다</title>
  <desc id="d">키 발급 권한과 외부 부가기능 사용 가능 두 조건을 함께 묻는다. 둘 다 되면 플랜 A(부가기능 자동 갱신), 둘 중 하나라도 막히면 플랜 B(네이버만 주 1회 약 5분 직접 다운로드 후 시트 붙여넣기). 두 플랜은 같은 시트에 같은 모양으로 모이고, 양쪽 다 "코드 한 줄 없이"와 "검수 40분"을 지킨다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
    .big { font-size: 26px; font-weight: 700; fill: #243B53; }
    .tag { font-size: 12px; font-weight: 700; fill: #829AB1; }
  </style>
  <rect x="0" y="0" width="820" height="600" fill="#FFFFFF"/>

  <!-- ===== 출발: 두 조건 ===== -->
  <rect x="180" y="24" width="460" height="74" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="410" y="50" class="h" text-anchor="middle">네이버를 어떻게 모을까 — 두 조건을 함께 본다</text>
  <text x="410" y="72" class="b" text-anchor="middle">① 키 발급 권한이 있는가   ② 외부 부가기능을 쓸 수 있는가</text>
  <text x="410" y="90" class="n" text-anchor="middle">(회사가 설치를 막지 않는가 · 작은 구독 서비스에 연결을 맡겨도 되는가)</text>

  <!-- 분기 화살표 -->
  <line x1="410" y1="98" x2="410" y2="116" stroke="#243B53" stroke-width="1.5"/>
  <line x1="210" y1="116" x2="610" y2="116" stroke="#243B53" stroke-width="1.5"/>
  <line x1="210" y1="116" x2="210" y2="146" stroke="#243B53" stroke-width="1.5"/>
  <line x1="610" y1="116" x2="610" y2="146" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="210,152 206,142 214,142" fill="#243B53"/>
  <polygon points="610,152 606,142 614,142" fill="#243B53"/>
  <text x="300" y="134" class="tag" text-anchor="middle">둘 다 예</text>
  <text x="520" y="134" class="tag" text-anchor="middle">둘 중 하나라도 아니오</text>

  <!-- ===== 플랜 A ===== -->
  <rect x="40" y="154" width="340" height="190" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="60" y="182" class="h">플랜 A — 자동 갱신</text>
  <line x1="60" y1="194" x2="360" y2="194" stroke="#829AB1" stroke-width="1"/>
  <text x="60" y="216" class="b">부가기능(아임리포트)이 키 3종으로</text>
  <text x="60" y="238" class="b"><tspan font-weight="700">매일 아침 데이터를 자동 갱신</tspan></text>
  <text x="60" y="266" class="b">손이 가는 건 최초 설정뿐</text>
  <text x="60" y="288" class="n">— 그다음부터 시트의 한 탭에</text>
  <text x="60" y="304" class="n">  매일 알아서 채워진다</text>
  <text x="60" y="330" class="nb">손이 덜 간다 (조건이 맞을 때의 기본)</text>

  <!-- ===== 플랜 B ===== -->
  <rect x="440" y="154" width="340" height="190" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="460" y="182" class="h">플랜 B — 네이버만 주 1회 수동</text>
  <line x1="460" y1="194" x2="760" y2="194" stroke="#829AB1" stroke-width="1"/>
  <text x="460" y="216" class="b">광고시스템 보고서 메뉴에서</text>
  <text x="460" y="238" class="b">매주 쓸 맞춤 보고서를 한 번 저장</text>
  <text x="460" y="262" class="b">→ 기간만 지난주로 바꿔 다운로드</text>
  <text x="460" y="286" class="b">→ 시트의 <tspan font-weight="700">'네이버 원본' 탭에 붙여넣기</tspan></text>
  <text x="460" y="312" class="n">메타·구글은 양쪽 플랜에서 똑같이 자동</text>
  <text x="460" y="334" class="nb">주 1회 · 약 5분 (조건이 막힐 때)</text>

  <!-- 두 플랜 → 합류 -->
  <line x1="210" y1="344" x2="210" y2="372" stroke="#243B53" stroke-width="1.5"/>
  <line x1="610" y1="344" x2="610" y2="372" stroke="#243B53" stroke-width="1.5"/>
  <line x1="210" y1="372" x2="610" y2="372" stroke="#243B53" stroke-width="1.5"/>
  <line x1="410" y1="372" x2="410" y2="392" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="410,398 406,388 414,388" fill="#243B53"/>

  <!-- ===== 합류 + 약속 유지 (강조 띠, 도판당 1회) ===== -->
  <rect x="80" y="400" width="660" height="120" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="410" y="426" class="h" text-anchor="middle" fill="#D9480F">두 플랜은 같은 시트에 같은 모양으로 모인다 — 약속은 양쪽 다 지켜진다</text>
  <line x1="410" y1="438" x2="410" y2="508" stroke="#D9480F" stroke-width="1"/>

  <!-- 약속 1 -->
  <text x="120" y="464" class="bb">"코드 한 줄 없이" — 양쪽 다</text>
  <text x="120" y="486" class="b">플랜 B의 다운로드·붙여넣기에도</text>
  <text x="120" y="504" class="b">코드는 없다.</text>

  <!-- 약속 2 -->
  <text x="440" y="464" class="bb">"검수 40분" — 양쪽 다</text>
  <text x="440" y="486" class="b">자동 취합으로 사라진 1시간 38분의</text>
  <text x="440" y="504" class="b">자리에 주 1회 약 5분이 남을 뿐.</text>

  <!-- ===== 하단 한 줄 ===== -->
  <line x1="40" y1="540" x2="780" y2="540" stroke="#829AB1" stroke-width="1"/>
  <text x="410" y="562" class="b" text-anchor="middle">6장 이후는 어느 플랜을 골랐든 똑같이 이어진다 — 두 길이 같은 분류표로 모이기 때문이다.</text>
  <text x="410" y="584" class="n" text-anchor="middle">("주 1회 약 5분"·"1시간 38분"·"검수 40분"은 자동화로 절약되는 목표치 · 김지유는 가상 인물 · 2026년 6월 기준)</text>
</svg>
