<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 12-5 | ch12-fig05
삽입 위치: 12장 "갈아타기 실전 — 명세는 그대로, 연결만 새로" 절 끝,
  본문에 명시된 호출 지점 [그림 12-5 | art/ch12-fig05.svg] 블록 자리(원고 line 120),
  다섯 단계를 문단으로 다 푼 직후 ~ "오늘 할 일" 절 머리.
  본문(원고 line 102~118)이 각 단계의 행위와 근거를 풀고, 이 그림은 다섯 단계를 한 줄
  순서로 고정하면서 각 단계가 1부의 어느 이식 자산을 쓰는지, 그리고 "다시 짜는 것은
  3단계의 도구 종속 연결 하나뿐, 명세는 그대로 옮겨 간다"는 한 가지를 한눈에 보인다 —
  서술 중복 없음.
캡션: 그림 12-5. 갈아타기 5단계 절차 — 명세는 그대로, 연결만 새로.
  ① 이식 자산 모으기 → ② 데이터 빼내기 → ③ 새 도구에 구조 재현 → ④ 명세 붙이고 검증
  → ⑤ 한 주기 병행. 다섯 단계 중 어디에도 "처음부터 다시"는 없다. 다시 짜는 것은
  도구에 종속됐던 연결뿐이고, 명세(3장)·검증(4장)은 그대로 옮겨 간다. 그게 이 장 제목
  "프로토콜"의 뜻이다 — 도구가 바뀔 때마다 매번 새로 고민하는 게 아니라, 정해진 순서를
  한 번 익혀 두고 다시 돌린다.
대체 텍스트: 왼쪽에서 오른쪽으로 이어지는 5단계 절차도. 도구 이름은 일부러 넣지 않았다 —
  어떤 도구에서 어떤 도구로 가든 같은 순서이기 때문이다.
  1단계 이식 자산을 한곳에 모은다 — 새 도구를 열기 전에 먼저 한다. 업무 명세 문서(3장),
  검수 체크리스트(4장)를 텍스트 파일로 모은다. 도구 밖에 사는 자산이라 옛 도구가 죽기
  전에도 빼낼 수 있다. 쓰는 이식 자산: 명세(3장)·검증(4장).
  2단계 죽기 전에 데이터를 빼낸다 — 옛 도구가 통지 기간이나 백업 창을 주는 동안 내보내기
  기능으로 표준 형식(CSV·JSON)으로 받아 둔다. Meta Workplace 9개월, Visual Electric 90일
  창이 이 단계를 위한 시간이다. 통지를 받은 날이 이사 준비를 시작하는 날이다.
  3단계 새 도구에서 같은 구조를 다시 그린다 — 옛 도구의 클릭 경로를 똑같이 재현하지 말고
  (그건 폐기 자산이다) 동작 개념 단위로 옮긴다. "데이터를 시트로 모은다 → 명세로
  분석·초안을 만든다 → 사람이 검수한다"는 구조는 도구가 바뀌어도 같다. 1장 시스템 골격이
  설계도가 된다. 이 단계만이 "다시 짜는" 자리 — 도구에 종속됐던 연결뿐이다.
  4단계 명세를 새 도구에 붙이고 검증한다 — 3장 검증 절차 그대로. 1단계에서 모아 둔 명세를
  손대지 않고 넣고, 같은 입력을 두세 번 넣어 골격이 잡히는지 본다. 흔들리면 명세 전체가
  아니라 흔들린 칸만 손본다. 대개 한두 칸이다.
  5단계 옛 시스템과 한 주기 병행한다 — 새 시스템이 한 번에 옳다고 믿지 말고 한 주기 동안
  옛 도구와 나란히 돌려 결과를 맞춘다(같은 보고서를 둘 다 만들어 숫자 일치 확인). 일치하면
  옛 도구를 끄고, 어긋나면 그 자리가 새 시스템의 미완성 지점이다. 4장 검증이 마지막으로
  한 번 더 일하는 자리.
  관통 메시지: 다섯 단계 중 어디에도 "처음부터 다시"는 없다. 모으고(이식 자산)·빼내고
  (데이터)·다시 그리고(구조)·붙이고(명세)·맞춰 본다(검증). 다시 짜는 것은 도구에
  종속됐던 연결뿐이고, 명세는 그대로 옮겨 간다.
본문 정합성: 5단계 순서·행위·근거(1~4장 회수), Meta Workplace 9개월·Visual Electric 90일
  백업 창(2단계), "흔들린 칸만 손본다"(4단계), "한 주기 병행·숫자 일치 확인"(5단계),
  "다시 짜는 것은 도구 종속 연결뿐, 명세는 그대로"는 원고 line 102~120과 완전 일치. 90일/
  9개월은 카드 06/05 및 그림 12-2와 동일 수치(상호 정합). 도구명을 단계 노드에 넣지 않음
  (본문 "도구 이름을 일부러 넣지 않았다" line 106과 일치). 임의 항목·수치 없음.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 책이 만드는 것/핵심 결론" 의미. 본문이 이 장 제목 "프로토콜"의
   뜻으로 못 박은 한 문장 — "다시 짜는 것은 도구 종속 연결뿐, 명세는 그대로" — 결론 띠
   한 곳에만 강조 면을 1회 칠한다. 3단계의 '다시 짜는 자리(도구 종속 연결)'는 강조색이
   아니라 점선 보조회색 꼬리표로 표시해, 강조색이 "재작업"이 아니라 "명세는 그대로"라는
   책의 결론에만 붙도록 한다. 5단계 노드는 잉크색 중립. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t d">
  <title id="t">갈아타기 5단계 절차 — 명세는 그대로, 연결만 새로</title>
  <desc id="d">이식 자산 모으기 → 데이터 빼내기 → 새 도구에 구조 재현 → 명세 붙이고 검증 → 한 주기 병행의 5단계 절차. 도구 이름은 넣지 않는다(어떤 도구로 가든 같은 순서). 다시 짜는 것은 3단계의 도구 종속 연결뿐이고, 명세(3장)·검증(4장)은 그대로 옮겨 간다. 2단계의 데이터 창은 Meta Workplace 9개월·Visual Electric 90일이 근거다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .num { font-size: 22px; font-weight: 700; fill: #243B53; }
    .acc { fill: #D9480F; }
  </style>
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>

  <!-- 도구 비종속 안내 -->
  <text x="32" y="36" class="nb">도구 이름은 넣지 않았다 — 어떤 도구에서 어떤 도구로 가든 같은 순서다.</text>

  <!-- 단계 노드 좌표: 폭 152, 간격 화살표 22 -->
  <!-- ===== 1단계 ===== -->
  <rect x="32" y="56" width="152" height="170" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="48" y="88" class="num">1</text>
  <text x="48" y="112" class="bb">이식 자산을</text>
  <text x="48" y="130" class="bb">한곳에 모은다</text>
  <text x="48" y="152" class="n">새 도구를 열기 전에</text>
  <text x="48" y="168" class="n">먼저 한다. 명세·체크</text>
  <text x="48" y="184" class="n">리스트를 텍스트 파일로.</text>
  <text x="48" y="208" class="n" font-weight="700" fill="#829AB1">쓴다: 명세(3장)</text>
  <text x="48" y="222" class="n" font-weight="700" fill="#829AB1">검증(4장)</text>

  <!-- 화살표 1→2 -->
  <line x1="184" y1="141" x2="200" y2="141" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="206,141 196,137 196,145" fill="#243B53"/>

  <!-- ===== 2단계 ===== -->
  <rect x="206" y="56" width="152" height="170" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="222" y="88" class="num">2</text>
  <text x="222" y="112" class="bb">죽기 전에</text>
  <text x="222" y="130" class="bb">데이터를 빼낸다</text>
  <text x="222" y="152" class="n">통지 기간·백업 창 동안</text>
  <text x="222" y="168" class="n">표준 형식(CSV·JSON)으로</text>
  <text x="222" y="184" class="n">내보내 받아 둔다.</text>
  <text x="222" y="208" class="n" font-weight="700" fill="#829AB1">Meta Workplace 9개월</text>
  <text x="222" y="222" class="n" font-weight="700" fill="#829AB1">Visual Electric 90일</text>

  <!-- 화살표 2→3 -->
  <line x1="358" y1="141" x2="374" y2="141" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="380,141 370,137 370,145" fill="#243B53"/>

  <!-- ===== 3단계 (다시 짜는 유일한 자리 — 점선 꼬리표) ===== -->
  <rect x="380" y="56" width="152" height="170" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="396" y="88" class="num">3</text>
  <text x="396" y="112" class="bb">새 도구에서</text>
  <text x="396" y="130" class="bb">구조를 다시 그린다</text>
  <text x="396" y="152" class="n">클릭 경로 재현 X</text>
  <text x="396" y="168" class="n">— 동작 개념 단위로 옮김.</text>
  <text x="396" y="184" class="n">1장 시스템 골격이</text>
  <text x="396" y="200" class="n">설계도가 된다.</text>
  <!-- 점선 꼬리표: 여기만 다시 짠다 = 도구 종속 연결 -->
  <rect x="380" y="234" width="152" height="40" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="456" y="252" class="nb" text-anchor="middle">다시 짜는 자리는 여기뿐</text>
  <text x="456" y="267" class="n" text-anchor="middle">— 도구에 종속됐던 연결</text>

  <!-- 화살표 3→4 -->
  <line x1="532" y1="141" x2="548" y2="141" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="554,141 544,137 544,145" fill="#243B53"/>

  <!-- ===== 4단계 ===== -->
  <rect x="554" y="56" width="152" height="170" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="570" y="88" class="num">4</text>
  <text x="570" y="112" class="bb">명세를 붙이고</text>
  <text x="570" y="130" class="bb">검증한다</text>
  <text x="570" y="152" class="n">모아 둔 명세를 손대지</text>
  <text x="570" y="168" class="n">않고 넣고, 같은 입력을</text>
  <text x="570" y="184" class="n">두세 번 넣어 골격 확인.</text>
  <text x="570" y="208" class="n" font-weight="700" fill="#829AB1">흔들리면 그 칸만 손본다</text>
  <text x="570" y="222" class="n" font-weight="700" fill="#829AB1">(대개 한두 칸)</text>

  <!-- 화살표 4→5 -->
  <line x1="706" y1="141" x2="722" y2="141" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="728,141 718,137 718,145" fill="#243B53"/>

  <!-- ===== 5단계 ===== -->
  <rect x="728" y="56" width="152" height="170" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="744" y="88" class="num">5</text>
  <text x="744" y="112" class="bb">옛 시스템과</text>
  <text x="744" y="130" class="bb">한 주기 병행한다</text>
  <text x="744" y="152" class="n">한 주기 동안 나란히</text>
  <text x="744" y="168" class="n">돌려 결과를 맞춘다.</text>
  <text x="744" y="184" class="n">숫자 일치 → 옛 도구 끔.</text>
  <text x="744" y="208" class="n" font-weight="700" fill="#829AB1">4장 검증이 마지막으로</text>
  <text x="744" y="222" class="n" font-weight="700" fill="#829AB1">한 번 더 일하는 자리</text>

  <!-- 단계 요약 한 줄: 모으고·빼내고·다시 그리고·붙이고·맞춰 본다 -->
  <text x="456" y="312" class="b" text-anchor="middle">모으고(이식 자산) · 빼내고(데이터) · 다시 그리고(구조) · 붙이고(명세) · 맞춰 본다(검증)</text>
  <text x="456" y="332" class="n" text-anchor="middle">다섯 단계 중 어디에도 "처음부터 다시"는 없다.</text>

  <!-- ===== 결론 띠 (강조 — 제목 "프로토콜"의 뜻, 도판당 1회 소진) ===== -->
  <rect x="120" y="352" width="672" height="88" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="456" y="386" class="h" text-anchor="middle" fill="#D9480F">다시 짜는 것은 도구에 종속됐던 연결뿐 — 명세는 그대로 옮겨 간다</text>
  <text x="456" y="414" class="b" text-anchor="middle">정해진 순서를 한 번 익혀 두고, 도구가 바뀔 때마다 그 순서를 다시 돌린다.</text>
  <text x="456" y="432" class="n" text-anchor="middle">그게 이 장 제목 "프로토콜"이 뜻하는 바다.</text>

  <text x="32" y="476" class="n">단계·근거는 본문(원고 line 102~120) 및 1부(1~4장) 회수와 일치. 90일·9개월은 그림 12-2 및 자료카드 카드 05·06과 동일.</text>
  <text x="32" y="496" class="n">도구 이름은 단계 노드에 넣지 않는다(본문 line 106). 김지유 병행 한 주기는 가상 인물의 적용 예시.</text>
</svg>
