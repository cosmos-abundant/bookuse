<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 5-4 | ch05-fig04
삽입 위치: 5장 "채널 셋을 한 분류표로 — 자동화의 절반을 여기서 끝낸다" 절,
  기준 문장 "거기서 세 채널을 모두 같은 '통합' 탭으로 보내면, 칸 정렬은 도구가 한다.
  당신이 시트 안에서 함수를 거는 게 아니다 — 채널 연결 때 출력 자리를 한 탭으로 모으는
  것뿐이다."(원고 line 109) 바로 다음.
  (red-team 권고로 1점 추가 제작. 이 절은 원고 line 105~117에 걸쳐 ① 채널별 원본 탭이
   생긴다 ② 거기서 멈추면 1장의 합치기 노동이 그대로 남는다 ③ 그래서 도구의 '출력 탭'을
   채널 원본 탭이 아니라 '통합' 탭으로 지정해 세 채널을 한 모양으로 모은다 ④ 함수를 거는
   게 아니라 출력 자리를 모으는 것뿐 — 을 4문단에 걸쳐 푼다. 글이 동작을 풀고, 이 그림은
   "출력 탭을 통합 탭으로 지정"이라는 핵심 동작이 데이터 흐름의 어디서 일어나는지와,
   그 결과 함수 없이 한 탭이 채워진다는 것을 한 장에 고정한다. 그림 5-1~5-3과 다룸 대상이
   다르다 — 앞 셋은 채널을 '잇는' 인증, 이 그림은 이은 데이터가 '모이는' 분류표 동작.
   중복 없음.)
캡션: 그림 5-4. 출력 탭을 '통합'으로 지정하면, 함수 없이 한 탭에 모인다.
  세 채널을 연결할 때 각 도구에는 "어느 시트 어느 탭에 넣을지" 고르는 자리가 있다. 그
  출력 자리를 채널별 원본 탭이 아니라 같은 '통합' 탭 하나로 지정하면, 칸 정렬은 도구가
  한다. 당신이 시트 안에서 함수(VLOOKUP)를 거는 게 아니라, 연결할 때 출력 자리를 한
  탭으로 모으는 것뿐이다. 원본 탭이 매일 자동으로 갱신될 때 통합 탭도 같이 차오른다 —
  광고 관리자 셋을 열어 손으로 맞추던 그 한 장이, 손대지 않아도 만들어져 있는 상태가
  된다. 이 통합 탭은 값을 제 칸에 정렬해 모으는 데까지이고, 합계·증감·평균 같은 계산은
  6장이 이 탭을 입력으로 받아 한다.
대체 텍스트: 위에서 아래로 흐르는 데이터의 길. 맨 위에 세 채널이 나란히 있다 — 네이버
  (부가기능 또는 플랜 B 수동), 메타(로그인형 커넥터), 구글(로그인형 커넥터). 각 채널을
  연결할 때 그 도구 안에는 "어느 시트 어느 탭의 어느 칸에 넣을지"를 고르는 출력 설정
  자리가 있다. 도판의 핵심은 이 출력 자리를 채널마다 따로인 원본 탭이 아니라, 모두 같은
  '통합' 탭 하나로 지정하는 것이다(가운데의 강조된 동작 "출력 탭을 '통합' 탭으로 지정,
  도구의 칸 이름과 내 칸 이름을 짝지어 둠"). 그러면 도구가 칸 정렬을 대신 해, 맨 아래
  '통합' 탭 한 장에 세 채널이 같은 칸 구조로 줄 맞춰 떨어진다 — 첫 행은 캠페인명, 채널,
  날짜(또는 주차), ROAS, CPA, 전환수 같은, 보고서에 필요한 칸 이름이다. 채널이 섞여도
  ROAS 칸은 ROAS끼리, 전환수 칸은 전환수끼리 한 줄에 정렬된다. 도판 왼쪽 아래에는
  지우는 줄("×")로 표시된 옛 방식이 있다 — 광고 관리자 셋을 열어 VLOOKUP으로 캠페인명을
  맞추던 1장의 합치기 노동. 이 그림이 보여주는 출력 탭 지정 방식은 시트 안에 함수를 한
  줄도 쓰지 않으므로 그 운반 노동을 합치는 단계에서 다시 떠안지 않는다. 도판 오른쪽
  아래에는 경계선이 그어져 있고, 그 너머는 6장의 몫이다 — 이 통합 탭은 값을 제 칸에
  정렬해 모으는 데까지이고, 전주 대비 증감·채널별 합계·평균 ROAS 같은 계산과 분석은
  6장이 이 깨끗한 표를 입력으로 받아 한다. 그래서 칸을 잘 짜 두면 6장이 가벼워지고,
  대충 짜 두면 6장에서 다시 손이 간다 — 자동화의 절반이 이 칸 설계다.
본문/자료카드 정합성: "출력 탭을 채널 원본 탭이 아니라 '통합' 탭으로 지정 → 도구의 칸
  이름과 내 칸 이름을 짝지음 → 칸 정렬은 도구가 함 → 함수를 거는 게 아니라 출력 자리를
  모으는 것"은 원고 line 109와 완전 일치. 통합 탭 칸 이름(캠페인명·채널·날짜/주차·ROAS·
  CPA·전환수)은 원고 line 109·127과 일치. "원본 탭이 갱신될 때 통합 탭도 같이 차오름,
  손대지 않아도 만들어져 있음"은 원고 line 111. "값을 제 칸에 정렬해 모으는 데까지,
  계산·증감·합계·평균은 6장"의 경계는 원고 line 117. VLOOKUP 운반 노동을 다시 떠안지
  않는다는 점은 원고 line 115. 함수 분기(엑셀 함수 아는 독자)는 본문 line 115의 별도
  분기일 뿐 기본 경로가 아니므로 이 그림에는 넣지 않았다(기본 경로만 도해). 자료카드
  카드 11(커넥터 생태계가 시트로 수렴)·카드 20(값을 칸에 나눠 담는 분류표 설계가
  자동화의 절반)에 근거. 이 그림에 수치 표기 없음 — 임의 수치 생성 없음.
페르소나 가드레일: 코드·함수 노출 금지 원칙을 도판 자체로 구현 — 통합은 "출력 탭 지정 +
  도구가 칸 짝짓기"로만 표현하고, VLOOKUP은 '하지 않는 옛 방식'으로 지운 줄 처리. 시트
  안 함수식·표현식·구분자 조작은 일절 표기하지 않음.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 장이 만드는 핵심 동작" 의미. 이 절의 핵심이자 자동화의 절반인
   '출력 탭을 통합 탭으로 지정' 동작 띠 한 곳에만 1회 칠한다. 세 채널 출처와 통합 탭
   결과 표는 잉크색 중립, 지워진 옛 VLOOKUP 방식과 6장 경계·칸 이름 주석은 보조회색·
   점선. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" role="img" aria-labelledby="t d">
  <title id="t">출력 탭을 '통합'으로 지정해, 함수 없이 세 채널을 한 탭에 모으는 흐름</title>
  <desc id="d">네이버·메타·구글 세 채널을 연결할 때 각 도구의 출력 자리를 채널 원본 탭이 아니라 같은 '통합' 탭 하나로 지정하면, 칸 정렬은 도구가 대신 한다. 시트에 함수(VLOOKUP)를 쓰지 않고도 통합 탭에 세 채널이 같은 칸 구조(캠페인명·채널·날짜·ROAS·CPA·전환수)로 줄 맞춰 떨어진다. 광고 관리자 셋을 열어 손으로 맞추던 1장의 합치기 노동이 사라진다. 통합 탭은 값을 정렬해 모으는 데까지이고, 합계·증감·평균 같은 계산은 6장이 받아서 한다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
    .col { font-size: 12px; font-weight: 700; }
    .strike { fill: #829AB1; }
  </style>
  <rect x="0" y="0" width="820" height="600" fill="#FFFFFF"/>

  <!-- ===== 세 채널 출처 ===== -->
  <text x="40" y="34" class="nb">세 채널 — 각 도구에 "어느 탭에 넣을지" 고르는 출력 자리가 있다</text>

  <rect x="40" y="46" width="230" height="72" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="72" class="bb">네이버</text>
  <text x="56" y="94" class="b">부가기능(아임리포트)</text>
  <text x="56" y="111" class="n">또는 플랜 B 수동 다운로드</text>

  <rect x="295" y="46" width="230" height="72" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="311" y="72" class="bb">메타</text>
  <text x="311" y="94" class="b">로그인형 커넥터</text>
  <text x="311" y="111" class="n">계정 로그인 + 예약 갱신</text>

  <rect x="550" y="46" width="230" height="72" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="566" y="72" class="bb">구글</text>
  <text x="566" y="94" class="b">로그인형 커넥터</text>
  <text x="566" y="111" class="n">계정 로그인 + 예약 갱신</text>

  <!-- 세 채널 → 동작 띠로 수렴 -->
  <line x1="155" y1="118" x2="155" y2="140" stroke="#243B53" stroke-width="1.5"/>
  <line x1="410" y1="118" x2="410" y2="140" stroke="#243B53" stroke-width="1.5"/>
  <line x1="665" y1="118" x2="665" y2="140" stroke="#243B53" stroke-width="1.5"/>
  <line x1="155" y1="140" x2="665" y2="140" stroke="#243B53" stroke-width="1.5"/>
  <line x1="410" y1="140" x2="410" y2="158" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="410,164 406,154 414,154" fill="#243B53"/>

  <!-- ===== 핵심 동작 띠 (강조, 도판당 1회) ===== -->
  <rect x="80" y="166" width="660" height="78" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="410" y="194" class="h" text-anchor="middle" fill="#D9480F">핵심 동작 — 출력 탭을 채널 원본이 아니라 '통합' 탭 하나로 지정한다</text>
  <text x="410" y="218" class="b" text-anchor="middle">도구가 시키는 대로 도구의 칸 이름과 내 칸 이름을 짝지어 둔다 → 칸 정렬은 도구가 한다</text>
  <text x="410" y="238" class="nb" text-anchor="middle">시트에 함수(VLOOKUP)를 거는 게 아니다 — 연결할 때 출력 자리를 한 탭으로 모으는 것뿐</text>

  <!-- 동작 → 통합 탭 -->
  <line x1="410" y1="244" x2="410" y2="262" stroke="#D9480F" stroke-width="1.5"/>
  <polygon points="410,268 406,258 414,258" fill="#D9480F"/>

  <!-- ===== 통합 탭 결과 표 ===== -->
  <text x="40" y="290" class="nb">'통합' 탭 — 세 채널이 같은 칸 구조로 줄 맞춰 떨어진다 (매일 원본 갱신될 때 같이 차오름)</text>
  <rect x="40" y="300" width="740" height="150" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>

  <!-- 표 헤더 -->
  <rect x="40" y="300" width="740" height="30" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5"/>
  <text x="56" y="320" class="col">캠페인명</text>
  <text x="216" y="320" class="col">채널</text>
  <text x="306" y="320" class="col">날짜/주차</text>
  <text x="446" y="320" class="col">ROAS</text>
  <text x="546" y="320" class="col">CPA</text>
  <text x="646" y="320" class="col">전환수</text>
  <!-- 세로 구분선 -->
  <line x1="206" y1="300" x2="206" y2="450" stroke="#829AB1" stroke-width="1"/>
  <line x1="296" y1="300" x2="296" y2="450" stroke="#829AB1" stroke-width="1"/>
  <line x1="436" y1="300" x2="436" y2="450" stroke="#829AB1" stroke-width="1"/>
  <line x1="536" y1="300" x2="536" y2="450" stroke="#829AB1" stroke-width="1"/>
  <line x1="636" y1="300" x2="636" y2="450" stroke="#829AB1" stroke-width="1"/>
  <!-- 가로 행선 -->
  <line x1="40" y1="370" x2="780" y2="370" stroke="#829AB1" stroke-width="1"/>
  <line x1="40" y1="410" x2="780" y2="410" stroke="#829AB1" stroke-width="1"/>
  <!-- 행: 채널이 섞여도 칸끼리 정렬됨을 보이되 수치는 적지 않음(임의 수치 금지) -->
  <text x="56" y="356" class="b">여름세일</text>
  <text x="216" y="356" class="b">네이버</text>
  <text x="56" y="396" class="b">여름세일</text>
  <text x="216" y="396" class="b">메타</text>
  <text x="56" y="436" class="b">여름세일</text>
  <text x="216" y="436" class="b">구글</text>
  <!-- 값 칸은 정렬됨 표시(점 표기 — 실제 수치 아님) -->
  <text x="306" y="356" class="n">…</text><text x="446" y="356" class="n">…</text><text x="546" y="356" class="n">…</text><text x="646" y="356" class="n">…</text>
  <text x="306" y="396" class="n">…</text><text x="446" y="396" class="n">…</text><text x="546" y="396" class="n">…</text><text x="646" y="396" class="n">…</text>
  <text x="306" y="436" class="n">…</text><text x="446" y="436" class="n">…</text><text x="546" y="436" class="n">…</text><text x="646" y="436" class="n">…</text>
  <text x="660" y="356" class="n" text-anchor="start"></text>

  <!-- ===== 하단 좌: 사라진 옛 방식 / 하단 우: 6장 경계 ===== -->
  <!-- 옛 방식 (지운 줄) -->
  <rect x="40" y="470" width="360" height="78" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="56" y="494" class="nb">사라진 옛 방식 (1장의 합치기 노동)</text>
  <text x="56" y="516" class="strike" font-size="13" text-decoration="line-through">광고 관리자 셋을 열어 VLOOKUP으로</text>
  <text x="56" y="534" class="strike" font-size="13" text-decoration="line-through">캠페인명을 손으로 맞추던 1시간 38분</text>

  <!-- 6장 경계 -->
  <rect x="420" y="470" width="360" height="78" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="436" y="494" class="nb">여기까지가 5장 · 그 너머는 6장</text>
  <text x="436" y="516" class="b">통합 탭 = 값을 제 칸에 정렬해 모은 깨끗한 표</text>
  <text x="436" y="534" class="n">합계·전주 대비 증감·평균 ROAS는 6장이 받아서 한다</text>

  <!-- 하단 한 줄 -->
  <line x1="40" y1="566" x2="780" y2="566" stroke="#829AB1" stroke-width="1"/>
  <text x="410" y="586" class="n" text-anchor="middle">칸을 잘 짜 두면 6장이 가벼워지고, 대충 짜 두면 6장에서 다시 손이 간다 — 자동화의 절반이 이 칸 설계다. (표의 '…'은 정렬 위치 표시 · 실제 수치 아님)</text>
</svg>
