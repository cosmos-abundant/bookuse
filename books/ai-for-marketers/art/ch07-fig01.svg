<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 7-1 | ch07-fig01
삽입 위치: 7장 "지금 고를 길은 둘 — 그리고 한 도구로 다 되지 않는다" 절,
  기준 문장 "지금 당신이 실제로 고를 선택지는 둘이다 — 매일 아침 이 분야를 가볍게
  훑고 싶으면 ⓐ(챗봇 예약), 경쟁사 페이지의 가격·프로모션을 칸으로 잡고 싶으면
  ⓑ(노코드 자동화)." 가 속한 단락(원고 line 37) 바로 뒤.
  (본문은 ⓐ·ⓑ·ⓒ 세 경로의 깊이·손품·블록 구성을 원고 line 37~49에 걸쳐 풀어낸다.
   글이 각 경로를 설명하고, 이 그림은 "지금 고를 길은 ⓐⓑ 둘, ⓒ는 전망"이라는 위상
   차이와, ⓑ의 네 블록 중 무엇이 5장에서 익숙하고 무엇이 이 장에서 처음인지를 한
   장에 고정한다. 표가 아니라 도식인 이유: 단순 항목 비교가 아니라 'ⓐⓑ는 동급 선택,
   ⓒ는 다른 층(전망)'이라는 위상과, ⓑ 안의 블록별 신·구 구분이라는 구조를 함께
   담아야 하기 때문.)
캡션: 그림 7-1. 매일 아침 브리핑을 만드는 두 길 — 그리고 아직 길이 아닌 한 방향. 가볍게
  훑으려면 ⓐ 챗봇 예약(도구 하나·프롬프트 하나·예약 하나, 깊이는 얕다), 가격·프로모션을
  칸으로 잡으려면 ⓑ 노코드 자동화(예약→수집→AI 요약·분류→전송의 네 블록, 손은 많이 가나
  멀리 간다)다. ⓒ(예약 안에 리서치까지 묶는 도구)는 매력적인 방향이지만 도구 확인이 끝나지
  않아 동급 선택지가 아니라 전망으로만 둔다. ⓑ의 네 블록 중 마지막 로그인형 커넥터는 5장에서
  손에 익혔고, 앞의 세 블록(예약 트리거·요약 블록·전송 블록)이 이 장에서 처음 만나는 부품이다.
  (2026년 6월 기준 기능 경계이며, ⓒ가 동급 선택지로 올라설 날이 올 수 있다. 김지유는 가상 인물.)
대체 텍스트: 매일 아침 경쟁사 동향 브리핑 한 통을 받는다는 같은 목표에서 세 길이 갈린다.
  위쪽 두 길이 "지금 실제로 고를 수 있는 선택지"다. 왼쪽 ⓐ는 챗봇 예약 — ChatGPT Tasks나
  Gemini 예약 작업에 "이 주제·이 키워드의 어제 동향을 매일 아침 요약해 보내라"는 프롬프트
  하나를 걸어 두는 방식이다. 손이 가장 적게 가고(도구 하나·프롬프트 하나·예약 하나), 전송은
  챗봇의 이메일 옵션을 켜기만 하면 된다. 대신 깊이가 얕다 — 브라우징 기반 일반 요약 수준이고
  여러 출처를 교차해 종합하지는 않는다. "이 분야에 어제 무슨 일이 있었나"를 가볍게 훑는 용도다.
  오른쪽 ⓑ는 노코드 자동화 — Make나 Zapier로 네 블록을 잇는다: ① 정한 시각에 스스로 도는
  예약 트리거, ② 경쟁사 페이지·피드에서 내용을 모으는 소스 수집, ③ 모은 것을 AI로 요약·분류,
  ④ 결과를 메일이나 메신저로 보내는 전송. 손이 가장 많이 가지만 가장 멀리 간다 — 어떤 소스를
  어떤 기준으로 어디로 보낼지를 칸칸이 당신이 설계하므로, "가격·기간·채널 세 칸"처럼 칸으로
  받고 싶을 때의 종착지다. 네 블록 중 앞의 셋(예약 트리거·요약 블록·전송 블록)은 이 장에서
  처음 만나는 새 부품이고, 마지막 블록의 로그인형 커넥터 — 받을 계정에 로그인해 권한을 한 번
  허용하는 손동작 — 만 5장에서 메타·구글을 연결할 때 이미 익힌 그대로다. 아래쪽 ⓒ는 점선으로
  떨어져 있다 — 예약 작업 안에서 웹 리서치와 보고서 생성을 함께 하도록 안내하는 도구들이다.
  ⓐ의 한계(예약 따로, 리서치 따로)를 한 도구로 메우려는 매력적인 방향이지만, 제공 플랜·한도와
  "예약 안에서 리서치가 어디까지 결합되는가"가 도구마다 다르고 빠르게 바뀐다. 그래서 이 장은
  ⓒ를 동급 선택지로 권하지 않고 전망으로만 둔다 — 다만 "ChatGPT가 예약과 리서치를 안 묶는다"를
  "모든 AI가 안 묶는다"로 일반화하지 말고, 쓰려는 도구에서 직접 확인한다. 결론: 가볍게 훑으면
  ⓐ, 칸으로 잡으면 ⓑ. 깊이가 다를 뿐 이 둘이 지금 손에 쥘 수 있는 길이다.
본문/자료카드 정합성: ⓐ(챗봇 예약 = ChatGPT Tasks·Gemini 예약 작업, 손 적음·깊이 얕음,
  전송은 챗봇 이메일 옵션)는 원고 line 39·49 및 카드 01·02와 일치. ⓑ(Make/Zapier 네 블록:
  예약 트리거→소스 수집→AI 요약·분류→메일/메신저 전송, Zapier 경쟁사 인텔리전스 레시피
  공식 제공, 앞 세 블록은 이 장에서 처음·마지막 로그인형 커넥터만 5장 회수)는 원고 line 41·49
  및 카드 04와 일치. ⓒ(예약 안에 웹 리서치 결합, 도구마다 결합 정도 다름·빠르게 바뀜·전망으로만)는
  원고 line 43 및 카드 03 반대 근거·미확인 목록(Claude Cowork)과 일치. "예약과 심층 리서치는
  ChatGPT 단독으로 안 묶인다"는 카드 03(중대)과 일치 — 이 그림은 그 경계를 ⓒ를 점선·아래층으로
  분리해 시각화한다. 가짜 AI 출력·가짜 경쟁사명·임의 수치는 넣지 않았다(개념·흐름만). 도구명은
  본문에 등장하는 ChatGPT Tasks·Gemini·Make·Zapier만 표기, 한도(10개)·가격 등 휘발성 수치는
  도판에 넣지 않았다(본문이 시점과 함께 다룸).
페르소나 가드레일: 코드·함수 노출 0. ⓑ의 블록은 "코드 없이 잇는 부품"으로만 표기하고,
  로그인형 커넥터는 "계정 로그인으로 권한 한 번 허용(5장에서 익힘)"으로 풀어 독자가 만지는
  것이 코드가 아님을 못 박는다.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "자동화/목표 상태/이 책이 만드는 것" 의미. 도판당 1회 원칙에 따라
   상단 공통 목표 노드 "매일 아침 브리핑 한 통" 한 곳에만 강조색을 칠한다 — 두 길이 똑같이
   향하는 그 목표가 이 장이 만드는 것이기 때문. ⓐ·ⓑ는 잉크색 중립, ⓒ는 점선 보조회색
   = "아직 아닌 것/전망". 5장에서 익힌 블록은 보조회색 라벨로, 이 장에서 처음인 블록은
   잉크색 실선으로 구분. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" role="img" aria-labelledby="t d">
  <title id="t">매일 아침 브리핑을 만드는 두 길(ⓐ 챗봇 예약·ⓑ 노코드 자동화)과 아직 길이 아닌 한 방향(ⓒ 예약 안 리서치 결합)</title>
  <desc id="d">같은 목표 "매일 아침 경쟁사 동향 브리핑 한 통"에서 세 길이 갈린다. 지금 고를 선택지는 둘 — 가볍게 훑으려면 ⓐ 챗봇 예약(손 적음·깊이 얕음), 가격·프로모션을 칸으로 잡으려면 ⓑ 노코드 자동화(예약 트리거→소스 수집→AI 요약·분류→전송의 네 블록, 손 많이 가나 멀리 감). ⓒ(예약 안에 웹 리서치를 묶는 도구)는 동급 선택지가 아니라 전망으로 점선 분리한다. ⓑ의 네 블록 중 마지막 로그인형 커넥터만 5장에서 익혔고 앞 세 블록이 이 장에서 처음이다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
    .tag { font-size: 11px; font-weight: 700; }
  </style>
  <rect x="0" y="0" width="860" height="640" fill="#FFFFFF"/>

  <!-- ===== 공통 목표 노드 (강조 — 두 길이 똑같이 향하는, 이 책이 만드는 것: 도판당 1회) ===== -->
  <rect x="270" y="24" width="320" height="62" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="430" y="50" class="h acc" text-anchor="middle">매일 아침 브리핑 한 통</text>
  <text x="430" y="72" class="b" text-anchor="middle">세 사이트를 눈으로 훑는 대신, 메일·메신저에 도착</text>

  <!-- 갈래 라벨 -->
  <text x="430" y="108" class="nb" text-anchor="middle">지금 실제로 고를 길은 둘 — 깊이가 다를 뿐이다</text>

  <!-- 분기선: 목표 → ⓐ / ⓑ -->
  <line x1="430" y1="86" x2="430" y2="120" stroke="#243B53" stroke-width="1.5"/>
  <line x1="195" y1="120" x2="665" y2="120" stroke="#243B53" stroke-width="1.5"/>
  <line x1="195" y1="120" x2="195" y2="138" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="195,144 191,134 199,134" fill="#243B53"/>
  <line x1="665" y1="120" x2="665" y2="138" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="665,144 661,134 669,134" fill="#243B53"/>

  <!-- ===== ⓐ 챗봇 예약 ===== -->
  <rect x="40" y="146" width="310" height="262" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="62" y="174" class="h">ⓐ 챗봇 예약 — 얕은 정기 브리핑</text>
  <text x="62" y="196" class="b">ChatGPT Tasks · Gemini 예약 작업에</text>
  <text x="62" y="214" class="b">프롬프트 하나를 걸어 둔다</text>
  <text x="62" y="232" class="n">"이 주제·키워드의 어제 동향을</text>
  <text x="62" y="248" class="n"> 매일 아침 요약해 보내라"</text>
  <line x1="62" y1="262" x2="330" y2="262" stroke="#829AB1" stroke-width="1"/>
  <text x="62" y="284" class="bb">손이 가장 적게 간다</text>
  <text x="62" y="302" class="b">도구 하나 · 프롬프트 하나 · 예약 하나</text>
  <text x="62" y="324" class="b">전송도 단순 — 챗봇의 이메일 옵션을</text>
  <text x="62" y="340" class="b">켜기만 하면 된다(블록 붙일 것 없음)</text>
  <line x1="62" y1="354" x2="330" y2="354" stroke="#829AB1" stroke-width="1"/>
  <text x="62" y="376" class="nb">한계 — 깊이가 얕다</text>
  <text x="62" y="394" class="n">브라우징 기반 일반 요약. 여러 출처를</text>
  <text x="62" y="408" class="n">교차해 종합하지는 않는다</text>

  <!-- ===== ⓑ 노코드 자동화 ===== -->
  <rect x="510" y="146" width="310" height="262" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="532" y="174" class="h">ⓑ 노코드 자동화 — 깊은 파이프라인</text>
  <text x="532" y="196" class="b">Make · Zapier로 네 블록을 잇는다</text>
  <text x="532" y="214" class="n">(코드 없이 부품을 골라 잇는 일)</text>

  <!-- 네 블록 -->
  <rect x="532" y="226" width="266" height="26" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="540" y="243" class="b">① 예약 트리거 <tspan class="tag" fill="#243B53">· 이 장에서 처음</tspan></text>
  <rect x="532" y="256" width="266" height="26" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="540" y="273" class="b">② 소스 수집 <tspan class="tag" fill="#243B53">· 이 장에서 처음</tspan></text>
  <rect x="532" y="286" width="266" height="26" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="540" y="303" class="b">③ AI 요약·분류 <tspan class="tag" fill="#243B53">· 이 장에서 처음</tspan></text>
  <rect x="532" y="316" width="266" height="26" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="540" y="333" class="b">④ 메일·메신저 전송</text>

  <text x="532" y="362" class="nb">④의 로그인형 커넥터만 5장에서 익힘</text>
  <text x="532" y="378" class="n">계정 로그인으로 권한 한 번 허용 — 그 손동작</text>
  <text x="532" y="396" class="bb">손은 많이 가나 가장 멀리 간다 → 칸으로 받기</text>

  <!-- ===== ⓒ 전망 (점선 = 아직 아닌 것) ===== -->
  <line x1="430" y1="408" x2="430" y2="436" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430" y="430" class="nb" text-anchor="middle">참고 — 동급 선택지가 아니라 전망</text>
  <rect x="120" y="440" width="620" height="118" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="142" y="468" class="bb" fill="#829AB1">ⓒ 예약 안에 웹 리서치까지 묶는 도구</text>
  <text x="142" y="490" class="n">예약 작업 안에서 웹 리서치와 보고서 생성을 함께 하도록 안내하는 도구들이 있다.</text>
  <text x="142" y="508" class="n">ⓐ의 한계(예약 따로, 리서치 따로)를 한 도구로 메우려는 매력적인 방향이다.</text>
  <text x="142" y="528" class="n">다만 제공 플랜·한도와 "예약 안에서 리서치가 어디까지 결합되는가"가 도구마다 다르고 빠르게 바뀐다.</text>
  <text x="142" y="546" class="nb" fill="#829AB1">"ChatGPT가 안 묶는다"를 "모든 AI가 안 묶는다"로 일반화 금지 — 쓰려는 도구에서 직접 확인.</text>

  <!-- ===== 하단 결론 ===== -->
  <line x1="40" y1="582" x2="820" y2="582" stroke="#829AB1" stroke-width="1"/>
  <text x="430" y="604" class="b" text-anchor="middle">가볍게 훑으면 ⓐ, 칸으로 잡으면 ⓑ — 깊이가 다를 뿐 이 둘이 지금 손에 쥘 수 있는 길이다.</text>
  <text x="430" y="626" class="n" text-anchor="middle">(2026년 6월 기준 기능 경계 · ⓒ가 동급 선택지로 올라설 날이 올 수 있다 · 김지유는 가상 인물)</text>
</svg>
