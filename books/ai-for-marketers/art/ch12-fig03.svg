<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 12-3 | ch12-fig03
삽입 위치: 12장 "이식 자산과 폐기 자산 — 무엇이 도구와 함께 죽는가" 절,
  본문에 명시된 호출 지점 [그림 12-3 | art/ch12-fig03.svg] 블록 자리(원고 line 73),
  네 가지 이식 자산을 문단으로 다 푼 직후 ~ 데이터 이식성 단서 문단 앞.
  (본문은 이식 자산 넷이 '왜' 도구를 넘어 살아남는지를 문단마다 따로 논증하고,
   폐기 자산 셋이 '왜' 도구와 함께 죽는지를 설명한다. 이 그림은 그 논증을 되풀이하지 않고,
   어느 것이 어느 쪽에 떨어지는지의 '분할'과 "도구가 죽을 때 왼쪽은 옮겨 가고 오른쪽은
   버려진다"는 '이동 방향' 한 가지만 한눈에 고정한다 — 본문 서술과 중복 없음. 책의 1부/2부
   구조가 바로 이 분할이라는 점도 같이 보인다.)
캡션: 그림 12-3. 도구가 죽을 때 — 옮겨 가는 것(이식 자산)과 버려지는 것(폐기 자산).
  1부에서 만든 네 가지(보조·위임·자동화 구분, 자동화 대상 판단 매트릭스, 업무 명세,
  검증 체계)는 도구 이름이 하나도 안 나오는 자산이라 새 도구로 그대로 옮겨 간다. 도구 안에
  짜 둔 연결 설정·클릭 경로·도구 내 구성은 그 도구의 운명을 따라 함께 버려진다. 가장 든든한
  자산은 빼낸 데이터가 아니라 들고 다니는 명세다.
대체 텍스트: 도구가 죽을 때를 가운데 경계선으로 두고 좌우로 가른 분할도. 왼쪽은 이식 자산
  (1부에서 만든 것 — 도구 이름이 하나도 안 나온다): 보조·위임·자동화의 구분(1장, 일을 어느
  깊이로 맡길지 가리는 사고 틀), 자동화 대상 판단(2장, 반복성×규칙성 매트릭스로 자동화할 일과
  사람 몫을 가른 판정), 업무 명세(3장, 입력·출력 형식 고정과 판단 기준 명문화 — 어느 AI에
  넣어도 같은 일을 시키는 핵심 이식 자산), 검증 체계(4장, 숫자 전수 대조·주장 출처 확인·
  고유명사 전수 확인의 검수 3원칙). 오른쪽은 폐기 자산(도구에 종속된 것 — 도구가 죽으면 함께
  사라진다): 특정 도구의 연결 설정, 화면에서 클릭하던 버튼 경로, 그 도구 안에서만 의미가 있는
  자동화 구성. 도구가 죽으면 왼쪽 넷은 그대로 새 도구로 옮겨 가고, 오른쪽 셋은 버려지고 새
  도구에서 새 방식으로 다시 잇는다. 그래서 갈아탈 때 가장 든든한 자산은 빼낸 데이터가 아니라
  들고 다니는 명세다 — 데이터는 빼내도 다시 연결해야 하지만, 명세는 새 도구의 입력창에 붙이는
  순간 같은 일을 시작한다.
본문 정합성: 좌측 4자산(1~4장)·우측 3폐기·이동 방향·"진짜 자산은 명세"는 원고 line 55~73과
  완전 일치. 도구명은 좌측에 한 개도 넣지 않는다(본문 "도구 이름이 하나도 안 나오는 것들"과
  일치, 스타일 UI/도구 비종속 원칙과도 합치). 임의 항목·수치 없음.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 책이 만드는 것/진짜 자산"용. 본문이 "핵심 이식 자산"이자 "가장 든든한
   자산은 명세"라고 못 박은 업무 명세(3장) 카드 한 곳에만 강조 1회. 나머지 이식 자산 셋은
   강조 테두리 묶음 없이 잉크색, 폐기 자산은 점선=버려지는 것으로 표시해 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" role="img" aria-labelledby="t d">
  <title id="t">도구가 죽을 때 옮겨 가는 이식 자산과 버려지는 폐기 자산</title>
  <desc id="d">왼쪽 이식 자산(1부에서 만든 네 가지 — 보조·위임·자동화 구분, 자동화 대상 판단 매트릭스, 업무 명세, 검증 체계)은 도구가 죽어도 새 도구로 그대로 옮겨 가고, 오른쪽 폐기 자산(연결 설정, 클릭 경로, 도구 내 구성)은 도구와 함께 버려진다. 가장 든든한 자산은 빼낸 데이터가 아니라 들고 다니는 명세다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .col { font-size: 15px; font-weight: 700; }
    .acc { fill: #D9480F; }
  </style>
  <rect x="0" y="0" width="780" height="560" fill="#FFFFFF"/>

  <!-- 가운데 경계선: "도구가 죽을 때" -->
  <line x1="390" y1="64" x2="390" y2="488" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="300" y="20" width="180" height="34" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="390" y="42" class="h" text-anchor="middle">도구가 죽을 때</text>

  <!-- ===== 왼쪽: 이식 자산 ===== -->
  <text x="40" y="86" class="col">이식 자산 — 옮겨 간다</text>
  <text x="40" y="104" class="n">1부에서 만든 것 · 도구 이름이 하나도 안 나온다</text>

  <!-- 1장 -->
  <rect x="40" y="116" width="320" height="58" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="139" class="b" font-weight="700">보조 · 위임 · 자동화의 구분 <tspan class="n">(1장)</tspan></text>
  <text x="56" y="160" class="n">일을 어느 깊이로 맡길지 가리는 사고 틀</text>

  <!-- 2장 -->
  <rect x="40" y="184" width="320" height="58" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="207" class="b" font-weight="700">자동화 대상 판단 <tspan class="n">(2장)</tspan></text>
  <text x="56" y="228" class="n">반복성 × 규칙성 매트릭스 — 일을 본다, 도구가 아니라</text>

  <!-- 3장: 강조(핵심 이식 자산·진짜 자산) -->
  <rect x="40" y="252" width="320" height="64" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="56" y="275" class="b" font-weight="700">업무 명세 <tspan class="acc" font-size="11px">★ 핵심 이식 자산</tspan></text>
  <text x="56" y="296" class="n">입력·출력 형식 고정 + 판단 기준 명문화 (3장)</text>
  <text x="56" y="312" class="n">어느 AI에 넣어도 같은 일을 시키는 문서</text>

  <!-- 4장 -->
  <rect x="40" y="326" width="320" height="58" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="349" class="b" font-weight="700">검증 체계 <tspan class="n">(4장)</tspan></text>
  <text x="56" y="370" class="n">숫자 전수 대조 · 주장 출처 확인 · 고유명사 전수 확인</text>

  <!-- ===== 오른쪽: 폐기 자산 (점선 = 버려진다) ===== -->
  <text x="420" y="86" class="col">폐기 자산 — 버려진다</text>
  <text x="420" y="104" class="n">도구에 종속된 것 · 도구가 죽으면 함께 사라진다</text>

  <rect x="420" y="116" width="320" height="50" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="436" y="146" class="b">특정 도구의 <tspan font-weight="700">연결 설정</tspan></text>

  <rect x="420" y="176" width="320" height="50" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="436" y="206" class="b">화면에서 클릭하던 <tspan font-weight="700">버튼 경로</tspan></text>

  <rect x="420" y="236" width="320" height="50" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="436" y="266" class="b">그 도구 안에서만 의미 있는 <tspan font-weight="700">자동화 구성</tspan></text>

  <text x="436" y="318" class="n">아까워할 자산이 아니다 — 새 도구에서</text>
  <text x="436" y="334" class="n">새 도구의 방식으로 다시 잇는다.</text>

  <!-- 이동 방향: 왼쪽은 새 도구로 → -->
  <line x1="360" y1="410" x2="100" y2="410" stroke="#243B53" stroke-width="1.5"/>
  <text x="40" y="406" class="n">왼쪽 넷은</text>
  <text x="40" y="430" class="b" font-weight="700">새 도구로 그대로 →</text>

  <!-- 오른쪽은 폐기 X -->
  <text x="420" y="406" class="n">오른쪽 셋은</text>
  <text x="420" y="430" class="b" font-weight="700">버린다 ✕</text>

  <!-- ===== 하단 결론 띠 (강조 아님 — 강조는 명세 카드 1회로 소진. 잉크 테두리로 처리) ===== -->
  <line x1="40" y1="452" x2="740" y2="452" stroke="#829AB1" stroke-width="1"/>
  <text x="390" y="478" class="h" text-anchor="middle">갈아탈 때 가장 든든한 자산은 빼낸 <tspan fill="#829AB1">데이터</tspan>가 아니라, 들고 다니는 <tspan font-weight="700">명세</tspan>다</text>
  <text x="390" y="500" class="n" text-anchor="middle">데이터는 빼내도 다시 연결해야 하지만, 명세는 새 도구의 입력창에 붙이는 순간 같은 일을 시작한다.</text>
  <text x="390" y="524" class="n" text-anchor="middle">이 책이 1부와 2부로 갈린 이유가 이 분할이다 — 1부에서 만든 것은 이식 자산, 2부에서 만든 것의 절반은 폐기 자산이다.</text>
</svg>
