<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 3-1 | ch03-fig01
삽입 위치: 3장 "잘 쓴 프롬프트와 재사용 가능한 명세는 다른 물건이다" 절,
  기준 문장 "둘의 차이는 글솜씨가 아니라 용도다. 일회성 대화냐, 매주 꺼내 쓸 도구냐."
  바로 다음.
  (본문은 잘 쓴 프롬프트 vs 재사용 명세의 차이를 비유[레시피 카드]까지 동원해 여러 문단에
   걸쳐 푼다 — 이 그림은 그 핵심 전환, '매주 새로 치는 대화'와 '저장해 데이터만 갈아끼우는
   자산'의 주간 사이클 차이를 한 장에 고정한다.
   표가 아닌 이유: 항목 대조가 아니라 '매주 반복되는 두 작업 흐름'의 시간 구조이기 때문.
   이 장의 기존 요소[명세 전문 코드블록·V-2 출력 비교·채점표]와 다룸 대상이 완전히 다르다 — 중복 없음.)
캡션: 그림 3-1. 잘 쓴 프롬프트와 재사용 명세는 다른 물건이다 — 일회성 대화 대 매주 꺼내 쓰는 자산.
  왼쪽은 김지유가 매주 월요일 한 줄 부탁을 새로 치는 흐름이다. 빈칸 네 개를 그때그때 AI가 자기 식으로
  메우고, 그 메움이 매주 달라 화요일의 보고서는 다시 오지 않는다. 오른쪽은 명세를 한 번 적어 저장한 뒤
  매주 그 주 데이터만 갈아 끼우는 흐름이다. 골격이 고정돼 같은 품질로 나온다. 바뀌는 건 글의 길이가
  아니라, 매주 같은 품질이 나오느냐다. (김지유는 가상 인물이다.)
대체 텍스트: 두 열을 나란히 둔 대조도. 왼쪽 열 "일회성 프롬프트 — 매주 새로 친다"는 매주 월요일마다
  "이 광고 데이터로 보고서 코멘트 좀 뽑아줘" 한 줄을 처음부터 다시 입력하는 사이클이다. 그 한 줄에는
  입력 형식·출력 형식·판단 기준·예외 처리 네 칸이 비어 있고, 빈칸을 매주 AI가 제 식으로 메운다. 그래서
  출력은 운이 좋으면 좋고 아니면 두세 번 다시 시켜야 하며, 어제 통한 보고서가 오늘 다시 오지 않는다 —
  자동화가 아니라 매주 같은 일을 새로 부탁하는 수동 반복이다. 오른쪽 열 "재사용 명세 — 한 번 적고 매주
  꺼내 쓴다"는 처음 한 번만 네 칸을 채운 한 장짜리 명세를 저장해 두고, 매주 월요일에는 저장된 명세를
  꺼내 그 주 데이터만 갈아 끼우는 사이클이다. 빈칸이 없으니 AI가 추측할 자리가 없고, 출력은 매주 같은
  골격으로 나온다 — 일회성 대화가 매주 돌릴 자산으로 바뀐다. 두 열의 차이는 글솜씨가 아니라 용도이며,
  바뀌는 것은 글의 길이가 아니라 매주 같은 품질이 나오느냐다.
수치 근거: 본문 "잘 쓴 프롬프트와 재사용 가능한 명세는 다른 물건이다" 절 및 "실전 — 빈약한 프롬프트를
  명세로 키우기" 절(Before 한 줄·After 명세·"저장해 둔 명세를 꺼내 그 주 데이터만 갈아 끼우는 것").
  외부 통계 없음(개념 다이어그램). 자료카드 대응: 카드 01(공식 가이드의 "일관되게 얻기 위한 입력 구조화"
  정의 = 명세=자산 논지).
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "자동화/목표 상태/이 책이 만드는 것" 의미이므로, 오른쪽 '재사용 명세 = 매주 같은
   품질의 자산' 결론 한 곳에만 1회. 왼쪽 일회성 흐름의 '빈칸/다시 옴'은 잉크색 + 점선=불안정/매번 다름으로
   표시해 강조색 의미 충돌을 피한다.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d">
  <title id="t">일회성 프롬프트와 재사용 명세의 차이 — 매주 새로 치는 대화 대 한 번 적고 매주 꺼내 쓰는 자산</title>
  <desc id="d">두 열 대조도. 왼쪽 "일회성 프롬프트": 매주 월요일 한 줄 부탁을 새로 치고, 빈 네 칸을 AI가 매주 다르게 메워 어제의 보고서가 다시 오지 않는다. 오른쪽 "재사용 명세": 한 번 적은 한 장짜리 명세를 저장해 매주 데이터만 갈아 끼워, 같은 골격으로 나온다. 차이는 글솜씨가 아니라 용도다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .colhead { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; }
    .note { font-size: 11px; fill: #829AB1; }
    .notebold { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .concl { font-size: 13px; font-weight: 700; }
  </style>
  <rect x="0" y="0" width="760" height="560" fill="#FFFFFF"/>

  <!-- ===== 왼쪽 열: 일회성 프롬프트 ===== -->
  <text x="40" y="40" class="colhead">일회성 프롬프트</text>
  <text x="40" y="60" class="note">— 매주 월요일, 처음부터 새로 친다</text>

  <!-- 1. 월요일 한 줄 부탁 -->
  <rect x="40" y="76" width="300" height="62" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="100" class="body">"이 광고 데이터로</text>
  <text x="56" y="118" class="body">보고서 코멘트 좀 뽑아줘"</text>
  <text x="56" y="132" class="note">매주 새로 입력하는 한 줄</text>
  <line x1="190" y1="138" x2="190" y2="160" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="190,166 186,156 194,156" fill="#243B53"/>

  <!-- 2. 빈칸 네 개 (점선 = 불안정) -->
  <rect x="40" y="166" width="300" height="92" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="56" y="188" class="notebold">빈칸 네 개 — AI가 매주 제 식으로 메움</text>
  <text x="56" y="208" class="note">입력 형식 □   ·   출력 형식 □</text>
  <text x="56" y="226" class="note">판단 기준 □   ·   예외 처리 □</text>
  <text x="56" y="248" class="note">그 메움이 매주 달라진다</text>
  <line x1="190" y1="258" x2="190" y2="280" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="190,286 186,276 194,276" fill="#829AB1"/>

  <!-- 3. 매주 다른 출력 -->
  <rect x="40" y="286" width="300" height="74" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="56" y="310" class="body">출력이 매주 다르다</text>
  <text x="56" y="330" class="note">운 좋으면 좋고, 아니면 두세 번 다시.</text>
  <text x="56" y="348" class="note">어제 통한 보고서가 오늘 안 온다.</text>

  <!-- 4. 다음 주 = 다시 처음으로 (되돌이 화살표 느낌) -->
  <text x="40" y="392" class="notebold">→ 다음 주 월요일: 다시 맨 위에서 시작</text>
  <text x="40" y="410" class="note">자동화가 아니라, 같은 일을 매주 새로 부탁하는 수동 반복</text>

  <!-- ===== 가운데 구분선 ===== -->
  <line x1="380" y1="32" x2="380" y2="430" stroke="#829AB1" stroke-width="1"/>

  <!-- ===== 오른쪽 열: 재사용 명세 ===== -->
  <text x="420" y="40" class="colhead">재사용 명세</text>
  <text x="420" y="60" class="note">— 한 번 적고, 매주 꺼내 쓴다</text>

  <!-- 1. 처음 한 번: 네 칸을 채운 한 장 명세 -->
  <rect x="420" y="76" width="300" height="92" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="436" y="98" class="notebold">처음 한 번만 — 한 장짜리 명세를 적는다</text>
  <text x="436" y="118" class="body">입력 형식 ✓   ·   출력 형식 ✓</text>
  <text x="436" y="136" class="body">판단 기준 ✓   ·   예외 처리 ✓</text>
  <text x="436" y="158" class="note">빈칸이 없다 → AI가 추측할 자리가 없다</text>

  <!-- 저장 화살표 -->
  <line x1="570" y1="168" x2="570" y2="190" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="570,196 566,186 574,186" fill="#243B53"/>
  <text x="582" y="186" class="note">저장</text>

  <!-- 2. 매주: 데이터만 갈아끼움 -->
  <rect x="420" y="196" width="300" height="62" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="436" y="220" class="body">매주: 저장한 명세를 꺼내</text>
  <text x="436" y="240" class="body">그 주 <tspan font-weight="700">데이터만</tspan> 갈아 끼운다</text>
  <line x1="570" y1="258" x2="570" y2="280" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="570,286 566,276 574,276" fill="#243B53"/>

  <!-- 3. 결론 노드 (강조 = 이 책이 만드는 자산/목표 상태) -->
  <rect x="420" y="286" width="300" height="100" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="436" y="310" class="concl" fill="#D9480F">매주 같은 골격 · 같은 품질</text>
  <text x="436" y="332" class="body">일회성 대화가</text>
  <text x="436" y="350" class="body">매주 돌릴 <tspan font-weight="700">자산</tspan>으로 바뀐다.</text>
  <text x="436" y="372" class="note">바뀌는 건 글의 길이가 아니라, 매주 같은 품질이 나오느냐</text>

  <!-- ===== 하단: 한 줄 결론 ===== -->
  <line x1="40" y1="446" x2="720" y2="446" stroke="#829AB1" stroke-width="1"/>
  <text x="40" y="472" class="body"><tspan font-weight="700">두 열의 차이는 글솜씨가 아니라 용도다.</tspan> 일회성 대화냐, 매주 꺼내 쓸 도구냐.</text>
  <text x="40" y="494" class="note">비유: 잘 쓴 프롬프트가 오늘 한 끼를 잘 차린 것이라면, 명세는 누가 만들어도 같은 맛이 나게 적어 둔 레시피 카드다.</text>
  <text x="40" y="514" class="note">※ 점선 = 매번 달라지는 불안정한 흐름. 김지유는 가상 인물이며 한 줄 부탁·명세 내용은 본문 Before/After와 동일하다.</text>
  <text x="40" y="534" class="note">※ 명세가 잡는 것은 골격이다. 남는 흔들림과 숫자·원인의 진위는 사람이 검수한다(4장).</text>
</svg>
