<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 8-2 | ch08-fig02
삽입 위치: 8장 "저작권과 표절 — 부록이 아니라 여기서" 절의 첫 갈래
  ("우리가 만든 AI 콘텐츠, 우리 권리로 지킬 수 있나") 끝, 원고 line 99에 박힌 호출
  지점 그대로. 기준 문장은 line 95 "이 장 내내 품질을 위해 말해 온 '사람의 손질'이,
  여기 권리 쪽에서도 글자 그대로 똑같이 요구된다. ... 세 함정이 한 처방으로 묶인다고
  도입에서 말한 그 묶임의 가장 단단한 매듭이 여기다."
  (이 그림은 8장 전체의 척추 — 도입 line 7의 "세 함정은 같은 처방 하나로 묶인다"를
   저작권 절에서 매듭짓는 자리에 건다. 본문은 세 함정을 각각 다른 절에서 풀고
   [채널/브랜드 보이스, AI 티, 저작권], 이 그림은 그 셋이 모두 '사람의 최종 손질'
   한 동작으로 수렴한다는 구조를 한 장에 고정한다. 글이 세 절에 흩어져 풀어낸 수렴을
   목록으로는 안 보이므로 도형으로 묶는다 — 이 장의 핵심 메시지 도판.)
캡션: 그림 8-2. 세 함정 — 우리 톤 아님 · AI 티 · 저작권 약함 — 이 모두 "사람의 최종
  손질" 한 처방으로 수렴한다. 품질의 두 함정과 권리의 한 함정이 같은 동작에서 풀린다.
  브랜드 보이스가 안 맞는 것도(품질), AI 티가 나는 것도(품질), 권리가 약한 것도(권리),
  해법은 전부 사람이 마지막에 손질해 창작적 기여를 남기는 일이다. 이 처방은 이 책의
  발명이 아니다 — 미국 저작권청·미국 법원·한국 문체부 안내서가 같은 방향을 가리킨다:
  AI 단독 산출물은 권리가 약하고, 사람의 창작적 기여가 있는 부분만 보호된다.
대체 텍스트: 위쪽에 세 함정이 나란히 있다. 왼쪽 둘은 '품질'로 묶이고 오른쪽 하나는
  '권리'로 묶인다. 첫째 함정은 '우리 톤 아님' — 예시를 넣어도 브랜드 보이스는 근사일
  뿐 완벽 복제가 아니라 우리답지 않은 한 줄이 남는다. 둘째 함정은 'AI 티' — 일반론 도입,
  빈 강조, 과한 균형, 뻔한 전개, 장식성 비유 같은 상투 패턴이 남는다(탐지기로는 못
  거른다). 셋째 함정은 '저작권 약함' — 프롬프트만으로 뽑은 AI 단독 산출물은 우리 권리로
  지키기 어렵다. 세 함정에서 화살표가 모두 아래 한 칸으로 모인다. 그 한 칸이 '사람의
  최종 손질 — 우리 톤으로 다듬고, AI 티를 거르고, 창작적 기여를 남긴다'이다. 셋이 한
  동작으로 풀린다. 맨 아래에는 이 처방이 이 책의 발명이 아니라는 근거 띠가 있다: 미국
  저작권청(2025)은 '프롬프트만으로는 저자가 되기에 충분하지 않다'고 했고, 미국 법원은
  Thaler 사건에서 AI 단독 생성물의 저작권을 부정했으며(2026 대법원 상고 기각으로 확정),
  한국 문체부·저작권위 안내서는 '저작물은 인간의 사상·감정 표현'이라 사람의 창작적 기여가
  있는 부분만 보호된다고 안내한다 — 행정·사법·국내외가 한 방향이다. 도판의 한 줄 결론은
  품질의 두 함정과 권리의 한 함정이 따로 떨어진 요구가 아니라 같은 한 동작에서 동시에
  풀린다는 것이다.
본문/자료카드 정합성: 세 함정의 이름(우리 톤 아님·AI 티·저작권 약함)과 품질 둘/권리 하나
  분류는 원고 line 5와 일치. 단일 처방 '사람의 최종 손질'은 원고 line 7·95와 일치. 브랜드
  보이스 '근사일 뿐 완벽 복제 아님'은 원고 line 41·45(카드 06). AI 티 다섯 패턴(일반론
  도입·빈 강조·과한 균형·뻔한 전개·장식성 비유)은 원고 line 61~69(카드 07, slop-checklist
  S1·S2·S6·S10). '프롬프트만으로는 저자가 되기에 충분하지 않다'는 원고 line 89(카드 01,
  미 저작권청 2025) 직접 인용. Thaler 항소심(2025)·대법원 상고 기각(2026-03)은 원고
  line 91(카드 02). 한국 '인간의 사상·감정 표현 / 창작적 기여 부분만 보호'는 원고 line 93
  (카드 03). 가짜 카피 문구·가짜 변환 출력은 넣지 않았다(함정 라벨과 근거만 — 무결성 H2).
  도판의 수치 0건 — 임의 수치 생성 없음(법·가이드는 연도만 시점 표기).
페르소나 가드레일: 코드 노출 0. '사람의 최종 손질'은 사람이 다듬고 거르고 기여를
  남기는 손동작으로만 표기 — 자동 검수 도구·코드 없음. 법률 라벨은 "법률 자문 아님"
  본문 단서(line 9·83·113)에 종속되는 일반 원칙 수준으로만, 도판은 방향만 표기.
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "이 책이 만드는 것 / 목표 상태" 의미. 세 함정이 수렴하는 결론
   '사람의 최종 손질' 한 칸에만 1회 칠한다 — 이 한 동작이 이 장이 처방하는 것이므로.
   세 함정 칸은 잉크색 중립, 근거 띠(저작권청·법원·문체부)는 보조회색. 강조색 1회
   원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="t d">
  <title id="t">세 함정(우리 톤 아님·AI 티·저작권 약함)이 모두 '사람의 최종 손질' 한 처방으로 수렴하는 구조</title>
  <desc id="d">품질의 두 함정(우리 톤 아님·AI 티)과 권리의 한 함정(저작권 약함)에서 화살표가 모두 아래 한 칸 '사람의 최종 손질'로 모인다. 셋이 같은 한 동작에서 풀린다. 맨 아래 근거 띠: 미 저작권청·미 법원·한국 문체부 안내서가 모두 'AI 단독 산출물은 권리가 약하고 사람의 창작적 기여 부분만 보호된다'는 같은 방향을 가리킨다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
  </style>
  <rect x="0" y="0" width="820" height="560" fill="#FFFFFF"/>

  <!-- ===== 상단 묶음 라벨: 품질 / 권리 ===== -->
  <text x="40" y="40" class="nb">품질의 두 함정</text>
  <line x1="40" y1="48" x2="520" y2="48" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="556" y="40" class="nb">권리의 한 함정</text>
  <line x1="556" y1="48" x2="780" y2="48" stroke="#829AB1" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== 세 함정 ===== -->
  <!-- 함정 1: 우리 톤 아님 -->
  <rect x="40" y="60" width="232" height="128" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="56" y="86" class="bb">함정 ① 우리 톤 아님</text>
  <text x="56" y="110" class="n">예시(few-shot)를 넣어도 보이스는</text>
  <text x="56" y="126" class="n">근사일 뿐 완벽 복제가 아니다</text>
  <text x="56" y="150" class="n">— "우리답지 않은 한 줄"이 남는다</text>
  <text x="56" y="172" class="n">그 한 줄은 우리 톤을 아는 사람만 안다</text>

  <!-- 함정 2: AI 티 -->
  <rect x="294" y="60" width="232" height="128" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="310" y="86" class="bb">함정 ② AI 티</text>
  <text x="310" y="110" class="n">상투 패턴이 남는다 — 일반론 도입 ·</text>
  <text x="310" y="126" class="n">빈 강조 · 과한 균형 · 뻔한 전개 ·</text>
  <text x="310" y="142" class="n">장식성 비유 (다섯 항목 체크리스트)</text>
  <text x="310" y="166" class="n">탐지기로는 못 거른다 — 사람이 패턴으로</text>

  <!-- 함정 3: 저작권 약함 -->
  <rect x="548" y="60" width="232" height="128" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="564" y="86" class="bb">함정 ③ 저작권 약함</text>
  <text x="564" y="110" class="n">프롬프트만으로 뽑은 AI 단독</text>
  <text x="564" y="126" class="n">산출물은 우리 권리로 지키기 어렵다</text>
  <text x="564" y="150" class="n">— 남이 베껴 가도 막기 어렵다는 뜻</text>
  <text x="564" y="172" class="n">(등록 불가 ≠ 사용 불가)</text>

  <!-- 세 함정 → 수렴 화살표 -->
  <line x1="156" y1="188" x2="156" y2="230" stroke="#243B53" stroke-width="1.5"/>
  <line x1="156" y1="230" x2="410" y2="230" stroke="#243B53" stroke-width="1.5"/>
  <line x1="410" y1="188" x2="410" y2="248" stroke="#243B53" stroke-width="1.5"/>
  <line x1="664" y1="188" x2="664" y2="230" stroke="#243B53" stroke-width="1.5"/>
  <line x1="664" y1="230" x2="410" y2="230" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="410,254 405,242 415,242" fill="#243B53"/>

  <!-- ===== 수렴: 사람의 최종 손질 (강조, 도판당 1회) ===== -->
  <rect x="150" y="258" width="520" height="92" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="410" y="288" class="h" text-anchor="middle" fill="#D9480F">한 처방 — 사람의 최종 손질</text>
  <text x="410" y="312" class="b" text-anchor="middle">우리 톤으로 다듬고 · AI 티를 거르고 · 창작적 기여를 남긴다</text>
  <text x="410" y="334" class="b" text-anchor="middle">품질의 두 함정과 권리의 한 함정이 같은 한 동작에서 풀린다</text>

  <!-- 수렴 → 근거 띠 -->
  <line x1="410" y1="350" x2="410" y2="384" stroke="#829AB1" stroke-width="1.5"/>
  <polygon points="410,390 405,378 415,378" fill="#829AB1"/>

  <!-- ===== 근거 띠: 이 책의 발명이 아니다 ===== -->
  <text x="40" y="412" class="nb">이 처방은 이 책의 발명이 아니다 — 행정·사법·국내외가 한 방향 (법률 자문 아님 · 일반 원칙)</text>
  <rect x="40" y="422" width="232" height="106" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" rx="4"/>
  <text x="56" y="446" class="bb">미국 저작권청 (2025)</text>
  <text x="56" y="470" class="n">"프롬프트만으로는 AI 산출물에</text>
  <text x="56" y="486" class="n">대한 통제가 저자가 되기에</text>
  <text x="56" y="502" class="n">충분하지 않다" — 인간 기여분만</text>
  <text x="56" y="518" class="n">보호</text>

  <rect x="294" y="422" width="232" height="106" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" rx="4"/>
  <text x="310" y="446" class="bb">미국 법원 — Thaler</text>
  <text x="310" y="470" class="n">AI 단독 생성물은 인간 저작자가</text>
  <text x="310" y="486" class="n">없어 저작권 불가(항소심 2025)</text>
  <text x="310" y="502" class="n">대법원 상고 기각(2026-03)으로</text>
  <text x="310" y="518" class="n">사실상 확정</text>

  <rect x="548" y="422" width="232" height="106" fill="#FFFFFF" stroke="#829AB1" stroke-width="1.5" rx="4"/>
  <text x="564" y="446" class="bb">한국 문체부·저작권위</text>
  <text x="564" y="470" class="n">저작물은 "인간의 사상·감정</text>
  <text x="564" y="486" class="n">표현" — AI 단독 산출물은 등록</text>
  <text x="564" y="502" class="n">불가, 창작적 기여가 있는</text>
  <text x="564" y="518" class="n">부분만 'AI 활용 저작물'로 보호</text>
</svg>
