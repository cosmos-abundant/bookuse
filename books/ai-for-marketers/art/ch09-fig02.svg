<?xml version="1.0" encoding="UTF-8"?>
<!--
그림 9-2 | ch09-fig02
삽입 위치: 9장 "혼자만 아는 자동화는 가장 큰 약점이다 — 넘겨줄 문서" 절,
  원고 line 94에 박힌 호출 지점 그대로. 기준 문장은 line 92
  "점검을 위해 만든 것이, 그대로 인수인계 문서가 된다."와 line 50
  "표 하나가 세 가지 일을 한다 — 운영하고, 점검하고, 넘긴다."
  (본문 line 50·82~92가 '요일별 루틴 표 한 장이 운영·점검·인수인계 세 곳에 쓰인다'는
   회수를 글로 풀고, 이 그림은 그 내용을 다시 적지 않는다. 대신 같은 표 한 장에서 두
   갈래(위로는 주간 점검의 대상 목록, 아래로는 인수인계 문서의 절반)가 갈라져 나오고,
   거기에 점검 항목·출처·소유자·연락처만 더하면 넘겨줄 문서가 완성된다는 '한 장의 재사용'
   구조를 한눈에 고정한다. 다이어그램인 이유: 표 자체는 본문 line 37~44에 이미 마크다운
   표로 있으므로 표를 다시 그리지 않는다 — 그 한 장이 둘로 쓰인다는 '재사용 관계'만
   그린다. 9-1이 결합 구조(안 깨지게)를, 9-2가 운영 산출물의 재사용(혼자 안 두게)을
   다뤄 역할이 겹치지 않는다.)
캡션: 그림 9-2. 요일별 루틴 표 한 장이 두 갈래로 쓰인다 — 위로는 주간 점검의 대상 목록,
  아래로는 인수인계 문서의 절반. 운영을 위해 이미 만든 그 표가, 점검 항목(네 가지)을
  더하면 주간 점검표가 되고, 출처·소유자·연락처(네 줄)를 더하면 동료에게 넘길 문서가
  된다. 새 노동이 거의 들지 않고 버스 팩터가 1에서 2로 오른다 — 자동화를 아는 사람이
  나 혼자인 상태(휴가도 못 가는 약점)에서 벗어난다.
대체 텍스트: 가운데에 '요일별 운영 루틴 표 한 장(이미 그린 것 — 본문 표)'이 출발점으로
  놓여 있다. 무엇이 언제 도는지, 결과가 어디로 가는지가 그 표 안에 다 들어 있다. 거기서
  화살표가 위아래 두 갈래로 갈라진다. 위쪽 갈래는 '주간 점검의 대상 목록'이다 — 같은 표에
  점검 네 항목을 더한다: 하나, 셋이 이번 주에 예정대로 돌았나(실행 기록). 둘, 결과가
  도착지에 정상 도착했나(빈칸·오류 없나). 셋, 연결·계정·한도에 경고가 떴나(곧 깨질 신호).
  넷, 지난주 검수에서 같은 오류가 반복됐나(두 주 연속이면 명세 손볼 신호). 아래쪽 갈래는
  '인수인계 문서의 절반'이다 — 같은 표에 네 줄을 더한다: 하나, 각 자동화의 입력 출처와
  출력 도착지. 둘, 안 왔을 때 첫 확인 지점(=점검 네 항목이 그대로 보는 순서). 셋, 연결과
  계정의 소유자(단, 아이디·비밀번호·인증값은 적지 않는다 — 보안 사안, 11장). 넷, 막히면
  연락할 사람. 두 갈래가 만나는 결론으로 오른쪽에 '동료에게 넘길 문서 완성'이 강조되어
  있고, 그 옆에 '버스 팩터 1 → 2'라고 적혀 있다. 도판의 한 줄 결론은 '운영을 위해 이미
  만든 표 한 장이 점검표도 되고 인수인계 문서도 된다 — 새 노동 거의 없이 혼자만 아는
  상태에서 벗어난다'이다.
본문/자료카드 정합성: '표 한 장이 운영·점검·인수인계 세 곳에 쓰인다'는 원고 line 50과
  일치. 주간 점검 네 항목(예정대로 돌았나 / 도착지 정상 도착 / 연결·계정·한도 경고 /
  지난주 반복 오류)은 원고 line 62~68 그대로 — 그림이 항목을 발명하지 않았다(카드 06
  골격과 일치). 인수인계 네 줄(입력 출처·출력 도착지 / 안 왔을 때 첫 확인 지점 / 계정
  소유자 / 연락할 사람)은 원고 line 84~90 그대로(카드 03 메모). '로그인 정보는 적지
  않는다(11장)'는 원고 line 88과 일치. '점검 항목이 곧 안 왔을 때 보는 순서'는 원고
  line 86과 일치. '버스 팩터 1 → 2'는 원고 line 78·92와 일치(카드 05). 이 그림에 수치
  표기는 '버스 팩터 1→2'(개념 지표값, 본문 그대로)뿐이며 임의 수치·가짜 운영 출력·실명
  사고 사례는 없다(무결성 H2). CrowdStrike 850만 대는 본문 line 27 소관이라 도판 미포함.
페르소나 가드레일: 코드·함수·노코드 노드 화면 노출 0. '실행 기록'·'커넥터'·'한도 경고'는
  사람이 도구 화면에서 눈으로 보는 항목으로만 표기하고 특정 제품명·API·코드는 넣지 않는다.
  계정 소유자 줄에 로그인 정보 자체를 적지 않는다는 보안 단서를 그림 안에 명시했다(line 88).
스타일: books/ai-for-marketers/art/style.md
  (강조색 #D9480F는 "자동화/목표 상태/이 책이 만드는 것" 의미. 이 절이 만드는 것은 동료에게
   넘길 문서, 곧 버스 팩터를 올리는 산출물이므로 두 갈래가 합쳐지는 결론 '동료에게 넘길 문서
   완성 — 버스 팩터 1→2' 한 곳에만 1회 칠한다. 출발점인 요일별 표와 두 갈래(점검 항목·
   인수인계 줄)는 잉크색 중립, 보안 단서·부가 설명은 보조회색. 강조색 1회 원칙 준수.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 624" width="860" height="624" role="img" aria-labelledby="t d">
  <title id="t">요일별 루틴 표 한 장이 두 갈래(주간 점검 대상 목록 · 인수인계 문서의 절반)로 쓰여 동료에게 넘길 문서가 되는 구조</title>
  <desc id="d">운영을 위해 이미 그린 요일별 루틴 표 한 장에서 두 갈래가 갈라진다. 위로는 점검 네 항목을 더해 주간 점검의 대상 목록이 되고, 아래로는 출처·소유자·연락처 네 줄을 더해 인수인계 문서의 절반이 된다. 둘이 합쳐지면 동료에게 넘길 문서가 완성되고, 버스 팩터가 1에서 2로 오른다 — 새 노동이 거의 없이 혼자만 아는 상태에서 벗어난다.</desc>
  <style>
    text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #243B53; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .n { font-size: 11px; fill: #829AB1; }
    .nb { font-size: 11px; font-weight: 700; fill: #829AB1; }
    .acc { fill: #D9480F; }
  </style>
  <rect x="0" y="0" width="860" height="624" fill="#FFFFFF"/>

  <!-- ===== 출발점: 요일별 루틴 표 한 장 (왼쪽 가운데) ===== -->
  <rect x="24" y="240" width="216" height="120" fill="#F0F4F8" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="132" y="270" class="bb" text-anchor="middle">요일별 운영 루틴 표</text>
  <text x="132" y="290" class="bb" text-anchor="middle">한 장</text>
  <text x="132" y="314" class="n" text-anchor="middle">이미 그린 것 (본문 표)</text>
  <text x="132" y="332" class="n" text-anchor="middle">무엇이 언제 도나 ·</text>
  <text x="132" y="350" class="n" text-anchor="middle">결과가 어디로 가나</text>

  <!-- 출발점 → 위 갈래 -->
  <line x1="240" y1="270" x2="300" y2="150" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="300,150 290,152 296,160" fill="#243B53"/>
  <!-- 출발점 → 아래 갈래 -->
  <line x1="240" y1="330" x2="300" y2="450" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="300,450 296,440 290,448" fill="#243B53"/>

  <!-- ===== 위 갈래: 주간 점검의 대상 목록 ===== -->
  <text x="300" y="40" class="nb">갈래 ① 위로 — 표 + 점검 네 항목 = 주간 점검의 대상 목록</text>
  <rect x="300" y="50" width="408" height="160" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="316" y="74" class="bb">주간 점검 (주 1회 · 10분 · 정해진 항목만)</text>
  <line x1="316" y1="84" x2="692" y2="84" stroke="#829AB1" stroke-width="1"/>
  <text x="316" y="106" class="b">① 셋이 이번 주에 예정대로 돌았나</text>
  <text x="332" y="122" class="n">실행 기록 확인 — 실행 자체가 안 된 게 있나</text>
  <text x="316" y="146" class="b">② 결과가 도착지에 정상 도착했나</text>
  <text x="332" y="162" class="n">시트 빈칸·오류 없나 · 브리핑·초안 왔나</text>
  <text x="316" y="186" class="b">③ 연결·계정·한도에 경고가 떴나</text>
  <text x="332" y="202" class="n">"곧 깨질 신호"를 미리 (대응은 10장)</text>
  <!-- 항목 넷 중 넷째는 폭 절약 위해 우측 칸에 배치 -->
  <text x="496" y="106" class="b">④ 지난주 검수에서</text>
  <text x="496" y="122" class="b">같은 오류가 반복됐나</text>
  <text x="496" y="138" class="n">두 주 연속이면 명세를</text>
  <text x="496" y="154" class="n">손볼 신호 (4장 회수)</text>

  <!-- ===== 아래 갈래: 인수인계 문서의 절반 ===== -->
  <text x="300" y="430" class="nb">갈래 ② 아래로 — 표 + 출처·소유자·연락처 네 줄 = 인수인계 문서의 절반</text>
  <rect x="300" y="440" width="408" height="148" fill="#FFFFFF" stroke="#243B53" stroke-width="1.5" rx="4"/>
  <text x="316" y="464" class="bb">동료에게 넘길 문서 — 표에 네 줄만 더한다</text>
  <line x1="316" y1="474" x2="692" y2="474" stroke="#829AB1" stroke-width="1"/>
  <text x="316" y="496" class="b">① 각 자동화의 입력 출처 · 출력 도착지</text>
  <text x="316" y="518" class="b">② 안 왔을 때 첫 확인 지점</text>
  <text x="332" y="534" class="n">= 위 점검 네 항목이 그대로 "보는 순서"</text>
  <text x="316" y="558" class="b">③ 연결·계정의 소유자</text>
  <text x="332" y="574" class="n">단, 아이디·비밀번호·인증값은 적지 않는다 (보안 — 11장)</text>
  <text x="540" y="518" class="b">④ 막히면 연락할 사람</text>
  <text x="556" y="534" class="n">한 줄이면 된다</text>

  <!-- 두 갈래 → 결론 -->
  <line x1="708" y1="130" x2="746" y2="270" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="746,270 745,259 738,265" fill="#243B53"/>
  <line x1="708" y1="510" x2="746" y2="330" stroke="#243B53" stroke-width="1.5"/>
  <polygon points="746,330 738,335 745,341" fill="#243B53"/>

  <!-- ===== 결론: 강조 1회 ===== -->
  <rect x="700" y="262" width="148" height="76" fill="#FFF4E6" stroke="#D9480F" stroke-width="2" rx="4"/>
  <text x="774" y="288" class="bb" text-anchor="middle" fill="#D9480F">동료에게 넘길</text>
  <text x="774" y="306" class="bb" text-anchor="middle" fill="#D9480F">문서 완성</text>
  <text x="774" y="328" class="b" text-anchor="middle" fill="#D9480F">버스 팩터 1 → 2</text>

  <!-- 하단 한 줄 -->
  <text x="430" y="612" class="n" text-anchor="middle">운영을 위해 이미 만든 표 한 장이 점검표도 되고 인수인계 문서도 된다 — 새 노동 거의 없이 "혼자만 아는" 상태에서 벗어난다. (요일별 표 자체는 본문 표 참조)</text>
</svg>
